<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IGCSE Python</title>
<style>
:root{
  --ink:#16202b; --ink-2:#223142; --ink-3:#31435a;
  --paper:#ffffff; --paper-2:#f3f5f8; --paper-3:#e7ecf1;
  --rule:#d6dee7;
  --text:#16202b; --muted:#5d6b7a;
  --act:#1d5fd8; --act-dark:#164ab0;
  --pass:#12784a; --pass-bg:#e4f4ec;
  --wait:#9a5b00; --wait-bg:#fdf0dd;
  --term-bg:#131c26; --term-fg:#dbe6f0; --term-dim:#7f93a8;
  --term-ok:#57d090; --term-err:#ff8f7a; --term-in:#ffd479;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rad:7px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--sans); color:var(--text);
  background:var(--ink); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--act);outline-offset:2px;border-radius:3px}
.term :focus-visible{outline-color:var(--term-in)}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100dvh}
.top{
  display:flex;align-items:center;gap:14px;
  padding:0 14px;height:50px;flex:0 0 auto;
  background:var(--ink);color:#fff;border-bottom:1px solid #0c141d;
}
.brand{font-weight:640;letter-spacing:-.015em;font-size:15px;white-space:nowrap}
.brand span{color:#8fa6bd;font-weight:450}
.top .sp{flex:1}
.tbtn{
  background:transparent;border:1px solid #3a4b60;color:#cfdae5;
  padding:5px 11px;border-radius:var(--rad);cursor:pointer;font-size:13.5px;
}
.tbtn:hover{background:#26374a;color:#fff}
.status{font-size:13px;color:#8fa6bd;white-space:nowrap}
#who{overflow:hidden;text-overflow:ellipsis;max-width:26ch}
@media (max-width:720px){#who{display:none}}
.status.bad{color:#ff9d8a}

.body{flex:1;display:flex;min-height:0}

/* ---------- sidebar ---------- */
.side{
  width:252px;flex:0 0 252px;background:var(--ink-2);color:#c6d3e0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.side h2{
  margin:0;padding:15px 14px 6px;font-size:12.5px;font-weight:600;
  color:#7e93a9;letter-spacing:.01em;
}
.side ul{list-style:none;margin:0;padding:0}
.ch{
  display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  background:none;border:0;border-left:3px solid transparent;
  padding:7px 13px 7px 11px;cursor:pointer;font-size:14px;line-height:1.4;
  color:#c6d3e0;
}
.ch:hover{background:#2b3d51}
.ch[aria-current=true]{background:#31435a;border-left-color:var(--act);color:#fff;font-weight:560}
.dot{
  flex:0 0 auto;width:15px;height:15px;margin-top:3px;border-radius:50%;
  border:1.5px solid #55697f;display:grid;place-items:center;font-size:10px;
}
.ch.done .dot{background:var(--pass);border-color:var(--pass);color:#fff}
.ch.done .dot::after{content:"✓"}
.ch.tried .dot{border-color:var(--wait);border-style:dashed}

/* ---------- panes ---------- */
.panes{flex:1;display:flex;min-width:0;background:var(--paper-3);gap:1px}
.pane{display:flex;flex-direction:column;min-width:0;background:var(--paper)}
.guide-pane{flex:0 1 470px}
.work-pane{flex:1 1 560px}
.pane-hd{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:9px 15px;border-bottom:1px solid var(--rule);background:var(--paper-2);
  font-size:13px;color:var(--muted);
}
.pane-hd b{color:var(--text);font-size:14px;font-weight:620}
.pane-hd .sp{flex:1}

/* ---------- guide ---------- */
.guide{padding:20px 24px 60px;overflow-y:auto;max-width:70ch}
.guide h1{font-size:22px;line-height:1.25;letter-spacing:-.02em;margin:.1em 0 .6em;font-weight:660}
.guide h2{font-size:16.5px;margin:1.7em 0 .5em;font-weight:640;letter-spacing:-.01em}
.guide h3{font-size:14.5px;margin:1.4em 0 .4em;font-weight:640}
.guide p{margin:0 0 .9em}
.guide ul,.guide ol{margin:0 0 1em;padding-left:1.3em}
.guide li{margin:.25em 0}
.guide a{color:var(--act)}
.guide code{
  font-family:var(--mono);font-size:.875em;background:var(--paper-3);
  padding:.12em .35em;border-radius:4px;
}
.guide pre{
  font-family:var(--mono);font-size:13px;line-height:1.5;
  background:var(--term-bg);color:var(--term-fg);
  padding:12px 14px;border-radius:var(--rad);overflow-x:auto;margin:0 0 1.1em;
}
.guide pre code{background:none;padding:0;font-size:inherit;color:inherit}
.guide blockquote{
  margin:0 0 1.1em;padding:10px 14px;background:#eef4fd;
  border-left:3px solid var(--act);border-radius:0 var(--rad) var(--rad) 0;
}
.guide blockquote p:last-child{margin:0}
.guide table{border-collapse:collapse;margin:0 0 1.1em;font-size:14px;width:100%}
.guide th,.guide td{border:1px solid var(--rule);padding:5px 10px;text-align:left;vertical-align:top}
.guide th{background:var(--paper-2);font-weight:620}
.guide hr{border:0;border-top:1px solid var(--rule);margin:1.6em 0}
.quiz{padding:20px 24px 80px;overflow-y:auto;max-width:70ch}
.quiz h1{font-size:22px;letter-spacing:-.02em;margin:.1em 0 .2em;font-weight:660}
.quiz .lede{color:var(--muted);margin:0 0 1.6em}
.qcard{border:1px solid var(--rule);border-radius:var(--rad);padding:14px 16px;margin:0 0 14px}
.qcard.right{border-color:var(--pass);background:var(--pass-bg)}
.qcard.wrong{border-color:var(--wait);background:var(--wait-bg)}
.qnum{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 .3em}
.qtext{margin:0 0 .8em}
.qtext code{font-family:var(--mono);font-size:.875em;background:var(--paper-3);padding:.12em .35em;border-radius:4px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:5px;cursor:pointer}
.opt:hover{background:var(--paper-2)}
.opt input{margin:3px 0 0;flex:0 0 auto}
.qcode{
  font-family:var(--mono);font-size:13px;line-height:1.7;background:var(--term-bg);
  color:var(--term-fg);padding:11px 13px;border-radius:var(--rad);white-space:pre-wrap;
}
.qcode input{
  font-family:var(--mono);font-size:13px;width:9ch;padding:1px 6px;
  border:0;border-bottom:2px solid var(--term-in);background:#22303e;
  color:var(--term-in);border-radius:3px 3px 0 0;outline:none;
}
.why{margin:.7em 0 0;font-size:13.5px;color:var(--muted)}
.why b{color:var(--text)}
.qbar{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.qscore{font-weight:620}
.tok-kw{color:#9db8ff}.tok-str{color:#a6e3a1}.tok-com{color:#7f93a8;font-style:italic}
.tok-num{color:#ffd479}.tok-fn{color:#7fd6e8}

/* ---------- editor ---------- */
.ed-wrap{flex:1 1 auto;display:flex;min-height:120px;position:relative;overflow:hidden}
.gutter{
  flex:0 0 auto;padding:12px 8px 12px 12px;text-align:right;
  font-family:var(--mono);font-size:13.5px;line-height:21px;
  color:#9fb0c2;background:var(--paper-2);border-right:1px solid var(--rule);
  overflow:hidden;user-select:none;white-space:pre;
}
.gutter .err{color:#c0392b;font-weight:700}
.ed-stack{position:relative;flex:1 1 auto;min-width:0}
/* the two layers must share every metric that affects glyph position */
.ed-hl,.ed{
  position:absolute;top:0;left:0;right:0;bottom:0;margin:0;border:0;
  font-family:var(--mono);font-size:13.5px;line-height:21px;
  padding:12px 14px;white-space:pre;tab-size:4;
  word-wrap:normal;overflow-wrap:normal;text-align:left;
}
.ed-hl{
  pointer-events:none;overflow:hidden;background:var(--paper);
  color:var(--text);
}
.ed-hl code{font:inherit;background:none;padding:0;border-radius:0}
.ed{
  resize:none;outline:none;overflow:auto;background:transparent;
  color:transparent;caret-color:var(--act);
}
.ed::selection{background:rgba(80,150,255,.28)}
.ed::-moz-selection{background:rgba(80,150,255,.28)}
.ed-hl::selection,.ed-hl ::selection{background:transparent}
.ed-hl .tok-kw{color:#1a4fbd;font-weight:600}
.ed-hl .tok-fn{color:#7c3aa0}
.ed-hl .tok-str{color:#0a7a4a}
.ed-hl .tok-com{color:#7b8794;font-style:italic}
.ed-hl .tok-num{color:#9a4a00}
.ed-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:9px 14px;border-top:1px solid var(--rule);background:var(--paper-2);
}
.btn{
  border:1px solid var(--rule);background:var(--paper);border-radius:var(--rad);
  padding:6px 13px;cursor:pointer;font-size:13.5px;font-weight:520;
}
.btn:hover:not(:disabled){background:var(--paper-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn.run{background:var(--act);border-color:var(--act);color:#fff}
.btn.run:hover:not(:disabled){background:var(--act-dark)}
.btn.check{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.check:hover:not(:disabled){background:var(--ink-3)}
.ed-bar .sp{flex:1}
.hint{font-size:12.5px;color:var(--muted)}

/* ---------- terminal ---------- */
.term{
  flex:0 0 auto;height:38%;min-height:130px;display:flex;flex-direction:column;
  background:var(--term-bg);color:var(--term-fg);border-top:1px solid #0c141d;
}
.term-tabs{display:flex;gap:2px;padding:6px 8px 0;flex:0 0 auto}
.ttab{
  background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--term-dim);padding:5px 11px;cursor:pointer;font-size:13px;border-radius:4px 4px 0 0;
}
.ttab:hover{color:#fff}
.ttab[aria-selected=true]{color:#fff;border-bottom-color:var(--act);background:#1d2936}
.ttab .pill{
  display:inline-block;margin-left:6px;padding:0 6px;border-radius:9px;
  font-size:11px;font-weight:640;background:#33475c;color:#cfdae5;
}
.ttab .pill.ok{background:var(--pass);color:#fff}
.ttab .pill.no{background:#8a3c2c;color:#fff}
.term-body{
  flex:1;overflow-y:auto;padding:10px 14px 14px;
  font-family:var(--mono);font-size:13px;line-height:1.55;
}
.out{white-space:pre-wrap;word-break:break-word;margin:0}
.err{color:var(--term-err);white-space:pre-wrap;margin:.5em 0 0}
.note{color:var(--term-dim);margin:0}
.in-row{display:flex;align-items:center;gap:7px;margin-top:2px}
.in-row .caret{color:var(--term-in);flex:0 0 auto}
.in-row input{
  flex:1;background:transparent;border:0;outline:none;
  color:var(--term-in);font-family:var(--mono);font-size:13px;padding:2px 0;
  border-bottom:1px dotted #4b5f75;
}
/* results */
.res{margin:0;padding:0;list-style:none}
.res li{display:flex;gap:9px;padding:5px 0;border-bottom:1px solid #22303e;align-items:flex-start}
.res li:last-child{border-bottom:0}
.mark{flex:0 0 auto;width:16px;text-align:center;font-weight:700}
.mark.ok{color:var(--term-ok)}.mark.no{color:var(--term-err)}
.res .why{color:var(--term-dim);display:block;margin-top:2px}
.res .why code{color:#cfe0f0;background:#22303e;padding:.1em .3em;border-radius:3px}
.banner{
  margin:0 0 10px;padding:8px 11px;border-radius:var(--rad);
  background:#17342a;color:var(--term-ok);font-family:var(--sans);font-size:13.5px;
}
.banner.no{background:#33231e;color:#ffbfae}
.files pre{
  background:#1d2936;padding:9px 11px;border-radius:var(--rad);
  margin:.3em 0 .9em;white-space:pre-wrap;word-break:break-word;
}
.files h4{margin:.2em 0 .1em;font-family:var(--sans);font-size:13px;color:var(--term-dim);font-weight:600}

/* ---------- overlay / report ---------- */
.boot{
  position:fixed;inset:0;background:var(--ink);color:#cfdae5;z-index:50;
  display:grid;place-items:center;padding:24px;text-align:center;
}
.boot .in{max-width:38ch}
.boot h1{font-size:19px;margin:0 0 .5em;color:#fff;font-weight:640}
.boot p{margin:0 0 .6em;font-size:14px;color:#93a7bc}
.bar{height:3px;background:#31435a;border-radius:2px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:35%;background:var(--act);animation:sl 1.3s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
.modal{position:fixed;inset:0;background:rgba(10,16,22,.72);z-index:60;display:grid;place-items:center;padding:18px}
.sheet{
  background:var(--paper);border-radius:10px;max-width:640px;width:100%;
  max-height:82dvh;overflow-y:auto;padding:22px 24px;
}
.sheet h2{margin:0 0 .1em;font-size:19px;font-weight:660;letter-spacing:-.015em}
.sheet .sub{color:var(--muted);font-size:13.5px;margin:0 0 1.1em}
.sheet table{border-collapse:collapse;width:100%;font-size:14px;margin-bottom:1.2em}
.sheet th,.sheet td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left}
.sheet td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet .row{display:flex;gap:9px;flex-wrap:wrap}
.pick{display:flex;flex-direction:column;gap:8px;margin:1.1em 0 0}
.pick button{
  text-align:left;border:1px solid var(--rule);background:var(--paper);
  border-radius:var(--rad);padding:11px 14px;cursor:pointer;font-size:15px;
}
.pick button:hover{background:var(--paper-2);border-color:var(--act)}
.meter{height:6px;background:var(--paper-3);border-radius:3px;overflow:hidden;min-width:70px;flex:1}
.meter i{display:block;height:100%;background:var(--pass)}

/* ---------- mobile ---------- */
body.quizmode .work-pane{display:none}
body.quizmode .guide-pane{flex:1 1 auto;max-width:none}
.mtabs{display:none}
.scrim{display:none}
@media (max-width:860px){
  .side{
    position:fixed;top:50px;bottom:0;left:0;z-index:40;width:270px;
    transform:translateX(-100%);transition:transform .18s ease;
  }
  body.nav .side{transform:none}
  body.nav .scrim{display:block;position:fixed;inset:50px 0 0;background:rgba(10,16,22,.5);z-index:35}
  @media (prefers-reduced-motion:reduce){.side{transition:none}}
  .mtabs{display:flex;gap:2px;padding:0 8px;background:var(--paper-2);border-bottom:1px solid var(--rule)}
  body.quizmode .mtabs{display:none}
  .mtab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;cursor:pointer;font-size:14px;color:var(--muted)}
  .mtab[aria-selected=true]{color:var(--text);border-bottom-color:var(--act);font-weight:600}
  .panes{flex-direction:column}
  .guide-pane,.work-pane{flex:1 1 auto}
  body[data-mv=code] .guide-pane{display:none}
  body[data-mv=task] .work-pane{display:none}
  .term{height:44%}
}
@media (min-width:861px){.menu-btn{display:none}}
</style>
</head>
<body data-mv="task">

<div class="boot" id="boot">
  <div class="in">
    <h1>Starting Python</h1>
    <p id="bootmsg">Getting the workbook ready.</p>
    <div class="bar"><i></i></div>
  </div>
</div>

<div class="app">
  <header class="top">
    <button class="tbtn menu-btn" id="menuBtn" aria-label="Show contents">Contents</button>
    <div class="brand">IGCSE Python <span>· workbook</span></div>
    <div class="sp"></div>
    <div class="status" id="who"></div>
    <div class="status" id="status">loading</div>
    <button class="tbtn" id="reportBtn">Progress</button>
  </header>

  <div class="body">
    <div class="scrim" id="scrim"></div>
    <nav class="side" id="side" aria-label="Contents"></nav>
    <div class="panes">
      <div class="mtabs" role="tablist">
        <button class="mtab" id="mtTask" role="tab" aria-selected="true">Task</button>
        <button class="mtab" id="mtCode" role="tab" aria-selected="false">Code</button>
      </div>
      <section class="pane guide-pane">
        <div class="pane-hd"><b id="chTitle">&nbsp;</b><span class="sp"></span><span id="chKind"></span></div>
        <div class="guide" id="guide"></div>
      </section>
      <section class="pane work-pane">
        <div class="ed-wrap">
          <div class="gutter" id="gutter">1</div>

            <pre class="ed-hl" id="edhl" aria-hidden="true"><code></code></pre>
            <textarea class="ed" id="ed" spellcheck="false" autocomplete="off"
                      autocapitalize="off" autocorrect="off" aria-label="Python code"></textarea>
          </div>
        </div>
        <div class="ed-bar">
          <button class="btn run" id="runBtn">Run</button>
          <button class="btn check" id="checkBtn">Check answer</button>

          <button class="btn" id="solBtn" hidden>Model answer</button>
          <button class="btn" id="resetBtn">Reset code</button>
        </div>
        <div class="term">
          <div class="term-tabs" role="tablist">
            <button class="ttab" id="tabOut" role="tab" aria-selected="true">Console</button>
            <button class="ttab" id="tabRes" role="tab" aria-selected="false">Tests <span class="pill" id="resPill" hidden></span></button>
            <button class="ttab" id="tabFiles" role="tab" aria-selected="false" hidden>Files</button>
          </div>
          <div class="term-body" id="termBody"></div>
        </div>
      </section>
    </div>
  </div>
</div>

<script type="application/json" id="bookdata">{"id":"7797c87d-824a-481f-a3ba-a2581befbb25","name":"IGCSE Computer Science - Python","children":[{"id":"b062677e-c565-42dc-9711-3214eadfd5e9","name":"1. Sequence, input and output","children":[{"id":"e15fb122-b3fa-4d90-8af1-6ac469582a87","name":"Example: variables and output","guide":"# Variables and output\n\nA **variable** is a named box that stores a value. Give it a value with `=`,\nthen use its name whenever you want the value.\n\n`print()` puts things on the screen. Separate several items with commas.\n\n\u003e **Exam link:** in pseudocode this is `studentName \u003c- \"Ada Lovelace\"` and\n\u003e `OUTPUT studentName`.\n\n## Your turn\nRun the code, then change `studentName` to your own name and run it again.\n","starter":"# EXAMPLE - read this, run it, then change something and run it again.\n\nstudentName = \"Ada Lovelace\"\nbirthYear = 1815\n\nprint(\"Name:\", studentName)\nprint(\"Born:\", birthYear)\nprint(\"Age in 2026:\", 2026 - birthYear)\n","isExample":true},{"id":"3ccb96b1-0c32-411b-b613-65941bf37dd4","name":"Greeting","guide":"# Greeting\n\nAsk the user for their name and print a greeting.\n\n```\nEnter your name: Minji\nHello Minji\n```\n\n## Hint\n`input()` always gives back a **string**. Print two things with a comma:\n`print(\"Hello\", studentName)`\n","starter":"# Ask the user for their name, then greet them.\n\nstudentName = input(\"Enter your name: \")\n\n# TODO: print Hello followed by their name\n","tests":[{"in":"Minji","out":[{"pattern":"Hello Minji","ignore":"wc"}]},{"in":"Tom","out":[{"pattern":"Hello Tom","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nstudentName = input(\"Enter your name: \")\nprint(\"Hello\", studentName)\n"},{"id":"49083cae-9fda-456f-91a6-565db1dcabc9","name":"Add two numbers","guide":"# Add two numbers\n\nInput two whole numbers and output their total.\n\n```\nEnter the first number: 4\nEnter the second number: 7\n11\n```\n\n## Hint\n`input()` returns a string, so `\"4\" + \"7\"` gives `\"47\"`. Wrap it in `int(...)`\nfirst. Turning one data type into another is called **casting**.\n","starter":"# Input two whole numbers and print their total.\n\nfirstNumber = int(input(\"Enter the first number: \"))\n\n# TODO: input the second number (remember int(...) )\n# TODO: print the total\n","tests":[{"in":[4,7],"out":[{"pattern":"11"},{"typ":"c+","pattern":"int\\(input\\(","count":2,"ignore":"w"}]},{"in":[20,15],"out":[{"pattern":"35"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nfirstNumber = int(input(\"Enter the first number: \"))\nsecondNumber = int(input(\"Enter the second number: \"))\nprint(firstNumber + secondNumber)\n"},{"id":"e4e41467-693a-4377-b682-693397b9b935","name":"Area of a rectangle","guide":"# Area of a rectangle\n\nInput a width and a height (both whole numbers) and output the area.\n\n```\nEnter the width: 5\nEnter the height: 3\nArea: 15\n```\n\n## Hint\nMultiplication uses `*`.\n","starter":"# Input the width and height of a rectangle, output its area.\n\n# TODO\n","tests":[{"in":[5,3],"out":[{"pattern":"15"}]},{"in":[7,2],"out":[{"pattern":"14"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nwidth = int(input(\"Enter the width: \"))\nheight = int(input(\"Enter the height: \"))\nprint(\"Area:\", width * height)\n"},{"id":"3c4f146b-f96b-4d1d-bce1-1f46640eeb08","name":"The five data types","guide":"# The five data types\n\n| IGCSE name | Python | Example |\n|---|---|---|\n| String | `str` | `\"Minji\"` |\n| Integer | `int` | `10` |\n| Real | `float` | `72.5` |\n| Boolean | `bool` | `True` |\n| Char | `str` of length 1 | `\"A\"` |\n\n`type()` tells you what data type a value is.\n\n## Task\nCreate one variable of **each** of these types and print its type using\n`type()`. Use these names exactly:\n\n* `studentName` - a string\n* `yearGroup` - an integer\n* `averageScore` - a real number\n* `hasLaptop` - a Boolean\n* `grade` - a single character\n\n## Hint\n`print(type(yearGroup))` prints `\u003cclass 'int'\u003e`.\n","starter":"# Create one variable of each data type, then print each one's type.\n\nstudentName = \"Minji\"\n\nprint(type(studentName))\n\n# TODO: add yearGroup, averageScore, hasLaptop and grade\n","tests":[{"in":"","out":[{"pattern":"class 'str'"},{"pattern":"class 'int'"},{"pattern":"class 'float'"},{"pattern":"class 'bool'"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nstudentName = \"Minji\"\nyearGroup = 10\naverageScore = 72.5\nhasLaptop = True\ngrade = \"A\"\n\nprint(type(studentName))\nprint(type(yearGroup))\nprint(type(averageScore))\nprint(type(hasLaptop))\nprint(type(grade))\n"},{"id":"8a8a4131-5774-45e1-a634-4ae0a5510a33","name":"Constants","guide":"# Constants\n\nA **constant** is a named value that **never changes** while the program runs.\nWe write constants in CAPITALS so nobody changes them by accident.\n\n## Task\nA shop adds 10% tax to every price.\n\n* Create a constant `TAX` set to `0.1`\n* Ask the user for a price\n* Work out the tax and the total\n* Print the total\n\n```\nEnter the price: 10000\nTotal: 11000\n```\n\n\u003e **Exam link:** in pseudocode this is `CONSTANT TAX = 0.1`.\n","starter":"# Use a constant for the tax rate.\n\nTAX = 0.1\n\nprice = int(input(\"Enter the price: \"))\n\n# TODO: work out the total and print it\n","tests":[{"in":[10000],"out":[{"pattern":"11000"},{"typ":"c+","pattern":"TAX","ignore":"w"}]},{"in":[5000],"out":[{"pattern":"5500"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nTAX = 0.1\n\nprice = int(input(\"Enter the price: \"))\ntotal = price + price * TAX\nprint(\"Total:\", total)\n"},{"id":"theory-01","name":"Theory check","quiz":[{"type":"mcq","q":"What data type does \u003ccode\u003einput()\u003c/code\u003e always return?","options":["Integer","String","Real","Boolean"],"answer":1,"explain":"input() always returns a string, even when the user types digits. That is why you need to cast it."},{"type":"blank","q":"Complete the line so the age is stored as a whole number.","code":"age = ____(input(\"Enter your age: \"))","answer":["int"],"explain":"int() casts the string returned by input() into an integer."},{"type":"mcq","q":"Which of these is a \u003cb\u003econstant\u003c/b\u003e?","options":["\u003ccode\u003escore = 0\u003c/code\u003e","\u003ccode\u003eTAX = 0.1\u003c/code\u003e","\u003ccode\u003etotal = price * 2\u003c/code\u003e","\u003ccode\u003ename = input()\u003c/code\u003e"],"answer":1,"explain":"A constant never changes while the program runs. We write them in CAPITALS."},{"type":"mcq","q":"What data type is \u003ccode\u003e72.5\u003c/code\u003e?","options":["Integer","Char","Real","String"],"answer":2,"explain":"A number with a decimal point is a real (Python calls it a float)."},{"type":"blank","q":"In exam pseudocode, which symbol assigns a value to a variable?","code":"studentName ____ \"Ada\"","answer":["\u003c-","\u003c--"],"explain":"Pseudocode uses \u003c- for assignment. Python uses =."}]}]},{"id":"5411d6fe-04ec-4140-b985-800e63730d4c","name":"2. Arithmetic and library routines","children":[{"id":"91930439-e4a2-4aed-8143-fd4b1610861e","name":"Example: the operators","guide":"# Arithmetic operators\n\n| Python | Pseudocode | Meaning | `7` and `2` |\n|---|---|---|---|\n| `+` | `+` | add | `9` |\n| `-` | `-` | subtract | `5` |\n| `*` | `*` | multiply | `14` |\n| `/` | `/` | divide | `3.5` |\n| `//` | `DIV` | whole part of a division | `3` |\n| `%` | `MOD` | the remainder | `1` |\n| `**` | `^` | raised to the power of | `49` |\n\n`DIV` and `MOD` are how you split a number into parts. They come up in almost\nevery exam paper.\n","starter":"# EXAMPLE - run this and check every answer by hand.\n\nprint(7 + 2)\nprint(7 - 2)\nprint(7 * 2)\nprint(7 / 2)\nprint(7 // 2)    # DIV - the whole part only\nprint(7 % 2)     # MOD - the remainder\nprint(7 ** 2)    # 7 to the power of 2\n","isExample":true},{"id":"4fac9b4f-d91c-4e7d-8db2-a1788ba54bb7","name":"DIV and MOD","guide":"# DIV and MOD\n\nInput a number of seconds and print how many whole **minutes** and how many\n**seconds** are left over.\n\nPrint it exactly like this:\n\n```\nEnter the seconds: 250\n4 minutes and 10 seconds\n```\n\n## Hint\n`//` gives the whole minutes. `%` gives the leftover seconds.\n","starter":"# Convert seconds into minutes and seconds.\n\ntotalSeconds = int(input(\"Enter the seconds: \"))\n\n# TODO: use // and % then print the result\n","tests":[{"in":[250],"out":[{"pattern":"4 minutes and 10 seconds","ignore":"w"},{"typ":"c+","pattern":"//","ignore":"w"},{"typ":"c+","pattern":"%","ignore":"w"}]},{"in":[3600],"out":[{"pattern":"60 minutes and 0 seconds","ignore":"w"}]},{"in":[59],"out":[{"pattern":"0 minutes and 59 seconds","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\ntotalSeconds = int(input(\"Enter the seconds: \"))\n\nminutes = totalSeconds // 60\nseconds = totalSeconds % 60\n\nprint(minutes, \"minutes and\", seconds, \"seconds\")\n"},{"id":"fdac23ca-78fd-47f1-b944-d6d3704f8ffc","name":"Powers","guide":"# Powers\n\nIn pseudocode `^` means \"raised to the power of\". In Python it is `**`.\n\n## Task\nInput the length of one side of a cube, then print:\n\n```\nEnter the side: 4\nArea of one face: 16\nVolume: 64\n```\n\n## Hint\n`side ** 2` is the area of a square. `side ** 3` is the volume of a cube.\n","starter":"# Use ** to work out an area and a volume.\n\nside = int(input(\"Enter the side: \"))\n\n# TODO\n","tests":[{"in":[4],"out":[{"pattern":"Area of one face: 16","ignore":"w"},{"pattern":"Volume: 64","ignore":"w"},{"typ":"c+","pattern":"\\*\\*","ignore":"w"}]},{"in":[10],"out":[{"pattern":"Area of one face: 100","ignore":"w"},{"pattern":"Volume: 1000","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nside = int(input(\"Enter the side: \"))\n\nprint(\"Area of one face:\", side ** 2)\nprint(\"Volume:\", side ** 3)\n"},{"id":"59dbdae4-8d93-4072-930b-999c6552cf39","name":"ROUND","guide":"# The ROUND library routine\n\n`round(value, places)` rounds a real number to a set number of decimal places.\nIt is one of the **library routines** named in the syllabus.\n\n## Task\nInput three test scores, work out the average, and print it rounded to\n**1 decimal place**.\n\n```\nEnter a score: 70\nEnter a score: 75\nEnter a score: 81\nAverage: 75.3\n```\n\n## Hint\n`round(75.3333, 1)` gives `75.3`.\n","starter":"# Work out an average and round it.\n\n# TODO: input three scores, average them, print rounded to 1 decimal place\n","tests":[{"in":[70,75,81],"out":[{"pattern":"75.3"},{"typ":"c+","pattern":"round\\(","ignore":"w"}]},{"in":[10,20,31],"out":[{"pattern":"20.3"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nfirst = int(input(\"Enter a score: \"))\nsecond = int(input(\"Enter a score: \"))\nthird = int(input(\"Enter a score: \"))\n\naverage = (first + second + third) / 3\n\nprint(\"Average:\", round(average, 1))\n"},{"id":"077f518a-7ea9-4f5e-b09b-205ba23b0430","name":"RANDOM","guide":"# The RANDOM library routine\n\n`random.randint(low, high)` gives a random whole number between `low` and\n`high` **inclusive**. You must `import random` first.\n\n## Task\nRoll two dice and print each roll and the total, exactly like this:\n\n```\nDice 1: 4\nDice 2: 6\nTotal: 10\n```\n\nRun it several times - you should get different numbers each time.\n\n## Hint\n`random.randint(1, 6)` gives a number from 1 to 6.\n","starter":"import random\n\n# TODO: roll two dice and print them and the total\n","tests":[{"in":"","out":[{"pattern":"Dice 1: [1-6]","ignore":"w"},{"pattern":"Dice 2: [1-6]","ignore":"w"},{"pattern":"Total: ([2-9]|1[0-2])","ignore":"w"},{"typ":"c+","pattern":"randint","count":2,"ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nimport random\n\ndiceOne = random.randint(1, 6)\ndiceTwo = random.randint(1, 6)\n\nprint(\"Dice 1:\", diceOne)\nprint(\"Dice 2:\", diceTwo)\nprint(\"Total:\", diceOne + diceTwo)\n"},{"id":"theory-02","name":"Theory check","quiz":[{"type":"mcq","q":"What is \u003ccode\u003e17 DIV 5\u003c/code\u003e?","options":["3","3.4","2","85"],"answer":0,"explain":"DIV gives the whole part of the division only, so 3. In Python that is 17 // 5."},{"type":"mcq","q":"What is \u003ccode\u003e17 MOD 5\u003c/code\u003e?","options":["3","2","3.4","12"],"answer":1,"explain":"MOD gives the remainder. 5 goes into 17 three times with 2 left over."},{"type":"blank","q":"The pseudocode operator \u003ccode\u003e^\u003c/code\u003e means 'raised to the power of'. Write the Python equivalent.","code":"volume = side ____ 3","answer":["**"],"explain":"Python uses ** for powers. side ** 3 is side cubed."},{"type":"mcq","q":"What does \u003ccode\u003eround(3.567, 1)\u003c/code\u003e give?","options":["3","3.5","3.6","4"],"answer":2,"explain":"The 1 means one decimal place, and 3.567 rounds up to 3.6."},{"type":"blank","q":"Complete the line so it gives a random whole number from 1 to 6.","code":"roll = random.____(1, 6)","answer":["randint"],"explain":"randint includes both end values, so 1 and 6 are both possible."}]}]},{"id":"ef4165fc-959b-4d21-97e5-40881cf4f600","name":"3. Selection","children":[{"id":"7c3b104d-9bab-4b9f-b771-914ef8148041","name":"Example: if / else","guide":"# Making a decision\n\n`if` runs a block only when a condition is `True`.\n\n| Python | Pseudocode | Meaning |\n|---|---|---|\n| `==` | `=` | equal to |\n| `!=` | `\u003c\u003e` | not equal to |\n| `\u003c` `\u003e` | `\u003c` `\u003e` | less / greater than |\n| `\u003c=` `\u003e=` | `\u003c=` `\u003e=` | less / greater than or equal |\n| `and` | `AND` | both true |\n| `or` | `OR` | at least one true |\n| `not` | `NOT` | the opposite |\n\nWatch the **colon** at the end of the `if` line and the **indentation**\nunderneath. `=` assigns, `==` compares.\n","starter":"# EXAMPLE - selection lets the program choose between paths.\n\nage = int(input(\"How old are you? \"))\n\nif age \u003e= 19:\n    print(\"You are an adult\")\nelse:\n    print(\"You are a minor\")\n","isExample":true},{"id":"1c181815-eed7-4479-aaf1-15ed441b8ed5","name":"The larger number","guide":"# The larger number\n\nInput two whole numbers and output whichever is larger. If they are the same,\noutput that number.\n\n```\nEnter a: 5\nEnter b: 6\n6\n```\n","starter":"# Input two numbers and output the larger one.\n\n# TODO\n","tests":[{"in":[5,6],"out":[{"pattern":"6"}]},{"in":[9,2],"out":[{"pattern":"9"}]},{"in":[4,4],"out":[{"pattern":"4"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\na = int(input(\"Enter a: \"))\nb = int(input(\"Enter b: \"))\n\nif a \u003e b:\n    print(a)\nelse:\n    print(b)\n"},{"id":"5a29d1e9-9141-46d4-9e32-ff8718f27f75","name":"Exam grade","guide":"# Exam grade\n\nInput a mark out of 100 and output the grade.\n\n| Mark | Grade |\n|---|---|\n| 80 - 100 | A |\n| 70 - 79 | B |\n| 60 - 69 | C |\n| 50 - 59 | D |\n| 0 - 49 | U |\n\nPrint exactly: `Grade A`\n\n## Hint\nUse `elif`. Test the highest boundary first, then you only need one comparison\nper branch.\n","starter":"# Input a mark and output the grade. Print like this:  Grade A\n\nmark = int(input(\"Enter the mark: \"))\n\n# TODO\n","tests":[{"in":[85],"out":[{"pattern":"Grade A","ignore":"w"}]},{"in":[72],"out":[{"pattern":"Grade B","ignore":"w"}]},{"in":[60],"out":[{"pattern":"Grade C","ignore":"w"}]},{"in":[50],"out":[{"pattern":"Grade D","ignore":"w"}]},{"in":[12],"out":[{"pattern":"Grade U","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nmark = int(input(\"Enter the mark: \"))\n\nif mark \u003e= 80:\n    grade = \"A\"\nelif mark \u003e= 70:\n    grade = \"B\"\nelif mark \u003e= 60:\n    grade = \"C\"\nelif mark \u003e= 50:\n    grade = \"D\"\nelse:\n    grade = \"U\"\n\nprint(\"Grade\", grade)\n"},{"id":"a79f76b9-483d-4a03-86eb-721bc6d373a4","name":"Leap year","guide":"# Leap year\n\nInput a year and output whether it is a leap year.\n\n**The rule:** divisible by 4, *except* years divisible by 100, *unless* they\nare also divisible by 400. So 2024 and 2000 are leap years; 1900 and 2023 are\nnot.\n\nPrint exactly:\n\n```\n2024 is a leap year\n1900 is not a leap year\n```\n\n## Hint\n`%` gives the remainder. Combine conditions with `and` / `or`.\n","starter":"# Decide whether a year is a leap year.\n\n# TODO\n","tests":[{"in":[2024],"out":[{"pattern":"is a leap year","ignore":"wc"},{"typ":"-","pattern":"not a leap year","ignore":"wc"}]},{"in":[1900],"out":[{"pattern":"not a leap year","ignore":"wc"}]},{"in":[2000],"out":[{"pattern":"is a leap year","ignore":"wc"},{"typ":"-","pattern":"not a leap year","ignore":"wc"}]},{"in":[2023],"out":[{"pattern":"not a leap year","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nyear = int(input(\"Enter a year: \"))\n\nif year % 400 == 0 or (year % 4 == 0 and year % 100 != 0):\n    print(year, \"is a leap year\")\nelse:\n    print(year, \"is not a leap year\")\n"},{"id":"e30cc399-cf33-4e6d-82cf-89cdabdc44cd","name":"CASE statement","guide":"# CASE statements\n\nWhen you are choosing between several values of the **same** variable, exam\npseudocode uses a `CASE` statement:\n\n```\nCASE OF choice\n    1 : answer \u003c- first + second\n    2 : answer \u003c- first - second\n    OTHERWISE OUTPUT \"Not a valid choice\"\nENDCASE\n```\n\nPython has no `CASE`, so we write it as an `if` / `elif` / `else` chain. You\nneed to recognise both.\n\n## Task\nBuild a calculator.\n\n* Ask for a choice: `1` add, `2` subtract, `3` multiply, `4` divide\n* Ask for two numbers\n* Print `Answer: 9`\n* If the choice is not 1 to 4, print `Not a valid choice`\n","starter":"# A calculator using an if / elif chain in place of a CASE statement.\n\nprint(\"1 add   2 subtract   3 multiply   4 divide\")\nchoice = int(input(\"Choose an operation: \"))\n\nfirst = int(input(\"Enter the first number: \"))\nsecond = int(input(\"Enter the second number: \"))\n\n# TODO\n","tests":[{"in":[1,6,3],"out":[{"pattern":"Answer: 9","ignore":"w"}]},{"in":[2,6,3],"out":[{"pattern":"Answer: 3","ignore":"w"}]},{"in":[3,6,3],"out":[{"pattern":"Answer: 18","ignore":"w"}]},{"in":[4,6,3],"out":[{"pattern":"Answer: 2","ignore":"w"}]},{"in":[9,6,3],"out":[{"pattern":"Not a valid choice","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nprint(\"1 add   2 subtract   3 multiply   4 divide\")\nchoice = int(input(\"Choose an operation: \"))\n\nfirst = int(input(\"Enter the first number: \"))\nsecond = int(input(\"Enter the second number: \"))\n\nif choice == 1:\n    print(\"Answer:\", first + second)\nelif choice == 2:\n    print(\"Answer:\", first - second)\nelif choice == 3:\n    print(\"Answer:\", first * second)\nelif choice == 4:\n    print(\"Answer:\", first / second)\nelse:\n    print(\"Not a valid choice\")\n"},{"id":"f36b7e01-35d3-4656-b59c-293dd8d13ee0","name":"Nested selection","guide":"# Nested selection\n\nAn `if` **inside** another `if`. The inner one is only reached if the outer\ncondition was true.\n\n## Task\nWork out a cinema ticket price.\n\n* under 13 pays 7000\n* 13 to 64 pays 12000\n* 65 and over pays 8000\n* on a **Tuesday** everybody gets 2000 off\n* no ticket may cost less than 5000\n\nAsk for the age, then ask `Is it Tuesday? (yes/no)`. Print `Price: 5000`.\n\n\u003e **Exam link:** you will never be asked for more than three levels of nesting.\n","starter":"# Cinema ticket pricing with nested selection.\n\nage = int(input(\"How old are you? \"))\ntuesday = input(\"Is it Tuesday? (yes/no) \").lower()\n\n# TODO\n","tests":[{"in":[10,"yes"],"out":[{"pattern":"Price: 5000","ignore":"w"}]},{"in":[10,"no"],"out":[{"pattern":"Price: 7000","ignore":"w"}]},{"in":[30,"no"],"out":[{"pattern":"Price: 12000","ignore":"w"}]},{"in":[30,"yes"],"out":[{"pattern":"Price: 10000","ignore":"w"}]},{"in":[70,"yes"],"out":[{"pattern":"Price: 6000","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nage = int(input(\"How old are you? \"))\ntuesday = input(\"Is it Tuesday? (yes/no) \").lower()\n\nif age \u003c 13:\n    price = 7000\nelif age \u003c 65:\n    price = 12000\nelse:\n    price = 8000\n\nif tuesday == \"yes\":\n    price = price - 2000\n    if price \u003c 5000:\n        price = 5000\n\nprint(\"Price:\", price)\n"},{"id":"theory-03","name":"Theory check","quiz":[{"type":"mcq","q":"What is the difference between \u003ccode\u003e=\u003c/code\u003e and \u003ccode\u003e==\u003c/code\u003e in Python?","options":["They are the same","\u003ccode\u003e=\u003c/code\u003e compares, \u003ccode\u003e==\u003c/code\u003e assigns","\u003ccode\u003e=\u003c/code\u003e assigns, \u003ccode\u003e==\u003c/code\u003e compares","\u003ccode\u003e==\u003c/code\u003e is only for numbers"],"answer":2,"explain":"= puts a value into a variable. == asks whether two values are equal."},{"type":"blank","q":"Write the pseudocode operator that means 'not equal to'.","code":"IF answer ____ correctAnswer THEN","answer":["\u003c\u003e"],"explain":"Pseudocode uses \u003c\u003e for not equal. Python uses !=."},{"type":"mcq","q":"In an \u003ccode\u003eif / elif / elif / else\u003c/code\u003e chain, when does the \u003ccode\u003eelse\u003c/code\u003e block run?","options":["Always","Only if every condition above it was false","Only if the first condition was false","Never"],"answer":1,"explain":"Python checks the conditions from the top down. else is the catch-all when none matched."},{"type":"mcq","q":"Exam pseudocode has a \u003ccode\u003eCASE OF\u003c/code\u003e statement. What do you use in Python instead?","options":["A \u003ccode\u003efor\u003c/code\u003e loop","An \u003ccode\u003eif / elif / else\u003c/code\u003e chain","A function","A \u003ccode\u003ewhile\u003c/code\u003e loop"],"answer":1,"explain":"Python has no CASE statement, so an if / elif / else chain does the same job."},{"type":"blank","q":"What single character is missing from the end of this line?","code":"if mark \u003e= 80____","answer":[":"],"explain":"Every if, elif, else, for, while and def line ends with a colon."}]}]},{"id":"be680b01-c7b2-4b0c-a92f-4aa8a915b5db","name":"4. Iteration","children":[{"id":"2f0d5ccf-4ad6-4131-a1ab-73e6533d4700","name":"Example: for and while","guide":"# Loops\n\n| Loop | Use it when | Checked |\n|---|---|---|\n| **count-controlled** (`for`) | you know how many times | - |\n| **pre-condition** (`while`) | unknown number of times | **before** each pass |\n| **post-condition** (REPEAT UNTIL) | unknown, but at least once | **after** each pass |\n\n`range(1, 6)` gives 1, 2, 3, 4, 5 - **the stop value is never included**.\n","starter":"# EXAMPLE - two kinds of loop.\n\n# COUNT-CONTROLLED: you know how many times in advance\nfor i in range(1, 6):\n    print(\"i is\", i)\n\n# PRE-CONDITION: keep going while something is true\ntotal = 0\nwhile total \u003c 10:\n    total = total + 3\n    print(\"total is now\", total)\n","isExample":true},{"id":"b965f809-5238-46f0-9188-0c6c8e9dca2b","name":"Times table","guide":"# Times table\n\nInput a number and print its full times table from 1 to 12.\n\n```\nWhich table? 3\n3 x 1 = 3\n3 x 2 = 6\n...\n3 x 12 = 36\n```\n\n## Hint\n```python\nfor i in range(1, 13):\n    print(table, \"x\", i, \"=\", table * i)\n```\n","starter":"# Print a times table from 1 to 12.\n\ntable = int(input(\"Which table? \"))\n\n# TODO\n","tests":[{"in":[3],"out":[{"pattern":"3 x 1 = 3","ignore":"w"},{"pattern":"3 x 7 = 21","ignore":"w"},{"pattern":"3 x 12 = 36","ignore":"w"}]},{"in":[5],"out":[{"pattern":"5 x 4 = 20","ignore":"w"},{"pattern":"5 x 12 = 60","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\ntable = int(input(\"Which table? \"))\n\nfor i in range(1, 13):\n    print(table, \"x\", i, \"=\", table * i)\n"},{"id":"faa3ac83-5d99-457c-a9e7-db7c380fe2e2","name":"Countdown","guide":"# Countdown\n\nInput a whole number and count down from it to 1, one per line, then print\n`Liftoff`.\n\n```\nEnter a number: 3\n3\n2\n1\nLiftoff\n```\n\n## Hint\nUse a `while` loop and a variable you keep subtracting 1 from. Make sure the\nloop can actually end.\n","starter":"# Count down to 1, then print Liftoff.\n\n# TODO\n","tests":[{"in":[3],"out":[{"pattern":"3\\n2\\n1\\nLiftoff"}]},{"in":[5],"out":[{"pattern":"5\\n4\\n3\\n2\\n1\\nLiftoff"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nnumber = int(input(\"Enter a number: \"))\n\nwhile number \u003e 0:\n    print(number)\n    number = number - 1\n\nprint(\"Liftoff\")\n"},{"id":"9bacd1d3-7073-4e44-85d1-6c5c91ee9b27","name":"Post-condition loop","guide":"# Post-condition loops (REPEAT UNTIL)\n\nA REPEAT loop always runs **at least once**, because the condition is tested at\nthe **end**.\n\n```\nREPEAT                          while True:\n    INPUT points                    points = int(input())\n    total \u003c- total + points         if points == -1:\nUNTIL points = -1                       break\n                                    total = total + points\n```\n\nPython has no `REPEAT`, so we use `while True:` with a `break`.\n\n## Task\nKeep asking the user for points until they enter `-1`, then print the total.\nThe `-1` is a **sentinel value** - a special value meaning \"stop\", chosen so it\ncan never be real data.\n\n```\nEnter points, -1 to finish: 17\nEnter points, -1 to finish: 12\nEnter points, -1 to finish: -1\nTotal: 29\n```\n","starter":"# Keep asking for points until the user enters -1, then print the total.\n\ntotal = 0\n\n# TODO: use while True and break\n","tests":[{"in":[17,12,6,-1],"out":[{"pattern":"Total: 35","ignore":"w"},{"typ":"c+","pattern":"break","ignore":"w"}]},{"in":[-1],"out":[{"pattern":"Total: 0","ignore":"w"}]},{"in":[100,-50,-1],"out":[{"pattern":"Total: 50","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\ntotal = 0\n\nwhile True:\n    points = int(input(\"Enter points, -1 to finish: \"))\n    if points == -1:\n        break\n    total = total + points\n\nprint(\"Total:\", total)\n"},{"id":"3213f7fc-3750-41f0-b36c-36459646650f","name":"Counting","guide":"# Counting\n\n**Totalling** adds values up: `total = total + number`.\n**Counting** counts how often something happens: `count = count + 1`.\n\nBoth must be set to 0 **before** the loop starts.\n\n## Task\nRead 8 numbers. Count how many are **above 50** and how many are **50 or\nbelow**. Print exactly:\n\n```\nAbove 50: 4\n50 or below: 4\n```\n","starter":"# Count how many of 8 numbers are above 50.\n\nabove = 0\nbelowOrEqual = 0\n\n# TODO\n","tests":[{"in":[10,60,50,90,20,55,45,100],"out":[{"pattern":"Above 50: 4","ignore":"w"},{"pattern":"50 or below: 4","ignore":"w"}]},{"in":[1,2,3,4,5,6,7,8],"out":[{"pattern":"Above 50: 0","ignore":"w"},{"pattern":"50 or below: 8","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nabove = 0\nbelowOrEqual = 0\n\nfor i in range(8):\n    number = int(input(\"Enter a number: \"))\n    if number \u003e 50:\n        above = above + 1\n    else:\n        belowOrEqual = belowOrEqual + 1\n\nprint(\"Above 50:\", above)\nprint(\"50 or below:\", belowOrEqual)\n"},{"id":"6d393448-7e0b-4de5-a4d9-48855f009162","name":"Nested iteration","guide":"# Nested iteration\n\nA loop **inside** another loop. The inner loop runs all the way through for\n**every** pass of the outer loop.\n\n## Task\nPrint a 5 by 5 multiplication grid:\n\n```\n1 2 3 4 5\n2 4 6 8 10\n3 6 9 12 15\n4 8 12 16 20\n5 10 15 20 25\n```\n\n## Hint\n`print(value, end=\" \")` prints without moving to a new line. An empty\n`print()` after the inner loop moves you down a row.\n","starter":"# Print a 5 by 5 multiplication grid using nested loops.\n\n# TODO\n","tests":[{"in":"","out":[{"pattern":"12345","ignore":"w"},{"pattern":"246810","ignore":"w"},{"pattern":"510152025","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nfor row in range(1, 6):\n    for col in range(1, 6):\n        print(row * col, end=\" \")\n    print()\n"},{"id":"theory-04","name":"Theory check","quiz":[{"type":"mcq","q":"Which loop tests its condition \u003cb\u003eafter\u003c/b\u003e running the body at least once?","options":["Count-controlled (FOR)","Pre-condition (WHILE)","Post-condition (REPEAT UNTIL)","None of them"],"answer":2,"explain":"REPEAT UNTIL checks at the end, so the body always runs at least once."},{"type":"mcq","q":"What numbers does \u003ccode\u003erange(1, 5)\u003c/code\u003e produce?","options":["1, 2, 3, 4, 5","1, 2, 3, 4","0, 1, 2, 3, 4","1, 5"],"answer":1,"explain":"The stop value is never included, so you get 1, 2, 3, 4."},{"type":"blank","q":"Complete the totalling line.","code":"total = total ____ number","answer":["+"],"explain":"Totalling adds each new value onto the running total."},{"type":"mcq","q":"In a loop that stops when the user enters \u003ccode\u003e-1\u003c/code\u003e, what is the \u003ccode\u003e-1\u003c/code\u003e called?","options":["A counter","A flag","A sentinel value","An index"],"answer":2,"explain":"A sentinel (or rogue) value is a special value meaning 'stop', chosen so it can never be real data."},{"type":"mcq","q":"You need to repeat something exactly 12 times. Which loop is most suitable?","options":["Count-controlled","Pre-condition","Post-condition","Nested"],"answer":0,"explain":"You know the number of repeats in advance, so a count-controlled (for) loop is right."}]}]},{"id":"90f776a2-fea5-44fd-9475-4bfec8a1e004","name":"5. String handling","children":[{"id":"330dced6-9da4-4398-9022-5b33c5756285","name":"Example: working with strings","guide":"# String handling\n\n| Python | Pseudocode | What it does |\n|---|---|---|\n| `len(s)` | `LENGTH(s)` | how many characters |\n| `s.upper()` | `UCASE(s)` | to capitals |\n| `s.lower()` | `LCASE(s)` | to lowercase |\n| `s[0]` | `SUBSTRING(s, 1, 1)` | first character |\n| `s[2:5]` | `SUBSTRING(s, 3, 3)` | characters 2, 3, 4 |\n\n**Watch out:** Python counts from **0**, exam pseudocode usually counts from\n**1**. The syllabus says the first character may be position zero or one, so\nread each question carefully.\n","starter":"# EXAMPLE - strings are sequences of characters.\n\nword = \"Computer\"\n\nprint(len(word))        # how many characters\nprint(word.upper())     # COMPUTER\nprint(word.lower())     # computer\nprint(word[0])          # C   - counting starts at 0\nprint(word[0:4])        # Comp - characters 0, 1, 2, 3\nprint(word[-1])         # r   - last character\n","isExample":true},{"id":"ee0dd3b4-9d70-4637-921b-05727d16ba54","name":"Count the vowels","guide":"# Count the vowels\n\nInput some text and output how many vowels (a, e, i, o, u) it contains.\nCapitals count too.\n\n```\nEnter some text: Hello World\n3\n```\n\n## Hint\nLoop through each character. `if letter.lower() in \"aeiou\":` handles both cases\nat once.\n","starter":"# Count the vowels in some text.\n\ntext = input(\"Enter some text: \")\n\n# TODO\n","tests":[{"in":["Hello World"],"out":[{"pattern":"3"}]},{"in":["AEIOU"],"out":[{"pattern":"5"}]},{"in":["rhythm"],"out":[{"pattern":"0"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\ntext = input(\"Enter some text: \")\n\ncount = 0\nfor letter in text:\n    if letter.lower() in \"aeiou\":\n        count = count + 1\n\nprint(count)\n"},{"id":"0b1ddb58-2127-4495-8b68-bbb4fbdf4226","name":"Reverse a word","guide":"# Reverse a word\n\nInput a word and print it backwards.\n\n```\nEnter a word: python\nnohtyp\n```\n\n## Rule\nPython has a one-line trick (`word[::-1]`) but it is **blocked** here. Build the\nreversed string yourself with a loop - that is the version that earns marks.\n\n## Hint\nStart with an empty string and stick each new letter on the **front**:\n`reversed = letter + reversed`\n","starter":"# Reverse a word using a loop. Do not use [::-1]\n\n# TODO\n","tests":[{"in":["python"],"out":[{"pattern":"nohtyp"},{"typ":"c-","pattern":"::-1","ignore":"w"}]},{"in":["Seoul"],"out":[{"pattern":"luoeS"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nword = input(\"Enter a word: \")\n\nreversedWord = \"\"\nfor letter in word:\n    reversedWord = letter + reversedWord\n\nprint(reversedWord)\n"},{"id":"ab827ccb-00b8-4b14-bc9a-d31d01417957","name":"Initials","guide":"# Initials\n\nInput a first name and a family name, then print the initials as capitals with\nnothing between them.\n\n```\nEnter first name: minji\nEnter family name: kim\nMK\n```\n\n## Hint\n`firstName[0]` gives the first character. `.upper()` capitalises it. Join\nstrings with `+`.\n","starter":"# Print somebody's initials.\n\n# TODO\n","tests":[{"in":["minji","kim"],"out":[{"pattern":"MK"}]},{"in":["Ada","Lovelace"],"out":[{"pattern":"AL"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nfirstName = input(\"Enter first name: \")\nfamilyName = input(\"Enter family name: \")\n\nprint(firstName[0].upper() + familyName[0].upper())\n"},{"id":"178dc9ac-375d-4d4d-aa65-142d1e593516","name":"SUBSTRING","guide":"# Taking a substring\n\nStudent IDs at our school look like `Y10-0453`:\n\n* characters 1 and 2 are always `Y`\n* the next two are the **year group**\n* then a dash\n* the last four are the **student number**\n\n## Task\nInput an ID and print exactly:\n\n```\nEnter the ID: Y10-0453\nYear group: 10\nNumber: 0453\n```\n\n## Hint\n`identifier[1:3]` gives characters 1 and 2. Count carefully - Python starts at 0.\n","starter":"# Split a student ID into its parts.\n\nidentifier = input(\"Enter the ID: \")\n\n# TODO: use slicing to pull out the year group and the number\n","tests":[{"in":["Y10-0453"],"out":[{"pattern":"Year group: 10","ignore":"w"},{"pattern":"Number: 0453","ignore":"w"}]},{"in":["Y13-9921"],"out":[{"pattern":"Year group: 13","ignore":"w"},{"pattern":"Number: 9921","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nidentifier = input(\"Enter the ID: \")\n\nyearGroup = identifier[1:3]\nstudentNumber = identifier[4:8]\n\nprint(\"Year group:\", yearGroup)\nprint(\"Number:\", studentNumber)\n"},{"id":"a2c79339-d74c-46cc-bb1b-507c501558ae","name":"UCASE and LCASE","guide":"# Changing case\n\n## Task\nInput a word and print all of these, one per line:\n\n```\nEnter a word: Computer\nCOMPUTER\ncomputer\nFirst: C\nLast: r\nLength: 8\n```\n\n## Hint\n`.upper()`, `.lower()`, `word[0]`, `word[-1]` and `len(word)`.\n","starter":"# Print a word in several different ways.\n\nword = input(\"Enter a word: \")\n\n# TODO\n","tests":[{"in":["Computer"],"out":[{"pattern":"COMPUTER"},{"pattern":"computer"},{"pattern":"First: C","ignore":"w"},{"pattern":"Last: r","ignore":"w"},{"pattern":"Length: 8","ignore":"w"}]},{"in":["Seoul"],"out":[{"pattern":"SEOUL"},{"pattern":"Length: 5","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nword = input(\"Enter a word: \")\n\nprint(word.upper())\nprint(word.lower())\nprint(\"First:\", word[0])\nprint(\"Last:\", word[-1])\nprint(\"Length:\", len(word))\n"},{"id":"theory-05","name":"Theory check","quiz":[{"type":"mcq","q":"What does \u003ccode\u003eLENGTH(\"Computer\")\u003c/code\u003e give?","options":["7","8","9","Computer"],"answer":1,"explain":"Computer has 8 characters. In Python it is len(word)."},{"type":"blank","q":"Complete the Python for the pseudocode \u003ccode\u003eUCASE(word)\u003c/code\u003e.","code":"shout = word.____()","answer":["upper"],"explain":"upper() converts to capitals; lower() converts to lowercase."},{"type":"mcq","q":"In Python, what is the index of the \u003cb\u003efirst\u003c/b\u003e character of a string?","options":["1","0","-1","It depends"],"answer":1,"explain":"Python counts from 0. Exam pseudocode often counts from 1, so read the question carefully."},{"type":"blank","q":"This slice should give the first four characters. Fill in the missing number.","code":"start = word[0:____]","answer":["4"],"explain":"A slice stops before the second number, so 0:4 gives characters 0, 1, 2 and 3."},{"type":"mcq","q":"Which check makes a comparison work whatever case the user typed?","options":["Comparing the lengths","Converting both to lower case first","Using \u003ccode\u003e!=\u003c/code\u003e","Using a for loop"],"answer":1,"explain":"Putting both strings through lower() (or upper()) makes the comparison case-insensitive."}]}]},{"id":"5a14bc5c-f7b3-4342-93a9-a47e68c7892c","name":"6. Arrays (1D)","children":[{"id":"0c5bfc42-bf3d-4da9-a00a-8e2efefde7a7","name":"Example: arrays","guide":"# Arrays (Python calls them lists)\n\nAn array holds many values under one name.\n\n```python\nscores = [12, 7, 25, 3, 18]\n```\n\n* `scores[0]` is the **first** item - Python indexes from 0\n* `len(scores)` is how many items there are\n* `scores.append(x)` adds to the end\n\n\u003e **Exam link:** the syllabus says the first index may be zero **or** one, and\n\u003e that you should use a **variable** as an index. Always use `len()` rather\n\u003e than typing the size - then your program still works if the array changes.\n","starter":"# EXAMPLE - an array holds many values under one name.\n\nscores = [12, 7, 25, 3, 18]\n\nprint(scores)\nprint(scores[0])        # first item  - index 0\nprint(len(scores))      # how many items\n\nscores.append(40)       # add to the end\nscores[1] = 99          # change an item\n\nfor i in range(len(scores)):\n    print(i, scores[i])\n","isExample":true},{"id":"a0d12542-a04b-4bf2-8412-9fa43e52d6fb","name":"Total and average","guide":"# Totalling an array\n\n## Task\nRead 6 numbers into an array, then print the total and the average to 1 decimal\nplace.\n\n```\nTotal: 210\nAverage: 35.0\n```\n\n## Hint\nSet `total = 0` before the loop. Use `len()` for the average, not `6`.\n","starter":"# Read 6 numbers into an array, then total and average them.\n\nnumbers = []\n\n# TODO\n","tests":[{"in":[10,20,30,40,50,60],"out":[{"pattern":"Total: 210","ignore":"w"},{"pattern":"Average: 35","ignore":"w"}]},{"in":[1,1,1,1,1,1],"out":[{"pattern":"Total: 6","ignore":"w"},{"pattern":"Average: 1","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nnumbers = []\n\nfor i in range(6):\n    numbers.append(int(input(\"Enter a number: \")))\n\ntotal = 0\nfor number in numbers:\n    total = total + number\n\nprint(\"Total:\", total)\nprint(\"Average:\", round(total / len(numbers), 1))\n"},{"id":"68094da6-cdb3-419e-87a3-8531f9545235","name":"Largest in an array","guide":"# Largest in an array\n\nRead 5 numbers into an array, then find the largest **using a loop**. `max()`\nis blocked.\n\n```\nLargest: 9\n```\n\n## Hint\nAssume the first item is the largest so far, then compare every other item\nagainst it. Starting from `numbers[0]` also works for negative numbers -\nstarting from 0 does not.\n","starter":"# Read 5 numbers into an array and find the largest. Do not use max().\n\nnumbers = []\n\n# TODO\n","tests":[{"in":[3,9,2,7,1],"out":[{"pattern":"9"},{"typ":"c-","pattern":"max\\(","ignore":"w"}]},{"in":[-4,-9,-2,-7,-100],"out":[{"pattern":"-2"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nnumbers = []\n\nfor i in range(5):\n    numbers.append(int(input(\"Enter a number: \")))\n\nlargest = numbers[0]\nfor number in numbers:\n    if number \u003e largest:\n        largest = number\n\nprint(\"Largest:\", largest)\n"},{"id":"bba8161b-9ea6-4bd8-bced-cf6493f37979","name":"Parallel arrays","guide":"# Parallel arrays\n\nTwo arrays that **line up**: index `i` in one belongs with index `i` in the\nother.\n\n```\nnames[0] = \"Minji\"    scores[0] = 78\nnames[1] = \"Tom\"      scores[1] = 55\n```\n\n## Task\nUsing the arrays already given:\n\n* print every name with its score, one per line\n* print the name of the student with the **highest** score, like this:\n  `Top: Aisha`\n","starter":"names = [\"Minji\", \"Tom\", \"Aisha\", \"Joon\", \"Sara\"]\nscores = [78, 55, 90, 43, 67]\n\n# TODO: print each name with its score, then the top scorer\n","tests":[{"in":"","out":[{"pattern":"Minji 78","ignore":"w"},{"pattern":"Sara 67","ignore":"w"},{"pattern":"Top: Aisha","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nnames = [\"Minji\", \"Tom\", \"Aisha\", \"Joon\", \"Sara\"]\nscores = [78, 55, 90, 43, 67]\n\nfor i in range(len(names)):\n    print(names[i], scores[i])\n\nbest = 0\nfor i in range(len(scores)):\n    if scores[i] \u003e scores[best]:\n        best = i\n\nprint(\"Top:\", names[best])\n"},{"id":"03481b00-67ce-44b3-9c30-fa2f59d299ea","name":"Linear search","guide":"# Linear search\n\nRead 5 numbers into an array, then read one more - the value to search for.\n\n* If it is there, print `Found at position N`, counting the **first item as\n  position 1**\n* If not, print `Not found`\n\n```\nSearch for: 30\nFound at position 3\n```\n\n## Hint\nLoop with `for i in range(len(numbers)):` so you have the index. Use a **flag**\n(`found = False`) so you can print `Not found` after the loop.\n","starter":"# Read 5 numbers, then search for one more.\n# Print \"Found at position 3\" (counting from 1) or \"Not found\".\n\n# TODO\n","tests":[{"in":[10,20,30,40,50,30],"out":[{"pattern":"Found at position 3","ignore":"wc"}]},{"in":[10,20,30,40,50,10],"out":[{"pattern":"Found at position 1","ignore":"wc"}]},{"in":[10,20,30,40,50,99],"out":[{"pattern":"Not found","ignore":"wc"},{"typ":"-","pattern":"Found at position","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nnumbers = []\nfor i in range(5):\n    numbers.append(int(input(\"Enter a number: \")))\n\ntarget = int(input(\"Search for: \"))\n\nfound = False\nfor i in range(len(numbers)):\n    if numbers[i] == target and not found:\n        print(\"Found at position\", i + 1)\n        found = True\n\nif not found:\n    print(\"Not found\")\n"},{"id":"47ed56c3-fa15-4906-a80e-cd205892d44f","name":"Bubble sort","guide":"# Bubble sort\n\nRead 5 numbers into an array and put them in ascending order. Print them on one\nline separated by single spaces.\n\n```\n1 3 5 8 9\n```\n\n`sort()` and `sorted()` are **blocked** - write the algorithm yourself.\n\n## The algorithm\nCompare each pair of neighbours. If they are the wrong way round, swap them.\nRepeat until a whole pass makes no swaps.\n\n## Hints\nSwapping: `a[i], a[i+1] = a[i+1], a[i]`\nPrinting on one line: `print(\" \".join(str(n) for n in numbers))`\n","starter":"# Read 5 numbers and sort them ascending. Do not use sort() or sorted().\n\n# TODO\n","tests":[{"in":[5,3,8,1,9],"out":[{"pattern":"1 3 5 8 9","ignore":"w"},{"typ":"c-","pattern":"sorted\\(|\\.sort\\(","ignore":"w"}]},{"in":[1,2,3,4,5],"out":[{"pattern":"1 2 3 4 5","ignore":"w"}]},{"in":[9,8,7,6,5],"out":[{"pattern":"5 6 7 8 9","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nnumbers = []\nfor i in range(5):\n    numbers.append(int(input(\"Enter a number: \")))\n\nfor outer in range(len(numbers)):\n    for i in range(len(numbers) - 1):\n        if numbers[i] \u003e numbers[i + 1]:\n            numbers[i], numbers[i + 1] = numbers[i + 1], numbers[i]\n\nprint(\" \".join(str(n) for n in numbers))\n"},{"id":"theory-06","name":"Theory check","quiz":[{"type":"mcq","q":"An array has 8 items. In Python, what is the index of the \u003cb\u003elast\u003c/b\u003e one?","options":["8","7","9","0"],"answer":1,"explain":"Indexes run 0 to 7. The last index is always len(array) - 1."},{"type":"blank","q":"Complete the line that adds a value to the end of an array.","code":"scores.____(45)","answer":["append"],"explain":"append() adds one item to the end of the array."},{"type":"mcq","q":"Does a \u003cb\u003elinear search\u003c/b\u003e need the array to be sorted first?","options":["Yes, always","No","Only for numbers","Only for strings"],"answer":1,"explain":"A linear search checks every item in turn, so the order does not matter."},{"type":"mcq","q":"What happens during one \u003cb\u003epass\u003c/b\u003e of a bubble sort?","options":["The array is split in half","Each item is compared with its neighbour and swapped if out of order","The largest item is moved to the front","Every item is compared with every other item"],"answer":1,"explain":"After one pass, the largest remaining value has bubbled to the end."},{"type":"blank","q":"Complete the loop so it works whatever size the array is.","code":"for i in range(____(numbers)):","answer":["len"],"explain":"Using len() rather than a fixed number means the program still works if the array changes."}]}]},{"id":"7cd26642-5194-4227-a905-33c611e20961","name":"7. Arrays (2D)","children":[{"id":"51b5726e-fff7-4f2f-b6a4-2ab7dfdf0391","name":"Example: 2D arrays","guide":"# Two-dimensional arrays\n\nA 2D array is a **grid** - rows and columns. In Python it is a list of lists.\n\n```python\nseats = [[1, 0, 1, 1],\n         [0, 0, 1, 0],\n         [1, 1, 1, 1]]\n```\n\nTo reach one item you give **two** indexes - **row first, then column**:\n\n```\nseats[1][2]   is row 1, column 2\n```\n\n`len(seats)` is the number of rows. `len(seats[0])` is the number of columns.\n","starter":"# EXAMPLE - a 2D array is a grid of rows and columns.\n\nseats = [[1, 0, 1, 1],\n         [0, 0, 1, 0],\n         [1, 1, 1, 1]]\n\nprint(\"Rows:\", len(seats))\nprint(\"Columns:\", len(seats[0]))\nprint(\"Row 1, column 2:\", seats[1][2])\n\nfor row in range(len(seats)):\n    for col in range(len(seats[0])):\n        print(seats[row][col], end=\" \")\n    print()\n","isExample":true},{"id":"c8b0ef58-c5fb-47eb-ae08-2b25d342c24c","name":"Counting in a grid","guide":"# Counting in a grid\n\n`seats` is a classroom with 3 rows of 4 seats. `0` means empty, `1` means taken.\n\nCount the empty seats and print exactly:\n\n```\nEmpty seats: 4\n```\n\n## Hint\nYou need a loop inside a loop. Use `len()` rather than typing 3 and 4.\n","starter":"seats = [[1, 0, 1, 1],\n         [0, 0, 1, 0],\n         [1, 1, 1, 1]]\n\n# TODO: count how many seats are empty\n","tests":[{"in":"","out":[{"pattern":"Empty seats: 4","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nseats = [[1, 0, 1, 1],\n         [0, 0, 1, 0],\n         [1, 1, 1, 1]]\n\nempty = 0\nfor row in range(len(seats)):\n    for col in range(len(seats[0])):\n        if seats[row][col] == 0:\n            empty = empty + 1\n\nprint(\"Empty seats:\", empty)\n"},{"id":"ccfa8c59-c517-4c96-beea-75542b4a7cb1","name":"Totalling a row","guide":"# Totalling each row\n\n`marks` holds the marks of 4 students across 3 subjects. Each **row** is one\nstudent.\n\n## Task\nPrint each student's name and their total, like this:\n\n```\nMinji 235\nTom 194\nAisha 257\nJoon 156\n```\n\n## Hint\nOuter loop over the students, inner loop over the subjects. Reset `total` to 0\nat the start of each student.\n","starter":"students = [\"Minji\", \"Tom\", \"Aisha\", \"Joon\"]\n\n#          Maths  Science  Computing\nmarks = [[   78,     65,      92   ],\n         [   55,     71,      68   ],\n         [   90,     88,      79   ],\n         [   43,     52,      61   ]]\n\n# TODO: print each student's name and total\n","tests":[{"in":"","out":[{"pattern":"Minji 235","ignore":"w"},{"pattern":"Tom 194","ignore":"w"},{"pattern":"Aisha 257","ignore":"w"},{"pattern":"Joon 156","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nstudents = [\"Minji\", \"Tom\", \"Aisha\", \"Joon\"]\n\nmarks = [[78, 65, 92],\n         [55, 71, 68],\n         [90, 88, 79],\n         [43, 52, 61]]\n\nfor row in range(len(students)):\n    total = 0\n    for col in range(len(marks[0])):\n        total = total + marks[row][col]\n    print(students[row], total)\n"},{"id":"c9af3bb4-3b31-4722-acf5-30c5901278e1","name":"Totalling a column","guide":"# Totalling each column\n\nSame data, but now total **down** each column instead of across each row. That\nmeans swapping the loops over: outer loop over columns, inner loop over rows.\n\n## Task\nPrint each subject and the class total, like this:\n\n```\nMaths 266\nScience 276\nComputing 300\n```\n","starter":"subjects = [\"Maths\", \"Science\", \"Computing\"]\n\nmarks = [[78, 65, 92],\n         [55, 71, 68],\n         [90, 88, 79],\n         [43, 52, 61]]\n\n# TODO: total each column\n","tests":[{"in":"","out":[{"pattern":"Maths 266","ignore":"w"},{"pattern":"Science 276","ignore":"w"},{"pattern":"Computing 300","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nsubjects = [\"Maths\", \"Science\", \"Computing\"]\n\nmarks = [[78, 65, 92],\n         [55, 71, 68],\n         [90, 88, 79],\n         [43, 52, 61]]\n\nfor col in range(len(subjects)):\n    total = 0\n    for row in range(len(marks)):\n        total = total + marks[row][col]\n    print(subjects[col], total)\n"},{"id":"theory-07","name":"Theory check","quiz":[{"type":"mcq","q":"What does \u003ccode\u003egrid[2][1]\u003c/code\u003e refer to?","options":["Column 2, row 1","Row 2, column 1","The 21st item","Row 1, column 2"],"answer":1,"explain":"Always row first, then column."},{"type":"mcq","q":"For a 2D array, what does \u003ccode\u003elen(grid[0])\u003c/code\u003e give?","options":["The number of rows","The number of columns","The total number of items","The first item"],"answer":1,"explain":"len(grid) is the number of rows; len(grid[0]) is how many items are in one row."},{"type":"mcq","q":"A grid has 3 rows and 4 columns. How many items does it hold?","options":["7","12","34","9"],"answer":1,"explain":"3 rows of 4 items each gives 3 x 4 = 12."},{"type":"blank","q":"To total each \u003cb\u003ecolumn\u003c/b\u003e, which variable should the outer loop go over?","code":"for ____ in range(len(subjects)):","answer":["col","column"],"explain":"To go down columns, the outer loop is over columns and the inner loop over rows."},{"type":"mcq","q":"What kind of iteration do you need to visit every item in a 2D array?","options":["A single for loop","Nested iteration","A while loop","Recursion"],"answer":1,"explain":"One loop for the rows with another loop inside it for the columns."}]}]},{"id":"1d8d7fcb-dd6d-4692-ada4-89f820834654","name":"8. Procedures and functions","children":[{"id":"c83e3259-33fc-493f-8686-76f55dcc96e6","name":"Example: subroutines","guide":"# Procedures and functions\n\nBoth are written with `def`. The difference is whether they hand a value back.\n\n| | Returns a value? | Example |\n|---|---|---|\n| **Procedure** | no | `greet(\"Minji\")` |\n| **Function** | yes | `a = area(5, 3)` |\n\nThe names in the brackets when you **define** it are the **parameters**. The\nvalues you put in when you **call** it are the **arguments**.\n\n\u003e **Exam link:** subroutines may have up to three parameters. Nothing inside a\n\u003e `def` runs until you **call** it.\n","starter":"# EXAMPLE - a subroutine is a named chunk of code you can reuse.\n\n# A PROCEDURE does something but returns nothing\ndef greet(name):\n    print(\"Hello\", name)\n    print(\"Welcome to the course\")\n\n# A FUNCTION returns a value\ndef area(width, height):\n    return width * height\n\ngreet(\"Minji\")\ngreet(\"Tom\")\n\nanswer = area(5, 3)\nprint(\"The area is\", answer)\n","isExample":true},{"id":"93dcec9d-acd2-44b5-879f-616b3c6a8223","name":"Function: temperature","guide":"# Function: temperature converter\n\nWrite a function `cToF(celsius)` that **returns** the temperature in\nFahrenheit.\n\nThe formula is `F = C * 9 / 5 + 32`\n\n```\nEnter a temperature in Celsius: 100\n212.0\n```\n\n## Hint\n`return` sends the value back to whoever called the function. A function that\nonly `print`s hands back nothing, and the tests call your function directly.\n","starter":"# Write a function that RETURNS a temperature in Fahrenheit.\n\ndef cToF(celsius):\n    # TODO: return the answer\n    pass\n\n\n# This part is already written for you\ntemperature = float(input(\"Enter a temperature in Celsius: \"))\nprint(cToF(temperature))\n","tests":[{"in":[100],"out":[{"typ":"s+","statement":"cToF(0)","pattern":"32"},{"typ":"s+","statement":"cToF(100)","pattern":"212"},{"typ":"s+","statement":"cToF(-40)","pattern":"-40"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\ndef cToF(celsius):\n    return celsius * 9 / 5 + 32\n\n\ntemperature = float(input(\"Enter a temperature in Celsius: \"))\nprint(cToF(temperature))\n"},{"id":"71d6e5cb-ef7f-4b86-9ead-ed9045d109d8","name":"Procedure: draw a box","guide":"# Procedure: draw a box\n\nWrite a **procedure** `drawBox(width, height)` that prints a solid rectangle of\n`*` characters.\n\n```\nWidth: 4\nHeight: 3\n****\n****\n****\n```\n\n## Hint\n`\"*\" * 4` gives `\"****\"`. Then loop `height` times.\n","starter":"# Write a PROCEDURE that prints a rectangle of asterisks.\n\ndef drawBox(width, height):\n    # TODO\n    pass\n\n\n# Already written for you\nw = int(input(\"Width: \"))\nh = int(input(\"Height: \"))\ndrawBox(w, h)\n","tests":[{"in":[3,2],"out":[{"pattern":"\\*\\*\\*\\n\\*\\*\\*"},{"typ":"-","pattern":"\\*\\*\\*\\*"}]},{"in":[4,3],"out":[{"pattern":"\\*\\*\\*\\*\\n\\*\\*\\*\\*\\n\\*\\*\\*\\*"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\ndef drawBox(width, height):\n    for i in range(height):\n        print(\"*\" * width)\n\n\nw = int(input(\"Width: \"))\nh = int(input(\"Height: \"))\ndrawBox(w, h)\n"},{"id":"2e4efc38-40d2-4075-b0a5-a928ca369995","name":"Three parameters","guide":"# A function with three parameters\n\nThe syllabus says a subroutine may have **up to three** parameters.\n\n## Task\nWrite a function `boxVolume(length, width, height)` that **returns** the volume\nof a box.\n\nThe main program is written for you - it reads three numbers and prints the\nresult.\n\n```\nLength: 2\nWidth: 3\nHeight: 4\n24\n```\n","starter":"# Write a function with three parameters that returns the volume.\n\ndef boxVolume(length, width, height):\n    # TODO\n    pass\n\n\nlength = int(input(\"Length: \"))\nwidth = int(input(\"Width: \"))\nheight = int(input(\"Height: \"))\nprint(boxVolume(length, width, height))\n","tests":[{"in":[2,3,4],"out":[{"typ":"s+","statement":"boxVolume(2, 3, 4)","pattern":"24"},{"typ":"s+","statement":"boxVolume(1, 1, 1)","pattern":"1"},{"typ":"s+","statement":"boxVolume(10, 10, 10)","pattern":"1000"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\ndef boxVolume(length, width, height):\n    return length * width * height\n\n\nlength = int(input(\"Length: \"))\nwidth = int(input(\"Width: \"))\nheight = int(input(\"Height: \"))\nprint(boxVolume(length, width, height))\n"},{"id":"51a5bfad-7222-4b8d-8767-c45b450bc5ba","name":"Local and global variables","guide":"# Local and global variables\n\nA variable created **inside** a subroutine is **local** to it. It exists only\nwhile the subroutine runs, and the rest of the program cannot see it.\n\nA variable created **outside** every subroutine is **global** and can be read\nanywhere.\n\n## Task\nThe code below crashes, because `total` is local to `calculateTotal` and the\nlast line cannot see it.\n\nFix it by **returning** `total` and storing the answer in a variable.\n\n```\nThe total is 13500\n```\n\n\u003e Returning a value is much better practice than making everything global. In a\n\u003e long program, globals are the source of very hard-to-find bugs.\n","starter":"# This crashes because total is LOCAL to the function.\n# Fix it by returning the value.\n\ndef calculateTotal(price, quantity):\n    total = price * quantity\n\ncalculateTotal(4500, 3)\nprint(\"The total is\", total)\n","tests":[{"in":"","out":[{"pattern":"The total is 13500","ignore":"w"},{"typ":"c+","pattern":"return","ignore":"w"},{"typ":"s+","statement":"calculateTotal(10, 5)","pattern":"50"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\ndef calculateTotal(price, quantity):\n    total = price * quantity\n    return total\n\n\nanswer = calculateTotal(4500, 3)\nprint(\"The total is\", answer)\n"},{"id":"theory-08","name":"Theory check","quiz":[{"type":"mcq","q":"What is the difference between a procedure and a function?","options":["A function is longer","A function returns a value, a procedure does not","A procedure returns a value, a function does not","There is no difference"],"answer":1,"explain":"A function hands a value back to whatever called it. A procedure just does something."},{"type":"blank","q":"Which keyword sends a value back from a function?","code":"def area(width, height):\n    ____ width * height","answer":["return"],"explain":"return sends the value back. A function that only prints hands back nothing."},{"type":"mcq","q":"How many parameters will the exam ask you to use, at most?","options":["One","Two","Three","As many as you like"],"answer":2,"explain":"The syllabus says procedures and functions may have up to three parameters."},{"type":"mcq","q":"In \u003ccode\u003earea(5, 3)\u003c/code\u003e, what are \u003ccode\u003e5\u003c/code\u003e and \u003ccode\u003e3\u003c/code\u003e called?","options":["Parameters","Arguments","Variables","Constants"],"answer":1,"explain":"Values passed in when you call it are arguments. The names in the def line are parameters."},{"type":"mcq","q":"A variable created inside a function is...","options":["Global, so any part of the program can use it","Local, so only that function can use it","A constant","Deleted immediately"],"answer":1,"explain":"It is local. It exists only while the function is running and cannot be read from outside."}]}]},{"id":"93ea5c87-c9af-451e-b617-4f84d7a79213","name":"9. Validation and verification","children":[{"id":"faf6acf5-0c3d-4163-a660-6398d950270f","name":"Example: validation checks","guide":"# Validation\n\nValidation is the computer checking that data is **sensible**.\n\n| Check | What it tests |\n|---|---|\n| Range check | the value is between two limits |\n| Length check | the right number of characters |\n| Presence check | something was actually entered |\n| Type check | it is the right data type |\n| Format check | it matches a pattern |\n\nThe shape is always: **ask once, then loop while the data is bad**.\n\n**Verification** is different - it checks data was **copied accurately**,\nusually by asking twice and comparing.\n","starter":"# EXAMPLE - a range check using a while loop.\n\nage = int(input(\"Enter your age (0-120): \"))\n\nwhile age \u003c 0 or age \u003e 120:\n    print(\"Out of range, try again\")\n    age = int(input(\"Enter your age (0-120): \"))\n\nprint(\"Accepted\", age)\n","isExample":true},{"id":"212a3e5a-421f-4739-b5a3-718f6b706627","name":"Range check","guide":"# Range check\n\nKeep asking for a number until the user enters one between 1 and 10 inclusive.\n\n* invalid: print `Out of range`\n* valid: print `Accepted 7`\n\n```\nEnter a number (1-10): 15\nOut of range\nEnter a number (1-10): 0\nOut of range\nEnter a number (1-10): 7\nAccepted 7\n```\n\n## Hint\nRead the first value **before** the loop, then loop while it is invalid. Use\n`or`, not `and` - a number cannot be both too small and too big at once.\n","starter":"# Keep asking until the number is between 1 and 10.\n\n# TODO\n","tests":[{"in":[15,0,7],"out":[{"pattern":"Out of range","count":2,"ignore":"wc"},{"pattern":"Accepted 7","ignore":"wc"},{"typ":"c+","pattern":"while","ignore":"w"}]},{"in":[5],"out":[{"pattern":"Accepted 5","ignore":"wc"},{"typ":"-","pattern":"Out of range","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nnumber = int(input(\"Enter a number (1-10): \"))\n\nwhile number \u003c 1 or number \u003e 10:\n    print(\"Out of range\")\n    number = int(input(\"Enter a number (1-10): \"))\n\nprint(\"Accepted\", number)\n"},{"id":"fa61ce8f-df40-41c5-81b0-ddf69d52fc0e","name":"Length check","guide":"# Length check\n\nKeep asking for a password until it is at least 8 characters long.\n\n* too short: print `Too short`\n* long enough: print `Password accepted`\n\n```\nEnter a password: abc\nToo short\nEnter a password: password123\nPassword accepted\n```\n\n## Hint\n`len(password)` gives the number of characters. No `int()` here - a password is\na string.\n","starter":"# Keep asking until the password is at least 8 characters.\n\n# TODO\n","tests":[{"in":["abc","password123"],"out":[{"pattern":"Too short","count":1,"ignore":"wc"},{"pattern":"Password accepted","ignore":"wc"}]},{"in":["longenough"],"out":[{"pattern":"Password accepted","ignore":"wc"},{"typ":"-","pattern":"Too short","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\npassword = input(\"Enter a password: \")\n\nwhile len(password) \u003c 8:\n    print(\"Too short\")\n    password = input(\"Enter a password: \")\n\nprint(\"Password accepted\")\n"},{"id":"bf8e663c-683b-4a26-bc54-2141bbe4e60e","name":"Presence check","guide":"# Presence check\n\nA presence check makes sure the user actually entered something.\n\nKeep asking for a surname until it is not blank.\n\n* blank: print `Cannot be blank`\n* entered: print `Surname accepted`\n\n```\nEnter your surname:\nCannot be blank\nEnter your surname:\nCannot be blank\nEnter your surname: Kim\nSurname accepted\n```\n\n## Hint\nAn empty string has a length of 0. Use `while`, not `if` - `if` only checks\nonce.\n","starter":"# Keep asking until the surname is not blank.\n\n# TODO\n","tests":[{"in":["","","Kim"],"out":[{"pattern":"Cannot be blank","count":2,"ignore":"wc"},{"pattern":"Surname accepted","ignore":"wc"}]},{"in":["Park"],"out":[{"pattern":"Surname accepted","ignore":"wc"},{"typ":"-","pattern":"Cannot be blank","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nsurname = input(\"Enter your surname: \")\n\nwhile len(surname) == 0:\n    print(\"Cannot be blank\")\n    surname = input(\"Enter your surname: \")\n\nprint(\"Surname accepted\")\n
