<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IGCSE Python</title>
<style>
:root{
  --ink:#16202b; --ink-2:#223142; --ink-3:#31435a;
  --paper:#ffffff; --paper-2:#f3f5f8; --paper-3:#e7ecf1;
  --rule:#d6dee7;
  --text:#16202b; --muted:#5d6b7a;
  --act:#1d5fd8; --act-dark:#164ab0;
  --pass:#12784a; --pass-bg:#e4f4ec;
  --wait:#9a5b00; --wait-bg:#fdf0dd;
  --term-bg:#131c26; --term-fg:#dbe6f0; --term-dim:#7f93a8;
  --term-ok:#57d090; --term-err:#ff8f7a; --term-in:#ffd479;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rad:7px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--sans); color:var(--text);
  background:var(--ink); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--act);outline-offset:2px;border-radius:3px}
.term :focus-visible{outline-color:var(--term-in)}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100dvh}
.top{
  display:flex;align-items:center;gap:14px;
  padding:0 14px;height:50px;flex:0 0 auto;
  background:var(--ink);color:#fff;border-bottom:1px solid #0c141d;
}
.brand{font-weight:640;letter-spacing:-.015em;font-size:15px;white-space:nowrap}
.brand span{color:#8fa6bd;font-weight:450}
.top .sp{flex:1}
.tbtn{
  background:transparent;border:1px solid #3a4b60;color:#cfdae5;
  padding:5px 11px;border-radius:var(--rad);cursor:pointer;font-size:13.5px;
}
.tbtn:hover{background:#26374a;color:#fff}
.status{font-size:13px;color:#8fa6bd;white-space:nowrap}
#who{overflow:hidden;text-overflow:ellipsis;max-width:26ch}
@media (max-width:720px){#who{display:none}}
.status.bad{color:#ff9d8a}

.body{flex:1;display:flex;min-height:0}

/* ---------- sidebar ---------- */
.side{
  width:252px;flex:0 0 252px;background:var(--ink-2);color:#c6d3e0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.side h2{
  margin:0;padding:15px 14px 6px;font-size:12.5px;font-weight:600;
  color:#7e93a9;letter-spacing:.01em;
}
.side ul{list-style:none;margin:0;padding:0}
.ch{
  display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  background:none;border:0;border-left:3px solid transparent;
  padding:7px 13px 7px 11px;cursor:pointer;font-size:14px;line-height:1.4;
  color:#c6d3e0;
}
.ch:hover{background:#2b3d51}
.ch[aria-current=true]{background:#31435a;border-left-color:var(--act);color:#fff;font-weight:560}
.dot{
  flex:0 0 auto;width:15px;height:15px;margin-top:3px;border-radius:50%;
  border:1.5px solid #55697f;display:grid;place-items:center;font-size:10px;
}
.ch.done .dot{background:var(--pass);border-color:var(--pass);color:#fff}
.ch.done .dot::after{content:"✓"}
.ch.tried .dot{border-color:var(--wait);border-style:dashed}

/* ---------- panes ---------- */
.panes{flex:1;display:flex;min-width:0;background:var(--paper-3);gap:1px}
.pane{display:flex;flex-direction:column;min-width:0;background:var(--paper)}
.guide-pane{flex:0 1 470px}
.work-pane{flex:1 1 560px}
.pane-hd{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:9px 15px;border-bottom:1px solid var(--rule);background:var(--paper-2);
  font-size:13px;color:var(--muted);
}
.pane-hd b{color:var(--text);font-size:14px;font-weight:620}
.pane-hd .sp{flex:1}

/* ---------- guide ---------- */
.guide{padding:20px 24px 60px;overflow-y:auto;max-width:70ch}
.guide h1{font-size:22px;line-height:1.25;letter-spacing:-.02em;margin:.1em 0 .6em;font-weight:660}
.guide h2{font-size:16.5px;margin:1.7em 0 .5em;font-weight:640;letter-spacing:-.01em}
.guide h3{font-size:14.5px;margin:1.4em 0 .4em;font-weight:640}
.guide p{margin:0 0 .9em}
.guide ul,.guide ol{margin:0 0 1em;padding-left:1.3em}
.guide li{margin:.25em 0}
.guide a{color:var(--act)}
.guide code{
  font-family:var(--mono);font-size:.875em;background:var(--paper-3);
  padding:.12em .35em;border-radius:4px;
}
.guide pre{
  font-family:var(--mono);font-size:13px;line-height:1.5;
  background:var(--term-bg);color:var(--term-fg);
  padding:12px 14px;border-radius:var(--rad);overflow-x:auto;margin:0 0 1.1em;
}
.guide pre code{background:none;padding:0;font-size:inherit;color:inherit}
.guide blockquote{
  margin:0 0 1.1em;padding:10px 14px;background:#eef4fd;
  border-left:3px solid var(--act);border-radius:0 var(--rad) var(--rad) 0;
}
.guide blockquote p:last-child{margin:0}
.guide table{border-collapse:collapse;margin:0 0 1.1em;font-size:14px;width:100%}
.guide th,.guide td{border:1px solid var(--rule);padding:5px 10px;text-align:left;vertical-align:top}
.guide th{background:var(--paper-2);font-weight:620}
.guide hr{border:0;border-top:1px solid var(--rule);margin:1.6em 0}
.tok-kw{color:#9db8ff}.tok-str{color:#a6e3a1}.tok-com{color:#7f93a8;font-style:italic}
.tok-num{color:#ffd479}.tok-fn{color:#7fd6e8}

/* ---------- editor ---------- */
.ed-wrap{flex:1 1 auto;display:flex;min-height:120px;position:relative;overflow:hidden}
.gutter{
  flex:0 0 auto;padding:12px 8px 12px 12px;text-align:right;
  font-family:var(--mono);font-size:13.5px;line-height:21px;
  color:#9fb0c2;background:var(--paper-2);border-right:1px solid var(--rule);
  overflow:hidden;user-select:none;white-space:pre;
}
.gutter .err{color:#c0392b;font-weight:700}
.ed-stack{position:relative;flex:1 1 auto;min-width:0}
/* the two layers must share every metric that affects glyph position */
.ed-hl,.ed{
  position:absolute;top:0;left:0;right:0;bottom:0;margin:0;border:0;
  font-family:var(--mono);font-size:13.5px;line-height:21px;
  padding:12px 14px;white-space:pre;tab-size:4;
  word-wrap:normal;overflow-wrap:normal;text-align:left;
}
.ed-hl{
  pointer-events:none;overflow:hidden;background:var(--paper);
  color:var(--text);
}
.ed-hl code{font:inherit;background:none;padding:0;border-radius:0}
.ed{
  resize:none;outline:none;overflow:auto;background:transparent;
  color:transparent;caret-color:var(--act);
}
.ed::selection{background:#bcd6ff}
.ed-hl .tok-kw{color:#1a4fbd;font-weight:600}
.ed-hl .tok-fn{color:#7c3aa0}
.ed-hl .tok-str{color:#0a7a4a}
.ed-hl .tok-com{color:#7b8794;font-style:italic}
.ed-hl .tok-num{color:#9a4a00}
.ed-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:9px 14px;border-top:1px solid var(--rule);background:var(--paper-2);
}
.btn{
  border:1px solid var(--rule);background:var(--paper);border-radius:var(--rad);
  padding:6px 13px;cursor:pointer;font-size:13.5px;font-weight:520;
}
.btn:hover:not(:disabled){background:var(--paper-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn.run{background:var(--act);border-color:var(--act);color:#fff}
.btn.run:hover:not(:disabled){background:var(--act-dark)}
.btn.check{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.check:hover:not(:disabled){background:var(--ink-3)}
.ed-bar .sp{flex:1}
.hint{font-size:12.5px;color:var(--muted)}

/* ---------- terminal ---------- */
.term{
  flex:0 0 auto;height:38%;min-height:130px;display:flex;flex-direction:column;
  background:var(--term-bg);color:var(--term-fg);border-top:1px solid #0c141d;
}
.term-tabs{display:flex;gap:2px;padding:6px 8px 0;flex:0 0 auto}
.ttab{
  background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--term-dim);padding:5px 11px;cursor:pointer;font-size:13px;border-radius:4px 4px 0 0;
}
.ttab:hover{color:#fff}
.ttab[aria-selected=true]{color:#fff;border-bottom-color:var(--act);background:#1d2936}
.ttab .pill{
  display:inline-block;margin-left:6px;padding:0 6px;border-radius:9px;
  font-size:11px;font-weight:640;background:#33475c;color:#cfdae5;
}
.ttab .pill.ok{background:var(--pass);color:#fff}
.ttab .pill.no{background:#8a3c2c;color:#fff}
.term-body{
  flex:1;overflow-y:auto;padding:10px 14px 14px;
  font-family:var(--mono);font-size:13px;line-height:1.55;
}
.out{white-space:pre-wrap;word-break:break-word;margin:0}
.err{color:var(--term-err);white-space:pre-wrap;margin:.5em 0 0}
.note{color:var(--term-dim);margin:0}
.in-row{display:flex;align-items:center;gap:7px;margin-top:2px}
.in-row .caret{color:var(--term-in);flex:0 0 auto}
.in-row input{
  flex:1;background:transparent;border:0;outline:none;
  color:var(--term-in);font-family:var(--mono);font-size:13px;padding:2px 0;
  border-bottom:1px dotted #4b5f75;
}
/* results */
.res{margin:0;padding:0;list-style:none}
.res li{display:flex;gap:9px;padding:5px 0;border-bottom:1px solid #22303e;align-items:flex-start}
.res li:last-child{border-bottom:0}
.mark{flex:0 0 auto;width:16px;text-align:center;font-weight:700}
.mark.ok{color:var(--term-ok)}.mark.no{color:var(--term-err)}
.res .why{color:var(--term-dim);display:block;margin-top:2px}
.res .why code{color:#cfe0f0;background:#22303e;padding:.1em .3em;border-radius:3px}
.banner{
  margin:0 0 10px;padding:8px 11px;border-radius:var(--rad);
  background:#17342a;color:var(--term-ok);font-family:var(--sans);font-size:13.5px;
}
.banner.no{background:#33231e;color:#ffbfae}
.files pre{
  background:#1d2936;padding:9px 11px;border-radius:var(--rad);
  margin:.3em 0 .9em;white-space:pre-wrap;word-break:break-word;
}
.files h4{margin:.2em 0 .1em;font-family:var(--sans);font-size:13px;color:var(--term-dim);font-weight:600}

/* ---------- overlay / report ---------- */
.boot{
  position:fixed;inset:0;background:var(--ink);color:#cfdae5;z-index:50;
  display:grid;place-items:center;padding:24px;text-align:center;
}
.boot .in{max-width:38ch}
.boot h1{font-size:19px;margin:0 0 .5em;color:#fff;font-weight:640}
.boot p{margin:0 0 .6em;font-size:14px;color:#93a7bc}
.bar{height:3px;background:#31435a;border-radius:2px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:35%;background:var(--act);animation:sl 1.3s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
.modal{position:fixed;inset:0;background:rgba(10,16,22,.72);z-index:60;display:grid;place-items:center;padding:18px}
.sheet{
  background:var(--paper);border-radius:10px;max-width:640px;width:100%;
  max-height:82dvh;overflow-y:auto;padding:22px 24px;
}
.sheet h2{margin:0 0 .1em;font-size:19px;font-weight:660;letter-spacing:-.015em}
.sheet .sub{color:var(--muted);font-size:13.5px;margin:0 0 1.1em}
.sheet table{border-collapse:collapse;width:100%;font-size:14px;margin-bottom:1.2em}
.sheet th,.sheet td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left}
.sheet td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet .row{display:flex;gap:9px;flex-wrap:wrap}
.meter{height:6px;background:var(--paper-3);border-radius:3px;overflow:hidden;min-width:70px;flex:1}
.meter i{display:block;height:100%;background:var(--pass)}

/* ---------- mobile ---------- */
.mtabs{display:none}
.scrim{display:none}
@media (max-width:860px){
  .side{
    position:fixed;top:50px;bottom:0;left:0;z-index:40;width:270px;
    transform:translateX(-100%);transition:transform .18s ease;
  }
  body.nav .side{transform:none}
  body.nav .scrim{display:block;position:fixed;inset:50px 0 0;background:rgba(10,16,22,.5);z-index:35}
  @media (prefers-reduced-motion:reduce){.side{transition:none}}
  .mtabs{display:flex;gap:2px;padding:0 8px;background:var(--paper-2);border-bottom:1px solid var(--rule)}
  .mtab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;cursor:pointer;font-size:14px;color:var(--muted)}
  .mtab[aria-selected=true]{color:var(--text);border-bottom-color:var(--act);font-weight:600}
  .panes{flex-direction:column}
  .guide-pane,.work-pane{flex:1 1 auto}
  body[data-mv=code] .guide-pane{display:none}
  body[data-mv=task] .work-pane{display:none}
  .term{height:44%}
}
@media (min-width:861px){.menu-btn{display:none}}
</style>
</head>

</div>

    </div>
  </div>
</div>

<script type="application/json" id="bookdata">{"id":"74af4a6c-d907-4364-9172-118d228f7526","name":"IGCSE Computer Science - Python","children":[{"id":"b91e32a6-3183-4157-85db-228aff09c702","name":"1. Sequence, input and output","children":[{"id":"305be344-0a21-403c-b1c2-3d59c777745b","name":"Example: variables and print","guide":"# Variables and output\n\nA **variable** is a named box that stores a value. In Python you make one\njust by assigning to it:\n\n```python\nname = \"Ada Lovelace\"\nyear = 1843\n```\n\n`print()` sends things to the screen. Separate several items with commas\nand Python puts a space between them.\n\n## Your turn\nRun the code. Then change `name` to your own name and run it again.\n\n\u003e **Exam link:** in IGCSE pseudocode this would be\n\u003e `name \u003c- \"Ada Lovelace\"` and `OUTPUT name`\n","starter":"# EXAMPLE - read this, run it, then change something and run it again.\n\nname = \"Ada Lovelace\"      # a string\nyear = 1843                # an integer\n\nprint(\"Name:\", name)\nprint(\"Year:\", year)\nprint(\"Ada was born\", 2026 - 1815, \"years ago\")\n","isExample":true},{"id":"e34e19bc-a589-4d82-97a3-d1c0e97d03b1","name":"Greeting","guide":"# Greeting\n\nAsk the user for their name and print a greeting.\n\n## Example\n```\nEnter your name: Minji\nHello Minji\n```\n\n## Hint\n`input()` always gives you back a **string**. You can print two things at\nonce with a comma: `print(\"Hello\", name)`\n","starter":"# Ask the user for their name, then greet them.\n\nname = input(\"Enter your name: \")\n\n# TODO: print  Hello  followed by their name\n","tests":[{"in":"Minji","out":[{"pattern":"Hello Minji","ignore":"wc"}]},{"in":"Tom","out":[{"pattern":"Hello Tom","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nname = input(\"Enter your name: \")\nprint(\"Hello\", name)\n"},{"id":"dd20f219-f35f-4306-a1c3-572c0d79137d","name":"Add two numbers","guide":"# Add two numbers\n\nInput two whole numbers and output their total.\n\n## Example\n```\nEnter the first number: 4\nEnter the second number: 7\n11\n```\n\n## Hint\n`input()` returns a string, so `\"4\" + \"7\"` would give `\"47\"`.\nWrap it in `int(...)` to turn it into a number first.\n\n\u003e **Exam link:** this is **casting**, and it comes up constantly in\n\u003e Paper 2. `int(input())` is the Python version of\n\u003e `INPUT a` where `a` is declared as `INTEGER`.\n","starter":"# Input two whole numbers and print their total.\n\na = int(input(\"Enter the first number: \"))\n\n# TODO: input the second number (remember int(...) )\n# TODO: print the total\n","tests":[{"in":[4,7],"out":[{"pattern":"11"},{"typ":"c+","pattern":"int\\(input\\(","count":2,"ignore":"w"}]},{"in":[20,15],"out":[{"pattern":"35"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\na = int(input(\"Enter the first number: \"))\nb = int(input(\"Enter the second number: \"))\nprint(a + b)\n"},{"id":"09480d5d-319a-401b-825d-3e8c1a7fc8e5","name":"Area of a rectangle","guide":"# Area of a rectangle\n\nInput a width and a height (both whole numbers) and output the area.\n\n## Example\n```\nEnter the width: 5\nEnter the height: 3\nArea: 15\n```\n\n## Hint\nMultiplication in Python uses `*`.\n","starter":"# Input the width and height of a rectangle, output its area.\n\n# TODO\n","tests":[{"in":[5,3],"out":[{"pattern":"15"}]},{"in":[7,2],"out":[{"pattern":"14"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nw = int(input(\"Enter the width: \"))\nh = int(input(\"Enter the height: \"))\nprint(\"Area:\", w * h)\n"}]},{"id":"0cefd91e-17a3-4db5-910f-e371b23b6959","name":"2. Selection","children":[{"id":"23cb6492-01f0-46d3-95ba-a7e0da993428","name":"Example: if / else","guide":"# Making decisions\n\n`if` runs a block only when a condition is `True`.\n\n```python\nif age \u003e= 18:\n    print(\"adult\")\nelse:\n    print(\"minor\")\n```\n\nNote two things Python beginners get wrong:\n\n- the **colon** at the end of the `if` line\n- the **indentation** of the block underneath (4 spaces)\n\n## Comparison operators\n| Python | Meaning |\n|---|---|\n| `==` | equal to |\n| `!=` | not equal to |\n| `\u003c` `\u003e` | less / greater than |\n| `\u003c=` `\u003e=` | less / greater than or equal |\n\n`=` assigns, `==` compares. Mixing them up is the classic bug.\n","starter":"# EXAMPLE - selection lets the program choose between paths.\n\nage = int(input(\"How old are you? \"))\n\nif age \u003e= 18:\n    print(\"You are an adult\")\nelse:\n    print(\"You are a minor\")\n\n# Try changing \u003e= to \u003e and see what happens when you type 18\n","isExample":true},{"id":"249520c8-a895-4467-91b1-5be7b37e4876","name":"The larger number","guide":"# The larger number\n\nInput two whole numbers and output whichever is larger.\nIf they are the same, just output that number.\n\n## Example\n```\nEnter a: 5\nEnter b: 6\n6\n```\n","starter":"# Input two numbers and output the larger one.\n# If they are equal, output that number.\n\n# TODO\n","tests":[{"in":[5,6],"out":[{"pattern":"6"}]},{"in":[9,2],"out":[{"pattern":"9"}]},{"in":[4,4],"out":[{"pattern":"4"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\na = int(input(\"Enter a: \"))\nb = int(input(\"Enter b: \"))\nif a \u003e b:\n    print(a)\nelse:\n    print(b)\n"},{"id":"8f1617a6-e251-489c-b1fa-81ee261f2846","name":"Exam grade","guide":"# Exam grade\n\nInput a mark out of 100 and output the grade.\n\n| Mark | Grade |\n|---|---|\n| 80 - 100 | A |\n| 70 - 79 | B |\n| 60 - 69 | C |\n| 50 - 59 | D |\n| 0 - 49 | U |\n\nPrint the result **exactly** in this form: `Grade A`\n\n## Example\n```\nEnter the mark: 72\nGrade B\n```\n\n## Hint\nUse `elif` for the middle cases. Order matters - test the highest\nboundary first, then you only need one comparison per branch.\n\n```python\nif mark \u003e= 80:\n    ...\nelif mark \u003e= 70:\n    ...\n```\n","starter":"# Input a mark out of 100 and output the grade.\n#\n#   80 or more  -\u003e Grade A\n#   70 to 79    -\u003e Grade B\n#   60 to 69    -\u003e Grade C\n#   50 to 59    -\u003e Grade D\n#   below 50    -\u003e Grade U\n#\n# Print exactly like this:   Grade A\n\nmark = int(input(\"Enter the mark: \"))\n\n# TODO\n","tests":[{"in":[85],"out":[{"pattern":"Grade A","ignore":"w"}]},{"in":[72],"out":[{"pattern":"Grade B","ignore":"w"}]},{"in":[60],"out":[{"pattern":"Grade C","ignore":"w"}]},{"in":[50],"out":[{"pattern":"Grade D","ignore":"w"}]},{"in":[12],"out":[{"pattern":"Grade U","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nmark = int(input(\"Enter the mark: \"))\nif mark \u003e= 80:\n    print(\"Grade A\")\nelif mark \u003e= 70:\n    print(\"Grade B\")\nelif mark \u003e= 60:\n    print(\"Grade C\")\nelif mark \u003e= 50:\n    print(\"Grade D\")\nelse:\n    print(\"Grade U\")\n"},{"id":"2c2d56a2-01e7-485a-bce3-46d875fa1eae","name":"Leap year","guide":"# Leap year\n\nInput a year and output whether it is a leap year.\n\n**The rule:** divisible by 4, *except* years divisible by 100,\n*unless* they are also divisible by 400.\n\nSo 2024 and 2000 are leap years; 1900 and 2023 are not.\n\nPrint exactly:\n```\n2024 is a leap year\n1900 is not a leap year\n```\n\n## Hint\n`%` gives the remainder. `year % 4 == 0` means \"divides exactly by 4\".\nYou can combine conditions with `and` / `or`.\n","starter":"# Input a year and decide whether it is a leap year.\n#\n# A year is a leap year if it is divisible by 4,\n# EXCEPT century years, which must be divisible by 400.\n#\n# Print either:   2024 is a leap year\n# or:             1900 is not a leap year\n\n# TODO\n","tests":[{"in":[2024],"out":[{"pattern":"is a leap year","ignore":"wc"},{"typ":"-","pattern":"not a leap year","ignore":"wc"}]},{"in":[1900],"out":[{"pattern":"not a leap year","ignore":"wc"}]},{"in":[2000],"out":[{"pattern":"is a leap year","ignore":"wc"},{"typ":"-","pattern":"not a leap year","ignore":"wc"}]},{"in":[2023],"out":[{"pattern":"not a leap year","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nyear = int(input(\"Enter a year: \"))\nif year % 400 == 0 or (year % 4 == 0 and year % 100 != 0):\n    print(year, \"is a leap year\")\nelse:\n    print(year, \"is not a leap year\")\n"}]},{"id":"222ac73d-8eeb-4fd1-9f26-9bf749bd80cb","name":"3. Iteration","children":[{"id":"d028d8f5-cf9d-466d-a549-c9047bc6e84c","name":"Example: for and while","guide":"# Loops\n\nIGCSE distinguishes two kinds of loop, and Python has both.\n\n## Count-controlled: `for`\n```python\nfor i in range(1, 6):\n    print(i)\n```\n`range(1, 6)` gives 1, 2, 3, 4, 5 - the **stop value is not included**.\nThis trips up nearly everyone once.\n\n## Condition-controlled: `while`\n```python\nwhile total \u003c 10:\n    total = total + 3\n```\nA `while` loop checks **before** each pass, so it is a\n*pre-condition* loop. If the condition never becomes `False`\nyou get an infinite loop.\n","starter":"# EXAMPLE - two kinds of loop.\n\n# COUNT-CONTROLLED: you know how many times in advance\nfor i in range(1, 6):\n    print(\"i is\", i)\n\n# CONDITION-CONTROLLED: keep going until something changes\ntotal = 0\nwhile total \u003c 10:\n    total = total + 3\n    print(\"total is now\", total)\n","isExample":true},{"id":"20c1767c-31a3-4284-9bec-813729b8f6ce","name":"Times table","guide":"# Times table\n\nInput a number and print its full times table from 1 to 12.\n\n## Example\n```\nWhich table? 3\n3 x 1 = 3\n3 x 2 = 6\n...\n3 x 12 = 36\n```\n\n## Hint\n```python\nfor i in range(1, 13):\n    print(n, \"x\", i, \"=\", n * i)\n```\n","starter":"# Input a number and print its times table from 1 to 12.\n# Each line should look exactly like:   3 x 1 = 3\n\nn = int(input(\"Which table? \"))\n\n# TODO\n","tests":[{"in":[3],"out":[{"pattern":"3 x 1 = 3","ignore":"w"},{"pattern":"3 x 7 = 21","ignore":"w"},{"pattern":"3 x 12 = 36","ignore":"w"}]},{"in":[5],"out":[{"pattern":"5 x 4 = 20","ignore":"w"},{"pattern":"5 x 12 = 60","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nn = int(input(\"Which table? \"))\nfor i in range(1, 13):\n    print(n, \"x\", i, \"=\", n * i)\n"},{"id":"a5ac418b-b089-410c-9714-42daa1207a49","name":"Countdown","guide":"# Countdown\n\nInput a whole number and count down from it to 1, one per line,\nthen print `Liftoff`.\n\n## Example\n```\nEnter a number: 3\n3\n2\n1\nLiftoff\n```\n\n## Hint\nYou can do this with a `while` loop and a variable you keep\nsubtracting 1 from. Make sure the loop actually ends.\n","starter":"# Input a number and count down from it to 1,\n# one number per line, then print  Liftoff\n\n# TODO\n","tests":[{"in":[3],"out":[{"pattern":"3\\n2\\n1\\nLiftoff"}]},{"in":[5],"out":[{"pattern":"5\\n4\\n3\\n2\\n1\\nLiftoff"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nn = int(input(\"Enter a number: \"))\nwhile n \u003e 0:\n    print(n)\n    n = n - 1\nprint(\"Liftoff\")\n"},{"id":"bc5a24a7-67c3-4e09-9c8a-f5ecd63bde68","name":"Add up until zero","guide":"# Add up until zero\n\nKeep asking the user for numbers. When they enter `0`, stop and\nprint the total of all the numbers entered (the 0 does not matter,\nit adds nothing).\n\n## Example\n```\nEnter a number: 5\nEnter a number: 10\nEnter a number: 3\nEnter a number: 0\nTotal: 18\n```\n\n\u003e **Exam link:** the 0 here is a **sentinel value** (sometimes called a\n\u003e rogue value) - a special value that means \"stop\", chosen so it can\n\u003e never be real data.\n\n## Hint\nSet `total = 0` before the loop. Read the first number *before* the\nloop starts, or use `while True:` with a `break`.\n","starter":"# Keep asking the user for numbers until they enter 0.\n# Then print the total of everything they entered.\n\n# TODO\n","tests":[{"in":[5,10,3,0],"out":[{"pattern":"18"}]},{"in":[100,-50,0],"out":[{"pattern":"50"}]},{"in":[0],"out":[{"pattern":"0"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\ntotal = 0\nn = int(input(\"Enter a number: \"))\nwhile n != 0:\n    total = total + n\n    n = int(input(\"Enter a number: \"))\nprint(\"Total:\", total)\n"}]},{"id":"c15a8a24-9e63-4744-b37a-71c602f6c0a4","name":"4. String handling","children":[{"id":"b2a6006b-5c70-4b7b-842c-fdf3b78e0f59","name":"Example: working with strings","guide":"# String handling\n\n| Python | What it does | IGCSE pseudocode |\n|---|---|---|\n| `len(s)` | length | `LENGTH(s)` |\n| `s.upper()` | to capitals | `UCASE(s)` |\n| `s.lower()` | to lowercase | `LCASE(s)` |\n| `s[0]` | first character | `SUBSTRING(s, 1, 1)` |\n| `s[2:5]` | characters 2,3,4 | `SUBSTRING(s, 3, 3)` |\n\n**Watch out:** Python counts from **0**, but IGCSE pseudocode\n`SUBSTRING` counts from **1**. Know which one the question is asking for.\n","starter":"# EXAMPLE - strings are sequences of characters.\n\nword = \"Computer\"\n\nprint(len(word))        # how many characters\nprint(word.upper())     # COMPUTER\nprint(word.lower())     # computer\nprint(word[0])          # C   - counting starts at 0\nprint(word[0:4])        # Comp - characters 0,1,2,3\nprint(word[-1])         # r   - last character\n\nfor letter in word:\n    print(letter)\n","isExample":true},{"id":"b5321c33-bc45-45b8-b371-81563f003277","name":"Count the vowels","guide":"# Count the vowels\n\nInput some text and output how many vowels (a, e, i, o, u) it contains.\nCapital letters count too.\n\n## Example\n```\nEnter some text: Hello World\n3\n```\n\n## Hint\nLoop through each character. `if letter.lower() in \"aeiou\":` handles\nboth cases at once.\n","starter":"# Input a word or sentence and count how many vowels it contains.\n# Count a, e, i, o, u  - both capital and lowercase.\n\ntext = input(\"Enter some text: \")\n\n# TODO\n","tests":[{"in":["Hello World"],"out":[{"pattern":"3"}]},{"in":["AEIOU"],"out":[{"pattern":"5"}]},{"in":["rhythm"],"out":[{"pattern":"0"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\ntext = input(\"Enter some text: \")\ncount = 0\nfor letter in text:\n    if letter.lower() in \"aeiou\":\n        count = count + 1\nprint(count)\n"},{"id":"69c7e044-d82a-49de-ab1f-fc7f32bfa42b","name":"Reverse a word","guide":"# Reverse a word\n\nInput a word and print it backwards.\n\n## Example\n```\nEnter a word: python\nnohtyp\n```\n\n## Rule\nPython has a one-line trick for this (`word[::-1]`), but for this\nchallenge build the reversed string yourself with a loop. That is\nthe version that gets marks in an exam.\n\n## Hint\nStart with an empty string, then stick each new letter on the\n**front** of it: `reversed_word = letter + reversed_word`\n","starter":"# Input a word and print it backwards.\n# Build the answer yourself with a loop - do not use [::-1]\n\n# TODO\n","tests":[{"in":["python"],"out":[{"pattern":"nohtyp"},{"typ":"c-","pattern":"::-1","ignore":"w"}]},{"in":["Seoul"],"out":[{"pattern":"luoeS"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nword = input(\"Enter a word: \")\nrev = \"\"\nfor letter in word:\n    rev = letter + rev\nprint(rev)\n"},{"id":"12c47910-5860-4ffe-a1a2-b0f281008416","name":"Initials","guide":"# Initials\n\nInput a first name and a family name, then print the initials\nas capital letters with nothing between them.\n\n## Example\n```\nEnter first name: minji\nEnter family name: kim\nMK\n```\n\n## Hint\n`first[0]` gives the first character. `.upper()` capitalises it.\nJoin strings with `+`.\n","starter":"# Input a first name and a family name.\n# Print the two initials as capitals, joined together.\n\n# TODO\n","tests":[{"in":["minji","kim"],"out":[{"pattern":"MK"}]},{"in":["Ada","Lovelace"],"out":[{"pattern":"AL"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nfirst = input(\"Enter first name: \")\nfamily = input(\"Enter family name: \")\nprint(first[0].upper() + family[0].upper())\n"}]},{"id":"6a0acfc8-6902-4089-a267-76fd6ce30691","name":"5. Arrays (lists)","children":[{"id":"6ce8f62d-b1e7-4508-b3e2-2483eff9f4d4","name":"Example: lists","guide":"# Lists (arrays)\n\nA list holds many values under one name.\n\n```python\nscores = [12, 7, 25, 3, 18]\n```\n\n- `scores[0]` is the **first** item - Python indexes from 0\n- `len(scores)` is how many items there are\n- `scores.append(x)` adds to the end\n- the last item is `scores[len(scores) - 1]`, or `scores[-1]`\n\n\u003e **Exam link:** IGCSE calls these **one-dimensional arrays** and\n\u003e usually indexes them from 1. Read each question carefully to see\n\u003e which convention it uses.\n","starter":"# EXAMPLE - a list is the Python version of an IGCSE array.\n\nscores = [12, 7, 25, 3, 18]\n\nprint(scores)\nprint(scores[0])        # first item  - index 0\nprint(scores[2])        # third item\nprint(len(scores))      # how many items\n\nscores.append(40)       # add to the end\nscores[1] = 99          # change an item\n\nfor s in scores:\n    print(s)\n\n# or by index, which is closer to exam pseudocode\nfor i in range(len(scores)):\n    print(i, scores[i])\n","isExample":true},{"id":"ce8213bf-84d4-43f1-8138-146d1509ea17","name":"Largest in a list","guide":"# Largest in a list\n\nRead 5 numbers into a list, then find the largest **using a loop**\n(not `max()`).\n\n## Example\n```\nEnter a number: 3\nEnter a number: 9\nEnter a number: 2\nEnter a number: 7\nEnter a number: 1\nLargest: 9\n```\n\n## Hint\nAssume the first item is the largest so far, then compare every\nother item against it and update when you find something bigger.\nThis is the standard exam algorithm.\n","starter":"# Read 5 numbers from the user into a list,\n# then find and print the largest one.\n#\n# Do not use max() - find it with a loop.\n\nnumbers = []\n\n# TODO\n","tests":[{"in":[3,9,2,7,1],"out":[{"pattern":"9"},{"typ":"c-","pattern":"max\\(","ignore":"w"}]},{"in":[-4,-9,-2,-7,-100],"out":[{"pattern":"-2"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nnumbers = []\nfor i in range(5):\n    numbers.append(int(input(\"Enter a number: \")))\nlargest = numbers[0]\nfor n in numbers:\n    if n \u003e largest:\n        largest = n\nprint(\"Largest:\", largest)\n"},{"id":"ba02efaf-89a3-498e-8da5-9f2c77e756e1","name":"Linear search","guide":"# Linear search\n\nRead 5 numbers into a list, then read one more number - the value\nto search for.\n\n- If it is in the list, print `Found at position N`, counting the\n  **first item as position 1**\n- If it is not there, print `Not found`\n\n## Example\n```\nEnter a number: 10\nEnter a number: 20\nEnter a number: 30\nEnter a number: 40\nEnter a number: 50\nSearch for: 30\nFound at position 3\n```\n\n## Hint\nLoop with `for i in range(len(numbers)):` so you have the index.\nRemember Python's index 2 is the exam's position 3.\n\nUse a flag variable (`found = False`) so you can print `Not found`\nonce the loop has finished without a match.\n","starter":"# Read 5 numbers into a list, then read a number to search for.\n#\n# If it is in the list, print:      Found at position 3\n# (counting the first item as position 1)\n# If it is not there, print:        Not found\n\n# TODO\n","tests":[{"in":[10,20,30,40,50,30],"out":[{"pattern":"Found at position 3","ignore":"wc"}]},{"in":[10,20,30,40,50,10],"out":[{"pattern":"Found at position 1","ignore":"wc"}]},{"in":[10,20,30,40,50,99],"out":[{"pattern":"Not found","ignore":"wc"},{"typ":"-","pattern":"Found at position","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nnumbers = []\nfor i in range(5):\n    numbers.append(int(input(\"Enter a number: \")))\ntarget = int(input(\"Search for: \"))\nfound = False\nfor i in range(len(numbers)):\n    if numbers[i] == target and not found:\n        print(\"Found at position\", i + 1)\n        found = True\nif not found:\n    print(\"Not found\")\n"},{"id":"92e93d65-8c4c-444e-84a2-4c56eaffc368","name":"Bubble sort","guide":"# Bubble sort\n\nRead 5 numbers into a list and put them in ascending order.\nPrint them on one line separated by single spaces.\n\n**You must sort them yourself** - `sort()` and `sorted()` are blocked.\n\n## Example\n```\nEnter a number: 5\nEnter a number: 3\nEnter a number: 8\nEnter a number: 1\nEnter a number: 9\n1 3 5 8 9\n```\n\n## The algorithm\nCompare each pair of neighbours. If they are the wrong way round,\nswap them. Repeat passes until you do a whole pass with no swaps.\n\n## Hints\nSwapping in Python is neat: `a[i], a[i+1] = a[i+1], a[i]`\n\nTo print a list on one line: `print(\" \".join(str(n) for n in numbers))`\n","starter":"# Read 5 numbers into a list and sort them into ascending order\n# WITHOUT using sort() or sorted().\n#\n# Print the sorted numbers on one line, separated by spaces:\n#   1 3 5 8 9\n\n# TODO\n","tests":[{"in":[5,3,8,1,9],"out":[{"pattern":"1 3 5 8 9","ignore":"w"},{"typ":"c-","pattern":"sorted\\(|\\.sort\\(","ignore":"w"}]},{"in":[1,2,3,4,5],"out":[{"pattern":"1 2 3 4 5","ignore":"w"}]},{"in":[9,8,7,6,5],"out":[{"pattern":"5 6 7 8 9","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nnumbers = []\nfor i in range(5):\n    numbers.append(int(input(\"Enter a number: \")))\nfor a in range(len(numbers)):\n    for b in range(len(numbers) - 1):\n        if numbers[b] \u003e numbers[b + 1]:\n            numbers[b], numbers[b + 1] = numbers[b + 1], numbers[b]\nprint(\" \".join(str(n) for n in numbers))\n"},{"id":"a6665557-25c5-496e-934d-2529a18802e1","name":"2D array: seating plan","guide":"# 2D array: seating plan\n\n`seats` is a **two-dimensional array**: 3 rows of 4 seats.\n`0` means empty, `1` means taken.\n\nCount the empty seats and print exactly: `Empty seats: 4`\n\n## Hint\nYou need a loop inside a loop:\n\n```python\nfor row in range(3):\n    for col in range(4):\n        if seats[row][col] == 0:\n            ...\n```\n\n`seats[1][2]` is row 1, column 2 - **row first**.\n","starter":"# A classroom has 3 rows of 4 seats, stored as a 2D list.\n# 0 means empty, 1 means taken.\n\nseats = [\n    [1, 0, 1, 1],\n    [0, 0, 1, 0],\n    [1, 1, 1, 1]\n]\n\n# TODO: count how many seats are empty and print:  Empty seats: 4\n","tests":[{"in":"","out":[{"pattern":"Empty seats: 4","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nseats = [[1, 0, 1, 1], [0, 0, 1, 0], [1, 1, 1, 1]]\ncount = 0\nfor row in range(3):\n    for col in range(4):\n        if seats[row][col] == 0:\n            count = count + 1\nprint(\"Empty seats:\", count)\n"}]},{"id":"4fde5255-e975-48d0-a7cc-078043a76c4c","name":"6. Procedures and functions","children":[{"id":"cc2c0865-eecc-484e-9193-578792c63bd3","name":"Example: subroutines","guide":"# Procedures and functions\n\nBoth are written with `def` in Python. The difference is whether\nthey hand a value back.\n\n| | Returns a value? | Example |\n|---|---|---|\n| Procedure | no | `greet(\"Minji\")` |\n| Function | yes | `a = area(5, 3)` |\n\nThe values in the brackets are **parameters** when you write the\nsubroutine, and **arguments** when you call it.\n\n```python\ndef area(width, height):    # parameters\n    return width * height\n\narea(5, 3)                  # arguments\n```\n\nNothing inside a `def` runs until you **call** it.\n","starter":"# EXAMPLE - a subroutine is a named chunk of code you can reuse.\n\n# A PROCEDURE does something but returns nothing\ndef greet(name):\n    print(\"Hello\", name)\n    print(\"Welcome to the course\")\n\n# A FUNCTION returns a value\ndef area(width, height):\n    return width * height\n\ngreet(\"Minji\")\ngreet(\"Tom\")\n\na = area(5, 3)\nprint(\"The area is\", a)\n","isExample":true},{"id":"f116040f-206f-46c2-b1a3-60c9041fb38e","name":"Function: temperature converter","guide":"# Function: temperature converter\n\nWrite a function `c_to_f(celsius)` that **returns** the equivalent\ntemperature in Fahrenheit.\n\nThe formula is `F = C * 9 / 5 + 32`\n\n## Example\n```\nEnter a temperature in Celsius: 100\n212.0\n```\n\n## Hint\n`return` sends the value back to whoever called the function.\nA function that only `print`s is a procedure, and would fail here -\nthe tests call your function directly.\n","starter":"# Write a function called  c_to_f  that takes a temperature in\n# Celsius and RETURNS the temperature in Fahrenheit.\n#\n# The formula is:   F = C * 9 / 5 + 32\n\ndef c_to_f(celsius):\n    # TODO: return the answer\n    pass\n\n\n# This part is already written for you\ntemp = float(input(\"Enter a temperature in Celsius: \"))\nprint(c_to_f(temp))\n","tests":[{"in":[100],"out":[{"typ":"s+","statement":"c_to_f(0)","pattern":"32"},{"typ":"s+","statement":"c_to_f(100)","pattern":"212"},{"typ":"s+","statement":"c_to_f(-40)","pattern":"-40"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\ndef c_to_f(celsius):\n    return celsius * 9 / 5 + 32\n\ntemp = float(input(\"Enter a temperature in Celsius: \"))\nprint(c_to_f(temp))\n"},{"id":"d78a3c73-7527-4e86-9633-446c6f24d1d6","name":"Procedure: draw a box","guide":"# Procedure: draw a box\n\nWrite a procedure `draw_box(width, height)` that prints a solid\nrectangle of `*` characters.\n\n## Example\n```\nWidth: 4\nHeight: 3\n****\n****\n****\n```\n\n## Hint\n`\"*\" * 4` gives `\"****\"` - multiplying a string repeats it.\nThen you just need a loop that prints that line `height` times.\n","starter":"# Write a PROCEDURE called  draw_box  that takes a width and a height\n# and prints a rectangle of asterisks.\n#\n# draw_box(3, 2)  should print:\n#   ***\n#   ***\n\ndef draw_box(width, height):\n    # TODO\n    pass\n\n\n# Already written for you\nw = int(input(\"Width: \"))\nh = int(input(\"Height: \"))\ndraw_box(w, h)\n","tests":[{"in":[3,2],"out":[{"pattern":"\\*\\*\\*\\n\\*\\*\\*"},{"typ":"-","pattern":"\\*\\*\\*\\*"}]},{"in":[4,3],"out":[{"pattern":"\\*\\*\\*\\*\\n\\*\\*\\*\\*\\n\\*\\*\\*\\*"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\ndef draw_box(width, height):\n    for i in range(height):\n        print(\"*\" * width)\n\nw = int(input(\"Width: \"))\nh = int(input(\"Height: \"))\ndraw_box(w, h)\n"}]},{"id":"21bafee3-8132-43fc-b548-bacd9e7ea6da","name":"7. Validation","children":[{"id":"af160f44-3231-4ef0-87c2-3fc73ff5eb96","name":"Example: validation checks","guide":"# Validation\n\nValidation is the computer checking that data is **sensible**.\nIGCSE expects you to know these by name:\n\n| Check | What it tests |\n|---|---|\n| Range check | the value is between two limits |\n| Length check | the right number of characters |\n| Presence check | something was actually entered |\n| Type check | it is the right data type |\n| Format check | it matches a pattern, e.g. AB12CD |\n\nThe usual shape in code is: read once, then `while` the data is\nbad, complain and read again.\n\n\u003e Validation is not the same as **verification**. Verification checks\n\u003e the data was *copied* correctly - typing a password twice, for example.\n","starter":"# EXAMPLE - validation stops silly data getting into a program.\n\n# A RANGE CHECK using a while loop\nage = int(input(\"Enter your age (0-120): \"))\nwhile age \u003c 0 or age \u003e 120:\n    print(\"Out of range, try again\")\n    age = int(input(\"Enter your age (0-120): \"))\n\nprint(\"Accepted\", age)\n","isExample":true},{"id":"c226a1ab-e735-43e8-b58c-6947cc49b2c9","name":"Range check","guide":"# Range check\n\nKeep asking for a number until the user enters one between\n1 and 10 inclusive.\n\n- For each invalid entry, print `Out of range`\n- When a valid one arrives, print `Accepted` followed by the number\n\n## Example\n```\nEnter a number (1-10): 15\nOut of range\nEnter a number (1-10): 0\nOut of range\nEnter a number (1-10): 7\nAccepted 7\n```\n\n## Hint\nRead the first value before the loop, then loop while it is invalid.\n","starter":"# Keep asking for a number between 1 and 10 (inclusive)\n# until the user enters a valid one.\n#\n# For a bad number print:   Out of range\n# When you get a good one print:   Accepted 7\n\n# TODO\n","tests":[{"in":[15,0,7],"out":[{"pattern":"Out of range","count":2,"ignore":"wc"},{"pattern":"Accepted 7","ignore":"wc"},{"typ":"c+","pattern":"while","ignore":"w"}]},{"in":[5],"out":[{"pattern":"Accepted 5","ignore":"wc"},{"typ":"-","pattern":"Out of range","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nn = int(input(\"Enter a number (1-10): \"))\nwhile n \u003c 1 or n \u003e 10:\n    print(\"Out of range\")\n    n = int(input(\"Enter a number (1-10): \"))\nprint(\"Accepted\", n)\n"},{"id":"a815581b-9861-46fe-85c0-13f0cfa01303","name":"Length check","guide":"# Length check\n\nKeep asking for a password until it is at least 8 characters long.\n\n- Too short: print `Too short`\n- Otherwise: print `Password accepted`\n\n## Example\n```\nEnter a password: abc\nToo short\nEnter a password: password123\nPassword accepted\n```\n\n## Hint\n`len(password)` gives the number of characters. No `int()` here -\na password is a string.\n","starter":"# Keep asking for a password until it is at least 8 characters long.\n#\n# Too short  -\u003e  print:  Too short\n# Long enough -\u003e  print:  Password accepted\n\n# TODO\n","tests":[{"in":["abc","password123"],"out":[{"pattern":"Too short","count":1,"ignore":"wc"},{"pattern":"Password accepted","ignore":"wc"}]},{"in":["longenough"],"out":[{"pattern":"Password accepted","ignore":"wc"},{"typ":"-","pattern":"Too short","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\np = input(\"Enter a password: \")\nwhile len(p) \u003c 8:\n    print(\"Too short\")\n    p = input(\"Enter a password: \")\nprint(\"Password accepted\")\n"}]},{"id":"2a7aa868-7087-4756-9880-0dda870264f8","name":"8. File handling","children":[{"id":"de471f64-c710-45e4-bd98-cc83991c5e7d","name":"Example: reading a file","guide":"# File handling\n\nThree steps, always: **open**, use, **close**.\n\n```python\nfile = open(\"names.txt\", \"r\")\n...\nfile.close()\n```\n\n| Mode | Meaning |\n|---|---|\n| `\"r\"` | read |\n| `\"w\"` | write - **erases the file first** |\n| `\"a\"` | append - adds to the end |\n\nEach line you read still has its newline character on the end, so\n`.strip()` is nearly always what you want.\n\nLook at the tab next to the console - you can see `names.txt` there.\n","starter":"# EXAMPLE - names.txt sits next to this program.\n\nfile = open(\"names.txt\", \"r\")     # \"r\" = read\nfor line in file:\n    print(line.strip())           # strip() removes the newline\nfile.close()\n\nprint(\"---\")\n\n# Writing a new file\nout = open(\"output.txt\", \"w\")     # \"w\" = write (overwrites!)\nout.write(\"Hello from Python\\n\")\nout.close()\n","isExample":true,"additionalFiles":[{"filename":"names.txt","visible":true}],"files":{"names.txt":"Minji\nTom\nAisha\nJoon\nSara\n"}},{"id":"a3de972f-8a8a-47ca-8ddc-92fc7d1d7982","name":"Count the lines","guide":"# Count the lines\n\n`names.txt` contains one name per line. Count them and print the\ntotal followed by the word `names`, like this:\n\n```\n5 names\n```\n\n## Hint\nSet a counter to 0 before the loop and add 1 each time round.\nDo not hard-code the answer - the file could change.\n","starter":"# names.txt contains one name per line.\n# Count how many names there are and print:   5 names\n\n# TODO\n","tests":[{"in":"","out":[{"pattern":"5 names","ignore":"wc"},{"typ":"c+","pattern":"open\\(","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nf = open(\"names.txt\", \"r\")\ncount = 0\nfor line in f:\n    if line.strip() != \"\":\n        count = count + 1\nf.close()\nprint(count, \"names\")\n","additionalFiles":[{"filename":"names.txt","visible":true}],"files":{"names.txt":"Minji\nTom\nAisha\nJoon\nSara\n"}},{"id":"0d6a3a24-da3e-4db2-953d-4e991ab799b8","name":"Write a report file","guide":"# Write a report file\n\nInput a name and a score, then write one line to a file called\n`report.txt` in exactly this format:\n\n```\nMinji scored 45\n```\n\nThen print `Saved` to the screen.\n\n## Example\n```\nEnter a name: Minji\nEnter a score: 45\nSaved\n```\n\n## Hint\n`write()` only accepts strings, so you will need `str(score)`\nor an f-string: `f\"{name} scored {score}\"`.\n\nAlways `close()` the file when you have finished. In real Python the data\nmay still be sitting in a buffer until you do.\n","starter":"# Ask the user for a name and a score.\n# Save them to a file called  report.txt  in this format:\n#\n#   Minji scored 45\n#\n# Then print:  Saved\n\n# TODO\n","tests":[{"in":["Minji",45],"out":[{"pattern":"Saved","ignore":"wc"},{"typ":"f+","filename":"report.txt","pattern":"Minji scored 45","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nname = input(\"Enter a name: \")\nscore = input(\"Enter a score: \")\nf = open(\"report.txt\", \"w\")\nf.write(name + \" scored \" + str(score) + \"\\n\")\nf.close()\nprint(\"Saved\")\n"}]}]}</script>

<script>/* Runs student Python under Skulpt.
   Works in Node (for tests) and in the browser (embedded in the workbook). */
(function (root) {
"use strict";

/* Prelude is prepended to the student's code. It defines input() and open()
   inside the module namespace, so they shadow the builtins.
   NOTE: names must not start with a double underscore - inside a class body
   Python mangles __name to _Class__name, which would break the globals. */
function prelude(inputs, files) {
  return [
    "_sk_in = " + JSON.stringify(inputs),
    "_sk_idx = [0]",
    "_sk_files = " + JSON.stringify(files),
    "_sk_evals = {}",
    "def input(prompt=''):",
    "    print(prompt, end='')",
    "    if _sk_idx[0] >= len(_sk_in):",
    "        raise Exception('__NEED_INPUT__')",
    "    v = _sk_in[_sk_idx[0]]",
    "    _sk_idx[0] = _sk_idx[0] + 1",
    "    print(v)",
    "    return v",
    "class _SkFile:",
    "    def __init__(self, n, m):",
    "        self.name = n",
    "        self.mode = m",
    "        self.pos = 0",
    "        if 'r' in m:",
    "            if n not in _sk_files:",
    "                raise IOError(\"No such file: '\" + n + \"'\")",
    "            self.data = _sk_files[n]",
    "        elif 'a' in m and n in _sk_files:",
    "            self.data = _sk_files[n]",
    "        else:",
    "            self.data = ''",
    "            _sk_files[n] = ''",
    "    def _lines(self):",
    "        if self.data == '':",
    "            return []",
    "        parts = self.data.split('\\n')",
    "        out = []",
    "        i = 0",
    "        while i < len(parts):",
    "            if i < len(parts) - 1:",
    "                out.append(parts[i] + '\\n')",
    "            elif parts[i] != '':",
    "                out.append(parts[i])",
    "            i = i + 1",
    "        return out",
    "    def read(self):",
    "        return self.data",
    "    def readlines(self):",
    "        return self._lines()",
    "    def readline(self):",
    "        ls = self._lines()",
    "        if self.pos >= len(ls):",
    "            return ''",
    "        self.pos = self.pos + 1",
    "        return ls[self.pos - 1]",
    "    def __iter__(self):",
    "        return iter(self._lines())",
    "    def write(self, s):",
    "        self.data = self.data + str(s)",
    "        _sk_files[self.name] = self.data",
    "    def close(self):",
    "        _sk_files[self.name] = self.data",
    "    def __enter__(self):",
    "        return self",
    "    def __exit__(self, a, b, c):",
    "        self.close()",
    "        return False",
    "def open(n, m='r'):",
    "    return _SkFile(n, m)",
    "",
  ].join("\n");
}

/* statements to evaluate after the program finishes (for `s+` tests) */
function evalTail(statements) {
  if (!statements || !statements.length) return "";
  let s = "\n";
  for (const st of statements) {
    const key = JSON.stringify(st);
    s += "try:\n    _sk_evals[" + key + "] = str(" + st + ")\n" +
         "except Exception as _sk_e:\n    _sk_evals[" + key + "] = '\\x01' + str(_sk_e)\n";
  }
  return s;
}

function remap(Sk, v) {
  if (v === undefined || v === null) return null;
  try { return Sk.ffi.remapToJs(v); } catch (e) { return null; }
}

async function run(Sk, opts) {
  const code = opts.code || "";
  const pre = prelude(opts.inputs || [], opts.files || {});
  const offset = (pre.match(/\n/g) || []).length;
  const full = pre + code + "\n" + evalTail(opts.statements);

  let out = "";
  Sk.configure({
    output: t => { out += t; },
    read: f => {
      if (!Sk.builtinFiles || Sk.builtinFiles.files[f] === undefined)
        throw "File not found: '" + f + "'";
      return Sk.builtinFiles.files[f];
    },
    __future__: Sk.python3,
    execLimit: opts.limit || 8000,
    killableWhile: true,
    killableFor: true,
  });

  const r = { status: "ok", output: "", error: "", line: 0, used: 0, files: {}, evals: {} };
  let mod = null;
  try {
    mod = await Sk.misceval.asyncToPromise(
      () => Sk.importMainWithBody("<stdin>", false, full, true));
  } catch (e) {
    const msg = (() => {
      try { return Sk.builtin.str(e).v; } catch (_) { return String(e); }
    })();
    const name = (e && e.tp$name) || "Error";
    if (msg.indexOf("__NEED_INPUT__") !== -1) {
      r.status = "need_input";
    } else if (name === "TimeLimitError") {
      r.status = "error";
      r.error = "Your program ran for too long and was stopped.\n" +
                "Check that every loop can actually finish.";
    } else {
      r.status = "error";
      r.error = name + ": " + msg;
      const tb = (e && e.traceback) || [];
      if (tb.length && tb[0].lineno) r.line = Math.max(0, tb[0].lineno - offset);
    }
  }
  r.output = out;
  if (mod && mod.$d) {
    const idx = remap(Sk, mod.$d._sk_idx);
    r.used = idx ? idx[0] : 0;
    r.files = remap(Sk, mod.$d._sk_files) || {};
    r.evals = remap(Sk, mod.$d._sk_evals) || {};
  }
  return r;
}

root.SkRunner = { run, prelude, evalTail };

})(typeof globalThis !== "undefined" ? globalThis : window);

if (typeof module !== "undefined" && module.exports) module.exports = globalThis.SkRunner;
</script>
<script>
"use strict";
const BOOK = JSON.parse(document.getElementById("bookdata").textContent);
const $ = id => document.getElementById(id);

/* ================= flatten ================= */
const SECTIONS = [], BY_ID = {}, SECTION_OF = {};
(function flat(node, secName){
  for (const c of node.children || []) {
    if (c.children) {
      SECTIONS.push({ name: c.name, items: c.children.filter(x => !x.children) });
      flat(c, c.name);
    } else { BY_ID[c.id] = c; SECTION_OF[c.id] = secName || ""; }
  }
})(BOOK, "");
const ORDER = SECTIONS.flatMap(s => s.items.map(i => i.id));

/* ================= state ================= */
const KEY = "igcse-python-v1";
let state = { cur: ORDER[0], code: {}, done: {}, tried: {}, sol: false };
let memOnly = false;

/* When this page is served by Google Apps Script, google.script.run is present
   and every call carries the student's signed-in school identity. Otherwise the
   workbook runs standalone and keeps progress in this browser only. */
const REMOTE = typeof google !== "undefined" && google.script && google.script.run;
let who = "";

function gcall(fn, arg){
  return new Promise((res, rej) => {
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](arg);
  });
}

async function load(){
  if (REMOTE) {
    try {
      const r = await gcall("getMyState");
      who = (r && r.email) || "";
      if (r && r.state) { try { Object.assign(state, JSON.parse(r.state)); } catch (e) {} }
      if (who) setWho(who);
    } catch (e) {
      memOnly = true;
      setWho("not signed in - progress will not be saved", true);
    }
  } else {
    try {
      const r = await window.storage.get(KEY);
      if (r && r.value) Object.assign(state, JSON.parse(r.value));
    } catch (e) { /* first run, or storage unavailable */ }
  }
  if (!BY_ID[state.cur]) state.cur = ORDER[0];
}

let saveT = null;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try {
      if (REMOTE) await gcall("saveState", JSON.stringify(state));
      else await window.storage.set(KEY, JSON.stringify(state));
    } catch (e) { memOnly = true; }
  }, REMOTE ? 1500 : 250);
}

/* one row per student per challenge in the teacher's sheet */
function report(id, outcome){
  if (!REMOTE) return;
  const ch = BY_ID[id];
  gcall("recordResult", {
    challengeId: id,
    section: SECTION_OF[id] || "",
    challenge: ch ? ch.name : id,
    outcome: !!outcome,
    code: (state.code[id] || "").slice(0, 4000),
  }).catch(() => { memOnly = true; });
}

function setWho(text, bad){
  const el = $("who");
  if (!el) return;
  el.textContent = text;
  el.classList.toggle("bad", !!bad);
}

/* ================= markdown ================= */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const KW = new Set(("False None True and as assert async await break class continue def del "+
 "elif else except finally for from global if import in is lambda nonlocal not or pass "+
 "raise return try while with yield print input int str float len range open append "+
 "upper lower strip split join sorted sort max min sum abs round").split(" "));
const SOFT = new Set("print input int str float len range open append upper lower strip split join sorted sort max min sum abs round".split(" "));

function hi(src){
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += '<span class="tok-com">' + esc(t) + "</span>";
    else if (m[2]) out += '<span class="tok-str">' + esc(t) + "</span>";
    else if (m[3]) out += '<span class="tok-num">' + esc(t) + "</span>";
    else if (KW.has(t)) out += '<span class="' + (SOFT.has(t) ? "tok-fn" : "tok-kw") + '">' + esc(t) + "</span>";
    else out += esc(t);
    last = m.index + t.length;
  }
  return out + esc(src.slice(last));
}

function inline(s){
  let t = esc(s);
  // park code spans so ** and * inside them are never treated as markup
  const held = [];
  t = t.replace(/`([^`]+)`/g, (_, c) => "\u0000" + (held.push(c) - 1) + "\u0000");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + held[i] + "</code>");
  return t;
}

function md(src){
  const L = src.replace(/\r/g, "").split("\n");
  const o = [];
  let i = 0;
  const cell = r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(x => x.trim());
  while (i < L.length) {
    const ln = L[i];
    if (/^```/.test(ln)) {
      const buf = []; i++;
      while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      i++;
      o.push("<pre><code>" + hi(buf.join("\n")) + "</code></pre>");
    } else if (/^(#{1,4})\s+/.test(ln)) {
      const m = ln.match(/^(#{1,4})\s+(.*)$/);
      const h = Math.min(m[1].length, 3);
      o.push("<h" + h + ">" + inline(m[2]) + "</h" + h + ">"); i++;
    } else if (/^\s*\|/.test(ln) && i + 1 < L.length && /^\s*\|?[\s:|-]+$/.test(L[i+1]) && L[i+1].includes("-")) {
      const head = cell(ln); i += 2;
      const rows = [];
      while (i < L.length && /^\s*\|/.test(L[i])) rows.push(cell(L[i++]));
      o.push("<table><thead><tr>" + head.map(c => "<th>" + inline(c) + "</th>").join("") +
        "</tr></thead><tbody>" + rows.map(r => "<tr>" +
        r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>");
    } else if (/^>\s?/.test(ln)) {
      const buf = [];
      while (i < L.length && /^>\s?/.test(L[i])) buf.push(L[i++].replace(/^>\s?/, ""));
      o.push("<blockquote>" + md(buf.join("\n")) + "</blockquote>");
    } else if (/^\s*[-*]\s+/.test(ln)) {
      const buf = [];
      while (i < L.length && /^\s*[-*]\s+/.test(L[i])) buf.push(L[i++].replace(/^\s*[-*]\s+/, ""));
      o.push("<ul>" + buf.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>");
    } else if (/^\s*\d+\.\s+/.test(ln)) {
      const buf = [];
      while (i < L.length && /^\s*\d+\.\s+/.test(L[i])) buf.push(L[i++].replace(/^\s*\d+\.\s+/, ""));
      o.push("<ol>" + buf.map(x => "<li>" + inline(x) + "</li>").join("") + "</ol>");
    } else if (/^\s*---+\s*$/.test(ln)) { o.push("<hr>"); i++; }
    else if (ln.trim() === "") { i++; }
    else {
      const buf = [];
      while (i < L.length && L[i].trim() !== "" && !/^(```|#{1,4}\s|>|\s*[-*]\s|\s*\d+\.\s|\s*\|)/.test(L[i])) buf.push(L[i++]);
      o.push("<p>" + inline(buf.join(" ")) + "</p>");
    }
  }
  return o.join("\n");
}

/* ================= python engine ================= */
let ready = false, busy = false;

function bootFail(msg){
  $("bootmsg").innerHTML = msg;
  const bar = $("bootmsg").parentElement.querySelector(".bar");
  if (bar) bar.remove();
  setStatus("Python unavailable", true);
}

const BUILD = "lite";

async function boot(){
  const missing = [];
  if (typeof Sk === "undefined") missing.push("Sk");
  if (typeof SkRunner === "undefined") missing.push("SkRunner");
  if (missing.length) {
    const kb = Math.round(document.documentElement.outerHTML.length / 1024);
    const advice = BUILD === "lite"
      ? "This copy loads Python from <code>cdn.jsdelivr.net</code>. If your network " +
        "blocks that address, use the full self-contained copy instead."
      : "This copy has Python built in, so nothing should need downloading. If you " +
        "pasted it into Google Apps Script, the paste was almost certainly cut short - " +
        "use the <b>lite</b> copy of the workbook instead, which is far smaller.";
    bootFail(advice +
      '<br><br><span style="font-size:12px;opacity:.75">missing: ' + missing.join(", ") +
      " &middot; build: " + BUILD + " &middot; page: " + kb + " KB</span>");
    return;
  }
  try {
    const r = await SkRunner.run(Sk, { code: 'print("ok")', inputs: [] });
    if (r.status !== "ok" || r.output.trim() !== "ok") throw new Error(r.error || "self-test failed");
    ready = true;
    $("boot").remove();
    setStatus("ready");
  } catch (e) {
    bootFail("Python loaded but could not run, which usually means this page is " +
             "sandboxed. Download the file and open it directly in a browser.");
  }
}
function setStatus(t, bad){
  const el = $("status");
  el.textContent = t;
  el.classList.toggle("bad", !!bad);
}

/* CTX holds the files and statement values produced by the most recent run,
   which is what the requirement checker inspects. */
let CTX = { files: {}, evals: {} };
function getFile(n){ const v = CTX.files[n]; return v === undefined ? null : v; }
function pyEval(stmt){
  const v = CTX.evals[stmt];
  if (v === undefined) return { ok: false, value: "not evaluated" };
  if (typeof v === "string" && v.charCodeAt(0) === 1) return { ok: false, value: v.slice(1) };
  return { ok: true, value: v };
}

/* every run starts from a clean copy of the challenge's input files */
function startFiles(ch){
  const f = {};
  for (const af of ch.additionalFiles || []) f[af.filename] = (ch.files || {})[af.filename];
  return f;
}
async function pyRun(code, inputs, ch, statements){
  const r = await SkRunner.run(Sk, {
    code, inputs, files: startFiles(ch), statements: statements || [],
  });
  CTX = { files: r.files || {}, evals: r.evals || {} };
  return r;
}

/* ================= test checking ================= */
function norm(t, f){
  if (f.includes("w")) t = t.replace(/[ \t]+/g, "");
  if (f.includes("p")) t = t.replace(/[^\w\s]/g, "");
  return t;
}
function countMatches(subj, pat, f){
  let re;
  try { re = new RegExp(pat, f.includes("c") ? "gi" : "g"); }
  catch (e) { return subj.includes(pat) ? 1 : 0; }
  return (subj.match(re) || []).length;
}
function describe(req){
  const p = "<code>" + esc(req.pattern) + "</code>";
  switch (req.typ || "+") {
    case "-":  return "the output should not include " + p;
    case "c+": return "your code needs to use " + p;
    case "c-": return "your code must not use " + p;
    case "f+": return "the file <code>" + esc(req.filename) + "</code> should contain " + p;
    case "f-": return "the file <code>" + esc(req.filename) + "</code> should not contain " + p;
    case "s+": return "<code>" + esc(req.statement) + "</code> should give " + p;
    case "s-": return "<code>" + esc(req.statement) + "</code> should not give " + p;
    default:   return "the output should include " + p;
  }
}
function checkReq(req, out, code){
  const typ = req.typ || "+", f = req.ignore || "";
  let subj = "";
  if (typ === "c+" || typ === "c-") subj = code;
  else if (typ === "f+" || typ === "f-") subj = getFile(req.filename) || "";
  else if (typ === "s+" || typ === "s-") {
    const r = pyEval(req.statement);
    if (!r.ok) return { ok: false, why: "<code>" + esc(req.statement) + "</code> could not run (" + esc(r.value) + ")" };
    subj = r.value;
  } else subj = out;
  const n = countMatches(norm(subj, f), norm(req.pattern, f), f);
  const pos = typ === "+" || typ === "c+" || typ === "f+" || typ === "s+";
  const cnt = req.count == null ? -1 : req.count;
  let ok;
  if (cnt !== -1) ok = pos ? n === cnt : n !== cnt;
  else ok = pos ? n > 0 : n === 0;
  let why = describe(req);
  if (cnt !== -1 && pos) why += " exactly " + cnt + " times (found " + n + ")";
  return { ok, why };
}

async function runTests(ch, code){
  const results = [];
  for (const t of ch.tests) {
    const ins = t.in == null ? [] : (Array.isArray(t.in) ? t.in.map(String) : (t.in === "" ? [] : String(t.in).split("\n")));
    let reqList = t.out;
    if (typeof reqList === "string") reqList = [{ pattern: reqList }];
    const stmts = (reqList || []).filter(q => q.statement).map(q => q.statement);
    const r = await pyRun(code, ins, ch, stmts);
    const row = { ins, ok: false, why: "", output: r.output };
    if (r.status === "error") { row.why = "your program stopped with an error"; }
    else if (r.status === "need_input") { row.why = "your program asked for more input than the test provides"; }
    else {
      row.ok = true;
      for (const req of reqList || []) {
        const c = checkReq(req, r.output, code);
        if (!c.ok) { row.ok = false; row.why = c.why; break; }
      }
    }
    results.push(row);
  }
  return results;
}

/* ================= editor ================= */
const ed = $("ed"), gutter = $("gutter"), edhl = $("edhl");

function syncScroll(){
  edhl.scrollTop = ed.scrollTop;
  edhl.scrollLeft = ed.scrollLeft;
  gutter.scrollTop = ed.scrollTop;
}

/* repaints the highlight layer and the line numbers.
   errLine > 0 marks that line in the gutter. */
function paintCode(errLine){
  const v = ed.value;
  // trailing newline keeps the last line from collapsing in the <pre>
  edhl.firstChild.innerHTML = hi(v) + "\n";
  const lines = v.split("\n").length;
  let g = "";
  for (let i = 1; i <= lines; i++)
    g += (i === errLine ? '<span class="err">' + i + "</span>" : String(i)) +
         (i < lines ? "\n" : "");
  gutter.innerHTML = g;
  syncScroll();
}
const syncGutter = () => paintCode(0);

ed.addEventListener("input", () => {
  paintCode(0);
  state.code[state.cur] = ed.value;
  save();
});
ed.addEventListener("scroll", syncScroll);
ed.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault(); doRun(false); return;
  }
  if (e.key === "Tab") {
    e.preventDefault();
    const s = ed.selectionStart, t = ed.selectionEnd;
    ed.value = ed.value.slice(0, s) + "    " + ed.value.slice(t);
    ed.selectionStart = ed.selectionEnd = s + 4;
    ed.dispatchEvent(new Event("input"));
  } else if (e.key === "Enter") {
    const s = ed.selectionStart;
    const line = ed.value.slice(0, s).split("\n").pop();
    const pad = (line.match(/^[ \t]*/) || [""])[0];
    const extra = /:\s*$/.test(line) ? "    " : "";
    if (pad || extra) {
      e.preventDefault();
      const ins = "\n" + pad + extra;
      ed.value = ed.value.slice(0, s) + ins + ed.value.slice(ed.selectionEnd);
      ed.selectionStart = ed.selectionEnd = s + ins.length;
      ed.dispatchEvent(new Event("input"));
    }
  }
});

/* ================= console ================= */
let view = "out";
let liveInputs = [];
let lastRun = null;

function setView(v){
  view = v;
  $("tabOut").setAttribute("aria-selected", v === "out");
  $("tabRes").setAttribute("aria-selected", v === "res");
  $("tabFiles").setAttribute("aria-selected", v === "files");
  draw();
}
$("tabOut").onclick = () => setView("out");
$("tabRes").onclick = () => setView("res");
$("tabFiles").onclick = () => setView("files");

function draw(){
  const b = $("termBody");
  const ch = BY_ID[state.cur];
  if (view === "files") {
    const src = (lastRun && lastRun.files) ? lastRun.files : (ch.files || {});
    const names = Object.keys(src);
    let h = '<div class="files">';
    if (!names.length) h += '<p class="note">No files yet.</p>';
    for (const n of names) h += "<h4>" + esc(n) + "</h4><pre>" + esc(src[n]) + "</pre>";
    b.innerHTML = h + "</div>";
    return;
  }
  if (view === "res") {
    if (!lastRun || !lastRun.tests) { b.innerHTML = '<p class="note">Press “Check answer” to run the tests.</p>'; return; }
    const rs = lastRun.tests, pass = rs.filter(r => r.ok).length;
    let h = '<div class="banner' + (pass === rs.length ? "" : " no") + '">' +
      (pass === rs.length ? "All " + rs.length + " tests passed." :
        pass + " of " + rs.length + " tests passed. Keep going.") + "</div><ul class='res'>";
    rs.forEach((r, i) => {
      h += '<li><span class="mark ' + (r.ok ? "ok" : "no") + '">' + (r.ok ? "✓" : "✕") + "</span><div>" +
        "Test " + (i + 1) + (r.ins.length ? " · input " + esc(r.ins.join(", ")) : "") +
        (r.ok ? "" : '<span class="why">' + r.why + "</span>") + "</div></li>";
    });
    b.innerHTML = h + "</ul>";
    return;
  }
  if (!lastRun) { b.innerHTML = '<p class="note">Press “Run” to try your code.</p>'; return; }
  const r = lastRun.run;
  let h = '<pre class="out">' + esc(r.output || "") + "</pre>";
  if (r.status === "error") {
    h += '<p class="err">' + esc(r.error) + (r.line ? "\n  line " + r.line + ": " + esc((ed.value.split("\n")[r.line - 1] || "").trim()) : "") + "</p>";
  }
  b.innerHTML = h;
  if (r.status === "need_input") {
    const row = document.createElement("div");
    row.className = "in-row";
    row.innerHTML = '<span class="caret">▸</span>';
    const inp = document.createElement("input");
    inp.setAttribute("aria-label", "Program input");
    inp.autocomplete = "off";
    row.appendChild(inp);
    b.appendChild(row);
    inp.focus();
    inp.onkeydown = e => {
      if (e.key !== "Enter") return;
      liveInputs.push(inp.value);
      doRun(true);
    };
  }
  b.scrollTop = b.scrollHeight;
}

/* ================= actions ================= */
function markTried(){
  if (!state.done[state.cur]) {
    const first = !state.tried[state.cur];
    state.tried[state.cur] = true; save(); renderSide();
    if (first && !BY_ID[state.cur].tests) report(state.cur, false);
  }
}
function markDone(){
  if (!state.done[state.cur]) {
    state.done[state.cur] = true; save(); renderSide();
    if (!BY_ID[state.cur].tests) report(state.cur, true);
  }
  if (BY_ID[state.cur].solution) $("solBtn").hidden = false;
}

async function doRun(keepInputs){
  if (!ready || busy) return;
  busy = true; setStatus("running"); $("runBtn").disabled = true;
  if (!keepInputs) liveInputs = [];
  const ch = BY_ID[state.cur];
  try {
    const r = await pyRun(ed.value, liveInputs, ch, []);
    lastRun = { run: r, tests: lastRun && lastRun.tests, files: r.files };
    paintCode(r.status === "error" ? r.line : 0);
    setView("out");
    if (r.status === "ok" && ch.isExample) markDone();
    else if (r.status !== "need_input") markTried();
  } finally {
    busy = false; $("runBtn").disabled = false; setStatus("ready");
  }
}

async function doCheck(){
  const ch = BY_ID[state.cur];
  if (!ready || busy) return;
  if (!ch.tests) { doRun(false); return; }
  busy = true; setStatus("checking"); $("checkBtn").disabled = true;
  try {
    const rs = await runTests(ch, ed.value);
    lastRun = { run: (lastRun && lastRun.run) || { status: "ok", output: "" },
                tests: rs, files: (lastRun && lastRun.files) || {} };
    const pass = rs.every(r => r.ok);
    const pill = $("resPill");
    pill.hidden = false;
    pill.textContent = rs.filter(r => r.ok).length + "/" + rs.length;
    pill.className = "pill " + (pass ? "ok" : "no");
    if (pass) markDone(); else markTried();
    report(state.cur, pass);
    setView("res");
  } finally {
    busy = false; $("checkBtn").disabled = false; setStatus("ready");
  }
}

$("runBtn").onclick = () => doRun(false);
$("checkBtn").onclick = doCheck;
$("resetBtn").onclick = () => {
  if (!confirm("Replace your code with the starter code?")) return;
  ed.value = BY_ID[state.cur].starter || "";
  state.code[state.cur] = ed.value;
  syncGutter(); save();
};
$("solBtn").onclick = () => {
  const ch = BY_ID[state.cur];
  if (!ch.solution) return;
  if (!confirm("Show a model answer? Your own code will stay in the console history only.")) return;
  ed.value = ch.solution;
  state.code[state.cur] = ed.value;
  syncGutter(); save();
};

/* ================= navigation ================= */
function renderSide(){
  const el = $("side");
  el.innerHTML = SECTIONS.map(s =>
    "<h2>" + esc(s.name) + "</h2><ul>" + s.items.map(it => {
      const cls = state.done[it.id] ? "done" : (state.tried[it.id] ? "tried" : "");
      return '<li><button class="ch ' + cls + '" data-id="' + it.id + '"' +
        (it.id === state.cur ? ' aria-current="true"' : "") +
        '><span class="dot"></span><span>' + esc(it.name) + "</span></button></li>";
    }).join("") + "</ul>").join("");
  el.querySelectorAll(".ch").forEach(b => b.onclick = () => {
    go(b.dataset.id);
    document.body.classList.remove("nav");
  });
}

function go(id){
  state.cur = id; save();
  const ch = BY_ID[id];
  $("chTitle").textContent = ch.name;
  $("chKind").textContent = ch.isExample ? "example" : (ch.tests ? ch.tests.length + " tests" : "open task");
  $("guide").innerHTML = md(ch.guide || "");
  $("guide").scrollTop = 0;
  ed.value = state.code[id] != null ? state.code[id] : (ch.starter || "");
  syncGutter();
  lastRun = null; liveInputs = [];
  $("resPill").hidden = true;
  $("tabFiles").hidden = !(ch.additionalFiles && ch.additionalFiles.length);
  $("checkBtn").textContent = ch.tests ? "Check answer" : "Run";
  $("checkBtn").hidden = !ch.tests;
  $("solBtn").hidden = !(ch.solution && (state.done[id] || state.sol));
  setView("out");
  renderSide();
}

$("menuBtn").onclick = () => document.body.classList.toggle("nav");
$("scrim").onclick = () => document.body.classList.remove("nav");
$("mtTask").onclick = () => setMV("task");
$("mtCode").onclick = () => setMV("code");
function setMV(v){
  document.body.dataset.mv = v;
  $("mtTask").setAttribute("aria-selected", v === "task");
  $("mtCode").setAttribute("aria-selected", v === "code");
}

/* ================= report ================= */
$("reportBtn").onclick = () => {
  const rows = SECTIONS.map(s => {
    const total = s.items.length;
    const done = s.items.filter(i => state.done[i.id]).length;
    return { name: s.name, done, total };
  });
  const td = rows.reduce((a, r) => a + r.done, 0);
  const tt = rows.reduce((a, r) => a + r.total, 0);
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = '<div class="sheet" role="dialog" aria-label="Progress"><h2>Progress</h2>' +
    '<p class="sub">' + td + " of " + tt + " finished" +
    (memOnly ? " · not being saved" : REMOTE ? " · saved to your teacher's sheet" : "") +
    "</p><table><tbody>" +
    rows.map(r => "<tr><td>" + esc(r.name) + '</td><td style="width:38%"><div class="meter"><i style="width:' +
      (r.total ? Math.round(r.done / r.total * 100) : 0) + '%"></i></div></td><td class="n">' +
      r.done + " / " + r.total + "</td></tr>").join("") +
    '</tbody></table><div class="row"><button class="btn" id="mClose">Close</button>' +
    '<button class="btn" id="mSol">' + (state.sol ? "Lock model answers" : "Unlock model answers") + "</button>" +
    '<button class="btn" id="mWipe">Clear all progress</button></div></div>';
  document.body.appendChild(m);
  const close = () => m.remove();
  m.onclick = e => { if (e.target === m) close(); };
  $("mClose").onclick = close;
  $("mSol").onclick = () => { state.sol = !state.sol; save(); close(); go(state.cur); };
  $("mWipe").onclick = () => {
    if (!confirm("Clear all saved code and progress? This cannot be undone.")) return;
    state = { cur: ORDER[0], code: {}, done: {}, tried: {}, sol: false };
    save(); close(); go(state.cur);
  };
};

/* ================= start ================= */
(async function(){
  await load();
  renderSide();
  go(state.cur);
  await boot();
})();
</script>
