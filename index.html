"},{"id":"1fc9202d-c422-4917-876b-b4807260ca52","name":"Type check","guide":"# Type check\n\nIf the user types `ten` when you asked for a number, `int()` **crashes** the\nprogram with a `ValueError`.\n\n`try` and `except` stop that. Python **tries** the risky line; if it goes\nwrong, it runs the `except` block instead of stopping.\n\n## Task\nKeep asking for an age until the user enters a whole number.\n\n* not a number: print `Numbers only`\n* valid: print `Accepted 15`\n\n## Hint\n```python\ntry:\n    age = int(input(\"Enter your age: \"))\n    valid = True\nexcept ValueError:\n    print(\"Numbers only\")\n```\n\nCatch `ValueError` specifically, not everything - a bare `except` hides real\nbugs.\n","starter":"# Keep asking until the user enters a whole number.\n\nvalid = False\n\n# TODO: use try and except inside a while loop\n","tests":[{"in":["ten","abc","15"],"out":[{"pattern":"Numbers only","count":2,"ignore":"wc"},{"pattern":"Accepted 15","ignore":"wc"},{"typ":"c+","pattern":"except","ignore":"w"}]},{"in":["30"],"out":[{"pattern":"Accepted 30","ignore":"wc"},{"typ":"-","pattern":"Numbers only","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nvalid = False\n\nwhile not valid:\n    try:\n        age = int(input(\"Enter your age: \"))\n        valid = True\n    except ValueError:\n        print(\"Numbers only\")\n\nprint(\"Accepted\", age)\n"},{"id":"77218640-cd49-410f-8bd0-cb6db8e7b4bb","name":"Format check","guide":"# Format check\n\nA format check tests that data follows a **pattern**.\n\nKorean mobile numbers start `010`, `011` or `017` and are 11 digits long.\n\n## Task\nKeep asking until the phone number is valid.\n\n* invalid: print `Invalid number`\n* valid: print `Number accepted`\n\n```\nEnter your number: 12345\nInvalid number\nEnter your number: 01012341234\nNumber accepted\n```\n\n## Hint\n`phone[0:3]` gives the first three characters. `len(phone)` gives the length.\n`phone.isnumeric()` is `True` if every character is a digit.\n","starter":"# Keep asking until the phone number matches the pattern.\n\n# TODO\n","tests":[{"in":["12345","01012341234"],"out":[{"pattern":"Invalid number","count":1,"ignore":"wc"},{"pattern":"Number accepted","ignore":"wc"}]},{"in":["010abcd1234","01112341234"],"out":[{"pattern":"Invalid number","count":1,"ignore":"wc"},{"pattern":"Number accepted","ignore":"wc"}]},{"in":["01712341234"],"out":[{"pattern":"Number accepted","ignore":"wc"},{"typ":"-","pattern":"Invalid number","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\naccepted = False\n\nwhile not accepted:\n    phone = input(\"Enter your number: \")\n    if phone[0:3] in [\"010\", \"011\", \"017\"] and len(phone) == 11 and phone.isnumeric():\n        accepted = True\n    else:\n        print(\"Invalid number\")\n\nprint(\"Number accepted\")\n"},{"id":"22938217-820d-4831-9caf-7488fdfe61cf","name":"Verification","guide":"# Verification\n\nVerification checks that data was **entered accurately**, usually by asking\nfor it twice and comparing. You meet this every time a website asks you to type\nyour password twice.\n\n## Task\nAsk for an email address twice.\n\n* if they match: print `Verified`\n* if not: print `Not verified`\n\n\u003e Validation and verification are different. Data can pass one and fail the\n\u003e other. A typo typed twice identically passes verification but may still be\n\u003e wrong.\n","starter":"# Ask for an email address twice and compare them.\n\n# TODO\n","tests":[{"in":["a@b.kr","a@b.kr"],"out":[{"pattern":"Verified","ignore":"wc"},{"typ":"-","pattern":"Not verified","ignore":"wc"}]},{"in":["a@b.kr","x@b.kr"],"out":[{"pattern":"Not verified","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nfirstEntry = input(\"Enter your email address: \")\nsecondEntry = input(\"Enter it again: \")\n\nif firstEntry == secondEntry:\n    print(\"Verified\")\nelse:\n    print(\"Not verified\")\n"},{"id":"theory-09","name":"Theory check","quiz":[{"type":"mcq","q":"Which check makes sure a percentage is between 0 and 100?","options":["Length check","Presence check","Range check","Format check"],"answer":2,"explain":"A range check tests that a value falls between two limits."},{"type":"mcq","q":"Which check makes sure the user did not leave a box empty?","options":["Presence check","Type check","Range check","Verification"],"answer":0,"explain":"A presence check tests that something was actually entered."},{"type":"blank","q":"Complete this range check so it rejects ages outside 0 to 120.","code":"while age \u003c 0 ____ age \u003e 120:","answer":["or"],"explain":"Use or. A number cannot be below 0 and above 120 at the same time, so and would never be true."},{"type":"mcq","q":"What is \u003cb\u003everification\u003c/b\u003e?","options":["Checking data is sensible","Checking data was entered accurately","Checking the data type","Checking the length"],"answer":1,"explain":"Verification checks data was copied or entered accurately, usually by asking for it twice."},{"type":"mcq","q":"Which check stops the program crashing when the user types \u003ccode\u003eten\u003c/code\u003e instead of \u003ccode\u003e10\u003c/code\u003e?","options":["Range check","Type check","Presence check","Format check"],"answer":1,"explain":"A type check, written with try and except, catches the ValueError before it stops the program."}]}]},{"id":"e273b1e2-320e-43f9-b220-1a85b6374606","name":"10. File handling","children":[{"id":"bdabdebb-32bc-4005-8dc3-55da1388f33d","name":"Example: reading a file","guide":"# File handling\n\nThree steps, always: **open**, use, **close**.\n\n| Mode | Meaning |\n|---|---|\n| `\"r\"` | read |\n| `\"w\"` | write - **erases the file first** |\n| `\"a\"` | append - adds to the end |\n\nEach line you read still has its newline character on the end, so `.strip()` is\nnearly always what you want.\n\nLook at the **Files** tab next to the console - you can see `names.txt` there.\n\n\u003e **Why store data in a file?** Variables vanish when the program ends. A file\n\u003e keeps the data so the next run can use it.\n","starter":"# EXAMPLE - names.txt sits next to this program.\n\nhandle = open(\"names.txt\", \"r\")\nfor line in handle:\n    print(line.strip())\nhandle.close()\n\nprint(\"---\")\n\n# Writing a new file\nout = open(\"output.txt\", \"w\")\nout.write(\"Hello from Python\\n\")\nout.close()\n","isExample":true,"additionalFiles":[{"filename":"names.txt","visible":true}],"files":{"names.txt":"Minji\nTom\nAisha\nJoon\nSara\n"}},{"id":"9ac478be-aa8a-44ed-a56e-c12f10db1722","name":"Count the lines","guide":"# Count the lines\n\n`names.txt` contains one name per line. Count them and print:\n\n```\n5 names\n```\n\n## Hint\nSet a counter to 0 before the loop and add 1 each time round. Do not hard-code\nthe answer - the file could change.\n","starter":"# Count the lines in names.txt\n\n# TODO\n","tests":[{"in":"","out":[{"pattern":"5 names","ignore":"wc"},{"typ":"c+","pattern":"open\\(","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nhandle = open(\"names.txt\", \"r\")\n\ncount = 0\nfor line in handle:\n    if line.strip() != \"\":\n        count = count + 1\n\nhandle.close()\n\nprint(count, \"names\")\n","additionalFiles":[{"filename":"names.txt","visible":true}],"files":{"names.txt":"Minji\nTom\nAisha\nJoon\nSara\n"}},{"id":"0633f58d-a65c-4b64-85f8-dcc0923e4e68","name":"Write a single item","guide":"# Writing single items of data\n\nInput a name and a score, then write **one line** to a file called\n`report.txt` in exactly this form:\n\n```\nMinji scored 45\n```\n\nThen print `Saved` on the screen.\n\n## Hint\n`write()` only accepts strings, so you need `str(score)` or an f-string.\nAlways `close()` the file when you have finished.\n","starter":"# Write one line of data to report.txt\n\n# TODO\n","tests":[{"in":["Minji",45],"out":[{"pattern":"Saved","ignore":"wc"},{"typ":"f+","filename":"report.txt","pattern":"Minji scored 45","ignore":"wc"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nname = input(\"Enter a name: \")\nscore = input(\"Enter a score: \")\n\nhandle = open(\"report.txt\", \"w\")\nhandle.write(name + \" scored \" + str(score) + \"\\n\")\nhandle.close()\n\nprint(\"Saved\")\n"},{"id":"1765a34f-1434-4668-b3f5-cc78c4b69379","name":"Append to a file","guide":"# Appending\n\nMode `\"w\"` **erases** the file first. Mode `\"a\"` **adds to the end**, keeping\nwhat was already there.\n\n## Task\nAsk for one new name, append it to `names.txt`, then read the whole file back\nand print every name.\n\nThe file should end up with **6** names.\n\n```\nEnter a new name: Yuna\nMinji\nTom\nAisha\nJoon\nSara\nYuna\n```\n\n## Hint\nRemember the newline: `handle.write(newName + \"\\n\")`\n","starter":"# Append a name to names.txt then print the whole file.\n\n# TODO\n","tests":[{"in":["Yuna"],"out":[{"pattern":"Minji"},{"pattern":"Yuna"},{"typ":"f+","filename":"names.txt","pattern":"Sara\\nYuna"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nnewName = input(\"Enter a new name: \")\n\nhandle = open(\"names.txt\", \"a\")\nhandle.write(newName + \"\\n\")\nhandle.close()\n\nhandle = open(\"names.txt\", \"r\")\nfor line in handle:\n    print(line.strip())\nhandle.close()\n","additionalFiles":[{"filename":"names.txt","visible":true}],"files":{"names.txt":"Minji\nTom\nAisha\nJoon\nSara\n"}},{"id":"d2346a38-3ac6-41a4-8924-b53917dc29fb","name":"Read a file into an array","guide":"# Reading a file into an array\n\nOnce the data is in an array you can search it, total it or sort it.\n\n## Task\nRead every name from `names.txt` into an array, then print:\n\n```\n5 names loaded\nFirst: Minji\nLast: Sara\n```\n\n## Hint\nCreate an empty array, then `.append(line.strip())` inside the loop. The last\nitem is at index `len(names) - 1`.\n","starter":"# Read names.txt into an array, then report on it.\n\nnames = []\n\n# TODO\n","tests":[{"in":"","out":[{"pattern":"5 names loaded","ignore":"wc"},{"pattern":"First: Minji","ignore":"w"},{"pattern":"Last: Sara","ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nnames = []\n\nhandle = open(\"names.txt\", \"r\")\nfor line in handle:\n    if line.strip() != \"\":\n        names.append(line.strip())\nhandle.close()\n\nprint(len(names), \"names loaded\")\nprint(\"First:\", names[0])\nprint(\"Last:\", names[len(names) - 1])\n","additionalFiles":[{"filename":"names.txt","visible":true}],"files":{"names.txt":"Minji\nTom\nAisha\nJoon\nSara\n"}},{"id":"theory-10","name":"Theory check","quiz":[{"type":"mcq","q":"What does opening a file in mode \u003ccode\u003e\"w\"\u003c/code\u003e do to a file that already exists?","options":["Adds to the end","Erases everything in it first","Nothing, it just reads it","Causes an error"],"answer":1,"explain":"Mode w wipes the file first. Use a to add to the end instead."},{"type":"blank","q":"Which mode adds new data to the end of a file without erasing it?","code":"handle = open(\"names.txt\", \"____\")","answer":["a"],"explain":"Mode a is append."},{"type":"mcq","q":"Why store data in a file rather than in variables?","options":["Files are faster","The data is still there after the program ends","Variables cannot hold text","Files use less memory"],"answer":1,"explain":"Variables vanish when the program stops. A file keeps the data for the next run."},{"type":"blank","q":"Complete the line that removes the newline character from the end of a line.","code":"print(line.____())","answer":["strip"],"explain":"Each line read from a file still has its newline on the end, so strip() tidies it."},{"type":"mcq","q":"What are the three steps of using a file?","options":["Open, use, close","Create, read, delete","Read, write, append","Open, save, exit"],"answer":0,"explain":"Always open, then use, then close. Forgetting to close can lose data."}]}]},{"id":"d7be7cd9-d073-4ba8-a694-55136e983615","name":"11. Maintainable programs","children":[{"id":"67ed9ee6-cf91-4059-8ed3-bd110b16b8b2","name":"Example: what makes a program maintainable","guide":"# Maintainable programs\n\nPrograms get read far more often than they get written - by your teacher, by an\nexaminer, and by you in six months when you have forgotten how it works.\n\nThe syllabus asks for:\n\n* **meaningful identifiers** for variables, constants, arrays, procedures and\n  functions\n* **comments** explaining what the code does\n* **procedures and functions** to break the program into named pieces\n\nCompare the two versions below. They do exactly the same thing.\n","starter":"# EXAMPLE - the same program written twice.\n\n# Version 1 - works, but what does it do?\na = 4500\nb = 3\nc = a * b\nprint(c)\n\nprint(\"---\")\n\n# Version 2 - identical behaviour, but you can read it\nLUNCHPRICE = 4500              # cost of one school lunch in won\nnumberOfLunches = 3            # how many the student is buying\ntotalCost = LUNCHPRICE * numberOfLunches\nprint(totalCost)\n","isExample":true},{"id":"47286645-dcd3-441f-8b55-112692db2b0f","name":"Meaningful identifiers","guide":"# Meaningful identifiers\n\nThe program below works, but the names tell you nothing.\n\n## Task\nRewrite it so it does exactly the same thing, but using these names instead:\n\n* `price` instead of `a`\n* `quantity` instead of `b`\n* `total` instead of `c`\n\nThe single-letter names `a`, `b` and `c` are **blocked** - the tests will\nreject them.\n\nThe output must stay exactly the same:\n\n```\nTotal: 13500\n```\n","starter":"# Rewrite this using meaningful identifiers.\n# The names a, b and c are blocked.\n\na = 4500\nb = 3\nc = a * b\nprint(\"Total:\", c)\n","tests":[{"in":"","out":[{"pattern":"Total: 13500","ignore":"w"},{"typ":"c+","pattern":"price","ignore":"w"},{"typ":"c+","pattern":"quantity","ignore":"w"},{"typ":"c+","pattern":"total","ignore":"w"},{"typ":"c-","pattern":"\\ba\\s*=","ignore":""},{"typ":"c-","pattern":"\\bb\\s*=","ignore":""},{"typ":"c-","pattern":"\\bc\\s*=","ignore":""}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\nprice = 4500\nquantity = 3\ntotal = price * quantity\nprint(\"Total:\", total)\n"},{"id":"7a801a09-ae9f-4679-821d-5328c0a48a7d","name":"Commenting your code","guide":"# Commenting\n\nA comment starts with `#`. Python ignores everything after it on that line.\n\nGood comments explain **why**, not **what**. `# add 1 to count` is useless -\nyou can see that. `# count how many students passed` is useful.\n\n## Task\nAdd a comment to **each** of the four lines below, explaining what that line is\nfor. The program must still print the same answer.\n\n```\nPass mark: 50\n```\n\nYou need at least **four** comments for the tests to accept it.\n","starter":"# Add a comment to each line explaining what it does.\n# You need at least four comments.\n\nPASSMARK = 50\nstudentScore = 62\nhasPassed = studentScore \u003e= PASSMARK\nprint(\"Pass mark:\", PASSMARK)\n","tests":[{"in":"","out":[{"pattern":"Pass mark: 50","ignore":"w"},{"typ":"c+","pattern":"#[\\s\\S]*#[\\s\\S]*#[\\s\\S]*#"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\n# The mark a student must reach to pass this test\nPASSMARK = 50\n\n# The mark this student actually achieved\nstudentScore = 62\n\n# True if the student reached the pass mark, otherwise False\nhasPassed = studentScore \u003e= PASSMARK\n\n# Show the pass mark to the user\nprint(\"Pass mark:\", PASSMARK)\n"},{"id":"13e278e6-efb9-437a-a8b6-466d4d078e54","name":"Break it into subroutines","guide":"# Using subroutines to tidy a program\n\nThe program below repeats the same three lines twice. That is a warning sign:\nif you change the heading you must remember to change it in both places.\n\n## Task\nRewrite it using a **procedure** called `showHeading()` that prints the three\nheading lines, then call it twice.\n\nThe output must be exactly the same as before.\n\n## Hint\n```python\ndef showHeading():\n    print(...)\n```\n","starter":"# Rewrite this using a procedure called showHeading()\n\nprint(\"==============================\")\nprint(\"      School shop\")\nprint(\"==============================\")\nprint(\"Item 1: Pencil\")\nprint(\"==============================\")\nprint(\"      School shop\")\nprint(\"==============================\")\n","tests":[{"in":"","out":[{"pattern":"School shop","count":2,"ignore":"wc"},{"pattern":"Item 1: Pencil","ignore":"wc"},{"typ":"c+","pattern":"def showHeading","ignore":"w"},{"typ":"c+","pattern":"showHeading\\(\\)","count":3,"ignore":"w"}]}],"solution":"# MODEL SOLUTION\n# One correct answer - not the only one.\n\ndef showHeading():\n    print(\"==============================\")\n    print(\"      School shop\")\n    print(\"==============================\")\n\n\nshowHeading()\nprint(\"Item 1: Pencil\")\nshowHeading()\n"},{"id":"theory-11","name":"Theory check","quiz":[{"type":"mcq","q":"Which is the most \u003cb\u003emeaningful identifier\u003c/b\u003e?","options":["\u003ccode\u003ex\u003c/code\u003e","\u003ccode\u003en1\u003c/code\u003e","\u003ccode\u003etotalCost\u003c/code\u003e","\u003ccode\u003ething\u003c/code\u003e"],"answer":2,"explain":"A meaningful identifier says what the value is for, so the program can be read without guessing."},{"type":"blank","q":"Which symbol starts a comment in Python?","code":"____ work out the total cost","answer":["#"],"explain":"Python ignores everything after # on that line."},{"type":"mcq","q":"What is the main benefit of using subroutines?","options":["Programs run faster","Code is written once and reused, so it is easier to change","They use less memory","They avoid the need for comments"],"answer":1,"explain":"Write it once, call it many times. Change the subroutine and every use of it changes too."},{"type":"mcq","q":"Which is the better comment?","options":["\u003ccode\u003e# add 1 to count\u003c/code\u003e","\u003ccode\u003e# count how many students passed\u003c/code\u003e","\u003ccode\u003e# count\u003c/code\u003e","\u003ccode\u003e# this is a variable\u003c/code\u003e"],"answer":1,"explain":"A good comment explains why the line is there. You can already see what it does."},{"type":"mcq","q":"Why are constants written in CAPITALS?","options":["Python requires it","It makes them run faster","So nobody changes them by accident","To save memory"],"answer":2,"explain":"It is a convention that signals to any reader that the value is not meant to change."}]}]}]}</script>

<script>/* Runs student Python under Skulpt.
   Works in Node (for tests) and in the browser (embedded in the workbook). */
(function (root) {
"use strict";

/* Prelude is prepended to the student's code. It defines input() and open()
   inside the module namespace, so they shadow the builtins.
   NOTE: names must not start with a double underscore - inside a class body
   Python mangles __name to _Class__name, which would break the globals. */
function prelude(inputs, files) {
  return [
    "_sk_in = " + JSON.stringify(inputs),
    "_sk_idx = [0]",
    "_sk_files = " + JSON.stringify(files),
    "_sk_evals = {}",
    "def input(prompt=''):",
    "    print(prompt, end='')",
    "    if _sk_idx[0] >= len(_sk_in):",
    "        raise Exception('__NEED_INPUT__')",
    "    v = _sk_in[_sk_idx[0]]",
    "    _sk_idx[0] = _sk_idx[0] + 1",
    "    print(v)",
    "    return v",
    "class _SkFile:",
    "    def __init__(self, n, m):",
    "        self.name = n",
    "        self.mode = m",
    "        self.pos = 0",
    "        if 'r' in m:",
    "            if n not in _sk_files:",
    "                raise IOError(\"No such file: '\" + n + \"'\")",
    "            self.data = _sk_files[n]",
    "        elif 'a' in m and n in _sk_files:",
    "            self.data = _sk_files[n]",
    "        else:",
    "            self.data = ''",
    "            _sk_files[n] = ''",
    "    def _lines(self):",
    "        if self.data == '':",
    "            return []",
    "        parts = self.data.split('\\n')",
    "        out = []",
    "        i = 0",
    "        while i < len(parts):",
    "            if i < len(parts) - 1:",
    "                out.append(parts[i] + '\\n')",
    "            elif parts[i] != '':",
    "                out.append(parts[i])",
    "            i = i + 1",
    "        return out",
    "    def read(self):",
    "        return self.data",
    "    def readlines(self):",
    "        return self._lines()",
    "    def readline(self):",
    "        ls = self._lines()",
    "        if self.pos >= len(ls):",
    "            return ''",
    "        self.pos = self.pos + 1",
    "        return ls[self.pos - 1]",
    "    def __iter__(self):",
    "        return iter(self._lines())",
    "    def write(self, s):",
    "        self.data = self.data + str(s)",
    "        _sk_files[self.name] = self.data",
    "    def close(self):",
    "        _sk_files[self.name] = self.data",
    "    def __enter__(self):",
    "        return self",
    "    def __exit__(self, a, b, c):",
    "        self.close()",
    "        return False",
    "def open(n, m='r'):",
    "    return _SkFile(n, m)",
    "",

}

/* statements to evaluate after the program finishes (for `s+` tests) */
function evalTail(statements) {
  if (!statements || !statements.length) return "";
  let s = "\n";
  for (const st of statements) {
    const key = JSON.stringify(st);
    s += "try:\n    _sk_evals[" + key + "] = str(" + st + ")\n" +
         "except Exception as _sk_e:\n    _sk_evals[" + key + "] = '\\x01' + str(_sk_e)\n";
  }
  return s;
}

function remap(Sk, v) {
  if (v === undefined || v === null) return null;
  try { return Sk.ffi.remapToJs(v); } catch (e) { return null; }
}

async function run(Sk, opts) {
  const code = opts.code || "";
  const pre = prelude(opts.inputs || [], opts.files || {});
  const offset = (pre.match(/\n/g) || []).length;
  const full = pre + code + "\n" + evalTail(opts.statements);

  let out = "";
  Sk.configure({
    output: t => { out += t; },
    read: f => {
      if (!Sk.builtinFiles || Sk.builtinFiles.files[f] === undefined)
        throw "File not found: '" + f + "'";
      return Sk.builtinFiles.files[f];
    },
    __future__: Sk.python3,
    execLimit: opts.limit || 8000,
    killableWhile: true,
    killableFor: true,
  });

  const r = { status: "ok", output: "", error: "", line: 0, used: 0, files: {}, evals: {} };
  let mod = null;
  try {
    mod = await Sk.misceval.asyncToPromise(
      () => Sk.importMainWithBody("<stdin>", false, full, true));
  } catch (e) {
    const msg = (() => {
      try { return Sk.builtin.str(e).v; } catch (_) { return String(e); }
    })();
    const name = (e && e.tp$name) || "Error";
    if (msg.indexOf("__NEED_INPUT__") !== -1) {
      r.status = "need_input";
    } else if (name === "TimeLimitError") {
      r.status = "error";
      r.error = "Your program ran for too long and was stopped.\n" +
                "Check that every loop can actually finish.";
    } else {
      r.status = "error";
      r.error = name + ": " + msg;
      const tb = (e && e.traceback) || [];
      if (tb.length && tb[0].lineno) r.line = Math.max(0, tb[0].lineno - offset);
    }
  }
  r.output = out;
  if (mod && mod.$d) {
    const idx = remap(Sk, mod.$d._sk_idx);
    r.used = idx ? idx[0] : 0;
    r.files = remap(Sk, mod.$d._sk_files) || {};
    r.evals = remap(Sk, mod.$d._sk_evals) || {};
  }
  return r;
}

root.SkRunner = { run, prelude, evalTail };

/* ================= markdown ================= */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const KW = new Set(("False None True and as assert async await break class continue def del "+
 "elif else except finally for from global if import in is lambda nonlocal not or pass "+
 "raise return try while with yield print input int str float len range open append "+
 "upper lower strip split join sorted sort max min sum abs round").split(" "));
const SOFT = new Set("print input int str float len range open append upper lower strip split join sorted sort max min sum abs round".split(" "));

function hi(src){
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += '<span class="tok-com">' + esc(t) + "</span>";
    else if (m[2]) out += '<span class="tok-str">' + esc(t) + "</span>";
    else if (m[3]) out += '<span class="tok-num">' + esc(t) + "</span>";
    else if (KW.has(t)) out += '<span class="' + (SOFT.has(t) ? "tok-fn" : "tok-kw") + '">' + esc(t) + "</span>";
    else out += esc(t);
    last = m.index + t.length;
  }
  return out + esc(src.slice(last));
}

function inline(s){
  let t = esc(s);
  // park code spans so ** and * inside them are never treated as markup
  const held = [];
  t = t.replace(/`([^`]+)`/g, (_, c) => "\u0000" + (held.push(c) - 1) + "\u0000");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + held[i] + "</code>");
  return t;
}

function md(src){
  const L = src.replace(/\r/g, "").split("\n");
  const o = [];
  let i = 0;
  const cell = r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(x => x.trim());
  while (i < L.length) {
    const ln = L[i];
    if (/^```/.test(ln)) {
      const buf = []; i++;
      while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      i++;
      o.push("<pre><code>" + hi(buf.join("\n")) + "</code></pre>");
    } else if (/^(#{1,4})\s+/.test(ln)) {
      const m = ln.match(/^(#{1,4})\s+(.*)$/);
      const h = Math.min(m[1].length, 3);
      o.push("<h" + h + ">" + inline(m[2]) + "</h" + h + ">"); i++;
    } else if (/^\s*\|/.test(ln) && i + 1 < L.length && /^\s*\|?[\s:|-]+$/.test(L[i+1]) && L[i+1].includes("-")) {
      const head = cell(ln); i += 2;
      const rows = [];
      while (i < L.length && /^\s*\|/.test(L[i])) rows.push(cell(L[i++]));
      o.push("<table><thead><tr>" + head.map(c => "<th>" + inline(c) + "</th>").join("") +
        "</tr></thead><tbody>" + rows.map(r => "<tr>" +
        r.map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>");
    } else if (/^>\s?/.test(ln)) {
      const buf = [];
      while (i < L.length && /^>\s?/.test(L[i])) buf.push(L[i++].replace(/^>\s?/, ""));
      o.push("<blockquote>" + md(buf.join("\n")) + "</blockquote>");
    } else if (/^\s*[-*]\s+/.test(ln)) {
      const buf = [];
      while (i < L.length && /^\s*[-*]\s+/.test(L[i])) buf.push(L[i++].replace(/^\s*[-*]\s+/, ""));
      o.push("<ul>" + buf.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>");
    } else if (/^\s*\d+\.\s+/.test(ln)) {
      const buf = [];
      while (i < L.length && /^\s*\d+\.\s+/.test(L[i])) buf.push(L[i++].replace(/^\s*\d+\.\s+/, ""));
      o.push("<ol>" + buf.map(x => "<li>" + inline(x) + "</li>").join("") + "</ol>");
    } else if (/^\s*---+\s*$/.test(ln)) { o.push("<hr>"); i++; }
    else if (ln.trim() === "") { i++; }
    else {
      const buf = [];
      while (i < L.length && L[i].trim() !== "" && !/^(```|#{1,4}\s|>|\s*[-*]\s|\s*\d+\.\s|\s*\|)/.test(L[i])) buf.push(L[i++]);
      o.push("<p>" + inline(buf.join(" ")) + "</p>");
    }
  }
  return o.join("\n");
}

/* CTX holds the files and statement values produced by the most recent run,

let CTX = { files: {}, evals: {} };
function getFile(n){ const v = CTX.files[n]; return v === undefined ? null : v; }
function pyEval(stmt){
  const v = CTX.evals[stmt];
  if (v === undefined) return { ok: false, value: "not evaluated" };
  if (typeof v === "string" && v.charCodeAt(0) === 1) return { ok: false, value: v.slice(1) };
  return { ok: true, value: v };
}

/* every run starts from a clean copy of the challenge's input files */
function startFiles(ch){

/* ================= test checking ================= */
function norm(t, f){
  if (f.includes("w")) t = t.replace(/[ \t]+/g, "");
  if (f.includes("p")) t = t.replace(/[^\w\s]/g, "");
  return t;
}
function countMatches(subj, pat, f){
  let re;
  try { re = new RegExp(pat, f.includes("c") ? "gi" : "g"); }
  catch (e) { return subj.includes(pat) ? 1 : 0; }
  return (subj.match(re) || []).length;
}
function describe(req){
  const p = "<code>" + esc(req.pattern) + "</code>";
  switch (req.typ || "+") {
    case "-":  return "the output should not include " + p;
    case "c+": return "your code needs to use " + p;
    case "c-": return "your code must not use " + p;
    case "f+": return "the file <code>" + esc(req.filename) + "</code> should contain " + p;
    case "f-": return "the file <code>" + esc(req.filename) + "</code> should not contain " + p;
    case "s+": return "<code>" + esc(req.statement) + "</code> should give " + p;
    case "s-": return "<code>" + esc(req.statement) + "</code> should not give " + p;
    default:   return "the output should include " + p;
  }
}
function checkReq(req, out, code){
  const typ = req.typ || "+", f = req.ignore || "";
  let subj = "";
  if (typ === "c+" || typ === "c-") subj = code;
  else if (typ === "f+" || typ === "f-") subj = getFile(req.filename) || "";
  else if (typ === "s+" || typ === "s-") {
    const r = pyEval(req.statement);
    if (!r.ok) return { ok: false, why: "<code>" + esc(req.statement) + "</code> could not run (" + esc(r.value) + ")" };
    subj = r.value;
  } else subj = out;
  const n = countMatches(norm(subj, f), norm(req.pattern, f), f);
  const pos = typ === "+" || typ === "c+" || typ === "f+" || typ === "s+";
  const cnt = req.count == null ? -1 : req.count;
  let ok;
  if (cnt !== -1) ok = pos ? n === cnt : n !== cnt;
  else ok = pos ? n > 0 : n === 0;
  let why = describe(req);
  if (cnt !== -1 && pos) why += " exactly " + cnt + " times (found " + n + ")";
  return { ok, why };
}

async function runTests(ch, code){
  const results = [];
  for (const t of ch.tests) {
    const ins = t.in == null ? [] : (Array.isArray(t.in) ? t.in.map(String) : (t.in === "" ? [] : String(t.in).split("\n")));
    let reqList = t.out;
    if (typeof reqList === "string") reqList = [{ pattern: reqList }];
    const stmts = (reqList || []).filter(q => q.statement).map(q => q.statement);
    const r = await pyRun(code, ins, ch, stmts);
    const row = { ins, ok: false, why: "", output: r.output };
    if (r.status === "error") { row.why = "your program stopped with an error"; }
    else if (r.status === "need_input") { row.why = "your program asked for more input than the test provides"; }
    else {
      row.ok = true;
      for (const req of reqList || []) {
        const c = checkReq(req, r.output, code);
        if (!c.ok) { row.ok = false; row.why = c.why; break; }
      }
    }
    results.push(row);
  }
  return results;
}

/* ================= editor ================= */
const ed = $("ed"), gutter = $("gutter"), edhl = $("edhl");

/* repaints the highlight layer and the line numbers.
   errLine > 0 marks that line in the gutter. */
function paintCode(errLine){
  const v = ed.value;
  // trailing newline keeps the last line from collapsing in the <pre>
  edhl.firstChild.innerHTML = hi(v) + "\n";
  const lines = v.split("\n").length;
  let g = "";
  for (let i = 1; i <= lines; i++)
    g += (i === errLine ? '<span class="err">' + i + "</span>" : String(i)) +
         (i < lines ? "\n" : "");
  gutter.innerHTML = g;
  syncScroll();
}
const syncGutter = () => paintCode(0);

ed.addEventListener("input", () => {
  paintCode(0);

});
ed.addEventListener("scroll", syncScroll);
ed.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault(); doRun(false); return;
  }
  if (e.key === "Tab") {
    e.preventDefault();
    const s = ed.selectionStart, t = ed.selectionEnd;
    ed.value = ed.value.slice(0, s) + "    " + ed.value.slice(t);
    ed.selectionStart = ed.selectionEnd = s + 4;
    ed.dispatchEvent(new Event("input"));
  } else if (e.key === "Enter") {
    const s = ed.selectionStart;
    const line = ed.value.slice(0, s).split("\n").pop();
    const pad = (line.match(/^[ \t]*/) || [""])[0];
    const extra = /:\s*$/.test(line) ? "    " : "";
    if (pad || extra) {
      e.preventDefault();
      const ins = "\n" + pad + extra;
      ed.value = ed.value.slice(0, s) + ins + ed.value.slice(ed.selectionEnd);
      ed.selectionStart = ed.selectionEnd = s + ins.length;
      ed.dispatchEvent(new Event("input"));
    }
  }
});

      h += '<li><span class="mark ' + (r.ok ? "ok" : "no") + '">' + (r.ok ? "✓" : "✕") + "</span><div>" +
        "Test " + (i + 1) + (r.ins.length ? " · input " + esc(r.ins.join(", ")) : "") +
        (r.ok ? "" : '<span class="why">' + r.why + "</span>") + "</div></li>";
    });
    b.innerHTML = h + "</ul>";
    return;
  }
  if (!lastRun) { b.innerHTML = '<p class="note">Press “Run” to try your code.</p>'; return; }
  const r = lastRun.run;
  let h = '<pre class="out">' + esc(r.output || "") + "</pre>";
  if (r.status === "error") {
    h += '<p class="err">' + esc(r.error) + (r.line ? "\n  line " + r.line + ": " + esc((ed.value.split("\n")[r.line - 1] || "").trim()) : "") + "</p>";
  }
  b.innerHTML = h;
  if (r.status === "need_input") {
    const row = document.createElement("div");
    row.className = "in-row";
    row.innerHTML = '<span class="caret">▸</span>';
    const inp = document.createElement("input");
    inp.setAttribute("aria-label", "Program input");
    inp.autocomplete = "off";
    row.appendChild(inp);
    b.appendChild(row);
    inp.focus();
    inp.onkeydown = e => {
      if (e.key !== "Enter") return;
      liveInputs.push(inp.value);
      doRun(true);
    };
  }
  b.scrollTop = b.scrollHeight;
}

/* ================= actions ================= */
function markTried(){
  if (!state.done[state.cur]) {
    const first = !state.tried[state.cur];
    state.tried[state.cur] = true; save(); renderSide();
    const ch = BY_ID[state.cur];
    if (first && !ch.tests && !ch.quiz) report(state.cur, false);
  }
}
function markDone(){
  if (!state.done[state.cur]) {
    state.done[state.cur] = true; save(); renderSide();
    const ch = BY_ID[state.cur];
    if (!ch.tests && !ch.quiz) report(state.cur, true);
  }
  if (BY_ID[state.cur].solution) $("solBtn").hidden = false;
}

async function doRun(keepInputs){
  if (!ready || busy) return;
  busy = true; setStatus("running"); $("runBtn").disabled = true;
  if (!keepInputs) liveInputs = [];
  const ch = BY_ID[state.cur];
  try {
    const r = await pyRun(ed.value, liveInputs, ch, []);
    lastRun = { run: r, tests: lastRun && lastRun.tests, files: r.files };
    paintCode(r.status === "error" ? r.line : 0);
    setView("out");
    if (r.status === "ok" && ch.isExample) markDone();
    else if (r.status !== "need_input") markTried();
  } finally {
    busy = false; $("runBtn").disabled = false; setStatus("ready");
  }
}

async function doCheck(){
  const ch = BY_ID[state.cur];
  if (!ready || busy) return;
  if (!ch.tests) { doRun(false); return; }
  busy = true; setStatus("checking"); $("checkBtn").disabled = true;
  try {
    const rs = await runTests(ch, ed.value);
    lastRun = { run: (lastRun && lastRun.run) || { status: "ok", output: "" },
                tests: rs, files: (lastRun && lastRun.files) || {} };
    const pass = rs.every(r => r.ok);
    const pill = $("resPill");
    pill.hidden = false;
    pill.textContent = rs.filter(r => r.ok).length + "/" + rs.length;
    pill.className = "pill " + (pass ? "ok" : "no");
    if (pass) markDone(); else markTried();
    report(state.cur, pass);
    setView("res");
  } finally {
    busy = false; $("checkBtn").disabled = false; setStatus("ready");
  }
}

$("runBtn").onclick = () => doRun(false);
$("checkBtn").onclick = doCheck;
$("resetBtn").onclick = () => {
  if (!confirm("Replace your code with the starter code?")) return;
  ed.value = BY_ID[state.cur].starter || "";
  state.code[state.cur] = ed.value;
  syncGutter(); save();
};
$("solBtn").onclick = () => {
  const ch = BY_ID[state.cur];
  if (!ch.solution) return;
  if (!confirm("Show a model answer? Your own code will stay in the console history only.")) return;
  ed.value = ch.solution;
  state.code[state.cur] = ed.value;
  syncGutter(); save();
};

/* ================= theory checks ================= */
function quizAnswers(id){
  if (!state.quiz) state.quiz = {};
  if (!state.quiz[id]) state.quiz[id] = {};
  return state.quiz[id];
}

function renderQuiz(ch){
  const saved = quizAnswers(ch.id);
  let h = '<div class="quiz"><h1>' + esc(ch.name) + "</h1>" +
    '<p class="lede">' + ch.quiz.length + " questions on " +
    esc(SECTION_OF[ch.id] || "this section") +
    ". Answer them all, then check.</p>";

  ch.quiz.forEach((q, i) => {
    h += '<div class="qcard" id="q' + i + '"><p class="qnum">Question ' + (i + 1) + "</p>" +
         '<div class="qtext">' + q.q + "</div>";
    if (q.type === "mcq") {
      q.options.forEach((opt, j) => {
        const on = saved[i] === j ? " checked" : "";
        h += '<label class="opt"><input type="radio" name="q' + i + '" value="' + j + '"' +
             on + "><span>" + opt + "</span></label>";
      });
    } else {
      const val = saved[i] == null ? "" : esc(String(saved[i]));
      const parts = esc(q.code).split("____");
      h += '<div class="qcode">' + parts[0] +
           '<input type="text" data-q="' + i + '" value="' + val +
           '" autocomplete="off" spellcheck="false" aria-label="Missing code">' +
           (parts[1] || "") + "</div>";
    }
    h += '<div class="why" hidden></div></div>';
  });

  h += '<div class="qbar"><button class="btn check" id="qCheck">Check answers</button>' +
       '<span class="qscore" id="qScore"></span></div></div>';
  $("guide").innerHTML = h;
  $("guide").scrollTop = 0;

  $("guide").querySelectorAll('input[type=radio]').forEach(r => {
    r.onchange = () => { quizAnswers(ch.id)[+r.name.slice(1)] = +r.value; save(); };
  });
  $("guide").querySelectorAll('input[type=text]').forEach(t => {
    t.oninput = () => { quizAnswers(ch.id)[+t.dataset.q] = t.value; save(); };
  });
  $("qCheck").onclick = () => markQuiz(ch);
}

function markQuiz(ch){
  const saved = quizAnswers(ch.id);
  let right = 0;
  ch.quiz.forEach((q, i) => {
    let ok;
    if (q.type === "mcq") ok = saved[i] === q.answer;
    else {
      const given = String(saved[i] == null ? "" : saved[i]).trim().toLowerCase();
      ok = given !== "" && q.answer.some(a => a.toLowerCase() === given);
    }
    if (ok) right++;
    const card = $("q" + i);
    card.className = "qcard " + (ok ? "right" : "wrong");
    const why = card.querySelector(".why");
    why.hidden = false;
    why.innerHTML = "<b>" + (ok ? "Correct." : "Not yet.") + "</b> " + q.explain;
  });
  const all = right === ch.quiz.length;
  $("qScore").textContent = right + " out of " + ch.quiz.length +
    (all ? " - section complete" : "");
  if (all) { markDone(); } else { markTried(); }
  report(ch.id, all);
}

/* ================= navigation ================= */
function renderSide(){
  const el = $("side");
  el.innerHTML = SECTIONS.map(s =>
    "<h2>" + esc(s.name) + "</h2><ul>" + s.items.map(it => {
      const cls = state.done[it.id] ? "done" : (state.tried[it.id] ? "tried" : "");
      return '<li><button class="ch ' + cls + '" data-id="' + it.id + '"' +
        (it.id === state.cur ? ' aria-current="true"' : "") +
        '><span class="dot"></span><span>' + esc(it.name) + "</span></button></li>";
    }).join("") + "</ul>").join("");
  el.querySelectorAll(".ch").forEach(b => b.onclick = () => {
    go(b.dataset.id);
    document.body.classList.remove("nav");
  });
}

function go(id){
  state.cur = id; save();
  const ch = BY_ID[id];
  $("chTitle").textContent = ch.name;
  document.body.classList.toggle("quizmode", !!ch.quiz);
  if (ch.quiz) {
    $("chKind").textContent = ch.quiz.length + " questions";
    renderQuiz(ch);
    renderSide();
    return;
  }
  $("chKind").textContent = ch.isExample ? "example" : (ch.tests ? ch.tests.length + " tests" : "open task");
  $("guide").innerHTML = md(ch.guide || "");
  $("guide").scrollTop = 0;
  ed.value = state.code[id] != null ? state.code[id] : (ch.starter || "");
  syncGutter();
  lastRun = null; liveInputs = [];
  $("resPill").hidden = true;
  $("tabFiles").hidden = !(ch.additionalFiles && ch.additionalFiles.length);
  $("checkBtn").textContent = ch.tests ? "Check answer" : "Run";
  $("checkBtn").hidden = !ch.tests;
  $("solBtn").hidden = !(ch.solution && state.done[id]);
  setView("out");
  renderSide();
}

$("menuBtn").onclick = () => document.body.classList.toggle("nav");
$("scrim").onclick = () => document.body.classList.remove("nav");
$("mtTask").onclick = () => setMV("task");
$("mtCode").onclick = () => setMV("code");
function setMV(v){
  document.body.dataset.mv = v;
  $("mtTask").setAttribute("aria-selected", v === "task");
  $("mtCode").setAttribute("aria-selected", v === "code");
}

/* ================= report ================= */
$("reportBtn").onclick = () => {
  const rows = SECTIONS.map(s => {
    const total = s.items.length;
    const done = s.items.filter(i => state.done[i.id]).length;
    return { name: s.name, done, total };
  });
  const td = rows.reduce((a, r) => a + r.done, 0);
  const tt = rows.reduce((a, r) => a + r.total, 0);
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = '<div class="sheet" role="dialog" aria-label="Progress"><h2>Progress</h2>' +
    '<p class="sub">' + td + " of " + tt + " finished" +
    (memOnly ? " · not being saved" : REMOTE ? " · saved to your teacher's sheet" : "") +
    "</p><table><tbody>" +
    rows.map(r => "<tr><td>" + esc(r.name) + '</td><td style="width:38%"><div class="meter"><i style="width:' +
      (r.total ? Math.round(r.done / r.total * 100) : 0) + '%"></i></div></td><td class="n">' +
      r.done + " / " + r.total + "</td></tr>").join("") +
    "</tbody></table>" +
    '<p class="sub">Class: <b>' + esc(state.className || "not chosen") + "</b></p>" +
    '<div class="row"><button class="btn" id="mClose">Close</button>' +
    '<button class="btn" id="mClass">Change class</button>' +
    '<button class="btn" id="mWipe">Clear all progress</button></div></div>';
  document.body.appendChild(m);
  const close = () => m.remove();
  m.onclick = e => { if (e.target === m) close(); };
  $("mClose").onclick = close;
  $("mClass").onclick = () => { close(); askClass(); };
  $("mWipe").onclick = () => {
    if (!confirm("Clear all saved code and progress? This cannot be undone.")) return;
    const keepClass = state.className;
    state = { cur: ORDER[0], code: {}, done: {}, tried: {}, quiz: {},
              className: keepClass };
    save(); close(); go(state.cur);
  };
};

/* ================= start ================= */
(async function(){
  await load();
  renderSide();
  go(state.cur);
  showWho();
  // ask while the Python engine loads in the background
  const ready = boot();
  if (!state.className) await askClass();
  await ready;
})();
</script>
